<!doctype html>
<meta charset="utf-8">
<title>CSP report-uri delivers a serialized violation asynchronously</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  const image = new Image();
  t.add_cleanup(() => image.remove());
  const eventPromise = new Promise(resolve => {
    document.addEventListener('securitypolicyviolation', resolve, {once: true});
  });
  image.src = '/security/resources/abe.png';
  document.body.append(image);
  const event = await eventPromise;
  assert_equals(event.effectiveDirective, 'img-src');
  const cookie = document.cookie.split(';').map(value => value.trim())
      .find(value => value.startsWith('csp3-report-uri='));
  assert_true(!!cookie, 'The response supplied its unique report identifier');
  const id = cookie.slice('csp3-report-uri='.length);
  const endpoint = '/reporting/resources/report.py?op=retrieve_report&timeout=3&reportID=' + id;
  const response = await fetch(endpoint);
  const reports = await response.json();
  assert_true(Array.isArray(reports), 'The endpoint returns a report list');
  assert_greater_than(reports.length, 0, 'The report reached the server');
  const report = reports[0]['csp-report'];
  assert_equals(report['document-uri'], location.href);
  assert_equals(report['blocked-uri'], location.origin + '/security/resources/abe.png');
  assert_equals(report['effective-directive'], 'img-src');
  assert_equals(report.disposition, 'enforce');
  assert_equals(report['status-code'], 200);
}, 'report-uri POST reaches the endpoint with the deprecated CSP body');
</script>
