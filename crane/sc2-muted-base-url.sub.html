<!doctype html>
<meta charset="utf-8">
<title>A muted classic script has a sanitized import base URL</title>
<link rel="help" href="https://github.com/whatwg/html/pull/5753">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  const script = document.createElement('script');
  script.src = 'http://{{domains[www2]}}:{{ports[http][0]}}/crane/sc2-muted-classic.js';
  t.add_cleanup(() => script.remove());
  await new Promise((resolve, reject) => {
    script.onload = resolve;
    script.onerror = reject;
    document.body.append(script);
  });
  await promise_rejects_js(t, TypeError, window.sc2RedirectResult);
}, 'A no-CORS cross-origin classic script cannot resolve a relative import');
</script>
