<!DOCTYPE html>
<meta charset="utf-8">
<title>An object's fetch, and its navigable's document, delay its document's load event</title>
<link rel=help href="https://html.spec.whatwg.org/multipage/iframe-embed-object.html#the-object-element">
<link rel=help href="https://html.spec.whatwg.org/multipage/parsing.html#delay-the-load-event">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
// "This task being queued or actively running must delay the load event of
// the element's node document", and "fetching the resource must delay the
// load event of the element's node document until the task that is queued
// by the networking task source once the resource has been fetched has
// been run" (4.8.7). An object whose data is a document then shows it in a
// child navigable, whose navigation delays the load event until its
// document has loaded (and the object's load event has fired). The same for
// embed (4.8.6: "Fetching the resource must delay the load event").
window.childLoaded = 0;
const events = [];
const t = async_test("the window's load event waits for the objects and the embed");
window.addEventListener("load", t.step_func_done(() => {
  events.push("window");
  assert_equals(window.childLoaded, 2, "both child documents ran their scripts first");
  assert_array_equals(events.slice().sort(), ["embed", "object-document", "object-image", "object-slow", "window"].sort(), "every load fired");
  assert_equals(events[events.length - 1], "window", "the window's last");
}));
</script>
<object data="obj-load-delay-child.html" onload="events.push('object-document')"></object>
<object data="/images/blue.png" onload="events.push('object-image')"></object>
<object data="/common/slow.py?delay=500" type="text/plain" onload="events.push('object-slow')" onerror="events.push('object-slow')"></object>
<embed src="obj-load-delay-child.html" onload="events.push('embed')">
</body>
