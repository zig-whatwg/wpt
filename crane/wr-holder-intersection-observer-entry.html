<!DOCTYPE html>
<meta charset="utf-8">
<title>Crane: an IntersectionObserverEntry keeps its target's wrapper and tree</title>
<link rel=help href="https://w3c.github.io/IntersectionObserver/#dom-intersectionobserverentry-target">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
"use strict";
// The wrapper redesign's P6 (tmp/redesign/wrapper-redesign-design.md 3.2
// rule (d), 4.4 "Holders"): a holder whose wrapper is kept keeps the wrappers
// of the nodes it holds for script, and of their trees. Blink's
// IntersectionObserverEntry::Trace visits target_
// (core/intersection_observer/intersection_observer_entry.cc, Chromium
// 131.0.6778.0).
// Mirrored with every node edge off in tests/v8/wr6_holder_tracing_test.zig.

function nextTask(t) {
  return new Promise(resolve => t.step_timeout(resolve, 0));
}
async function collect(t) {
  for (let i = 0; i < 3; i++) {
    await nextTask(t);
    await TestUtils.gc();
  }
  await nextTask(t);
}

function entryOfDetached() {
  const target = document.createElement("div");
  target.wr = "t";
  target.appendChild(document.createElement("i")).wr = "i";
  const rect = { x: 0, y: 0, width: 0, height: 0 };
  const entry = new IntersectionObserverEntry({ time: 0, rootBounds: rect, boundingClientRect: rect, intersectionRect: rect, isIntersecting: false, isVisible: false, intersectionRatio: 0, target });
  return { entry, refs: [new WeakRef(target), new WeakRef(target.firstChild)] };
}

promise_test(async t => {
  assert_true(!!(self.TestUtils && TestUtils.gc), "TestUtils.gc is available");
  const { entry, refs } = entryOfDetached();
  await collect(t);
  assert_equals(entry.target.wr, "t");
  assert_equals(entry.target.firstChild.wr, "i");
  assert_equals(refs[0].deref(), entry.target, "the same wrapper");
}, "an entry keeps its detached target's wrapper and its tree's");

promise_test(async t => {
  const refs = (() => entryOfDetached().refs)();
  await collect(t);
  assert_array_equals(refs.map(r => r.deref() === undefined), refs.map(() => true), "every wrapper is collected");
}, "a dropped entry lets its target go");
</script>
