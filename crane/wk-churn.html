<!DOCTYPE html>
<meta charset="utf-8">
<title>Workers created and terminated one after another</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/workers.html#terminate-a-worker">
<meta name="timeout" content="long">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// Forty workers in turn, each terminated once it has run: a terminated
// worker's realm and isolate go, so the process does not grow by one isolate
// per worker. Run under `/usr/bin/time -l` to compare maximum resident size.
function workerFrom(source) {
  return new Worker(URL.createObjectURL(new Blob([source], { type: "text/javascript" })));
}
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

promise_test(async () => {
  for (let i = 0; i < 40; i++) {
    const worker = workerFrom(`
      const big = new Array(200000).fill(0).map((_, i) => ({ i }));
      postMessage(big.length);
    `);
    const n = await new Promise(resolve => { worker.onmessage = e => resolve(e.data); });
    assert_equals(n, 200000);
    worker.terminate();
    await wait(20);
  }
}, "forty workers, each terminated after it has run");
</script>
