<!DOCTYPE html>
<meta charset="utf-8">
<title>Web Locks: request(), query() and Lock, in a window</title>
<link rel="help" href="https://w3c.github.io/web-locks/">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
"use strict";
let counter = 0;
const unique = () => `wl-basics-${++counter}-${Math.random()}`;

test(() => {
  assert_true(navigator.locks instanceof LockManager);
  assert_equals(navigator.locks, navigator.locks, "the settings object's one LockManager");
}, "navigator.locks is this realm's LockManager, the same object each time");

promise_test(async () => {
  const name = unique();
  let seen = null;
  const result = await navigator.locks.request(name, lock => {
    seen = lock;
    assert_true(lock instanceof Lock);
    assert_equals(lock.name, name);
    assert_equals(lock.mode, "exclusive");
    return "value";
  });
  assert_equals(result, "value", "the released promise resolves with the callback's result");
  assert_not_equals(seen, null);
}, "a granted request runs its callback with a Lock, and resolves with what it returned");

promise_test(async () => {
  const name = unique();
  const result = await navigator.locks.request(name, { mode: "shared" }, async lock => {
    assert_equals(lock.mode, "shared");
    return 42;
  });
  assert_equals(result, 42);
}, "the options overload: a shared lock");

promise_test(async t => {
  const name = unique();
  const error = new Error("thrown");
  await promise_rejects_exactly(t, error, navigator.locks.request(name, () => { throw error; }));
  // The lock was released all the same.
  assert_equals(await navigator.locks.request(name, { ifAvailable: true }, lock => lock !== null), true);
}, "a callback that throws rejects the request, and releases the lock");

promise_test(async () => {
  const name = unique();
  const order = [];
  let release;
  const first = navigator.locks.request(name, () => {
    order.push("first");
    return new Promise(resolve => { release = resolve; });
  });
  const second = navigator.locks.request(name, () => { order.push("second"); });
  await new Promise(resolve => setTimeout(resolve, 20));
  assert_array_equals(order, ["first"], "the second waits for the first's release");
  const state = await navigator.locks.query();
  assert_equals(state.held.filter(l => l.name === name).length, 1);
  assert_equals(state.pending.filter(l => l.name === name).length, 1);
  const held = state.held.find(l => l.name === name);
  assert_array_equals(Object.keys(held).sort(), ["clientId", "mode", "name"]);
  assert_equals(typeof held.clientId, "string");
  assert_equals(held.clientId, state.pending.find(l => l.name === name).clientId,
                "one environment, one clientId");
  release("done");
  assert_equals(await first, "done");
  await second;
  assert_array_equals(order, ["first", "second"]);
}, "an exclusive lock queues the next request until its callback's promise settles; query() sees both");

promise_test(async () => {
  const name = unique();
  let release;
  const held = navigator.locks.request(name, () => new Promise(resolve => { release = resolve; }));
  await new Promise(resolve => setTimeout(resolve, 0));
  const got = await navigator.locks.request(name, { ifAvailable: true }, lock => lock);
  assert_equals(got, null, "ifAvailable: the callback is given null");
  release();
  await held;
}, "ifAvailable while the lock is held runs the callback with null");

promise_test(async t => {
  const name = unique();
  const held = navigator.locks.request(name, () => new Promise(() => {}));
  await new Promise(resolve => setTimeout(resolve, 0));
  const stolen = navigator.locks.request(name, { steal: true }, lock => lock.name);
  await promise_rejects_dom(t, "AbortError", held, "the holder's released promise rejects");
  assert_equals(await stolen, name);
}, "steal releases the held lock: its request rejects with AbortError, and the thief is granted");

promise_test(async t => {
  const name = unique();
  let release;
  const held = navigator.locks.request(name, () => new Promise(resolve => { release = resolve; }));
  const controller = new AbortController();
  const waiting = navigator.locks.request(name, { signal: controller.signal }, t.unreached_func("never granted"));
  controller.abort();
  await promise_rejects_dom(t, "AbortError", waiting);
  const state = await navigator.locks.query();
  assert_equals(state.pending.filter(l => l.name === name).length, 0, "the aborted request left its queue");
  release();
  await held;
}, "aborting a waiting request rejects it with the signal's reason and removes it");

promise_test(async t => {
  await promise_rejects_dom(t, "NotSupportedError", navigator.locks.request("-reserved", () => {}));
  await promise_rejects_dom(t, "NotSupportedError",
    navigator.locks.request(unique(), { steal: true, ifAvailable: true }, () => {}));
  await promise_rejects_dom(t, "NotSupportedError",
    navigator.locks.request(unique(), { steal: true, mode: "shared" }, () => {}));
  await promise_rejects_dom(t, "NotSupportedError",
    navigator.locks.request(unique(), { signal: new AbortController().signal, ifAvailable: true }, () => {}));
  await promise_rejects_js(t, TypeError, navigator.locks.request(unique(), { mode: "other" }, () => {}));
}, "request()'s argument checks reject");
</script>
