<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Repeated EventTarget dispatch preserves listener counts</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
(() => {
const target = new EventTarget();
const event = new Event("dr1");
let delivered = 0;
const listener = () => delivered++;
target.addEventListener("dr1", listener);
const start = performance.now();
for (let i = 0; i < 100000; ++i) target.dispatchEvent(event);
const elapsed = performance.now() - start;
target.removeEventListener("dr1", listener);
test(() => {
  assert_equals(delivered, 100000);
  assert_equals(event.currentTarget, null);
  assert_equals(event.eventPhase, Event.NONE);
}, "Dispatch 100000 events: " + elapsed.toFixed(3) + " ms");
})();
</script>
