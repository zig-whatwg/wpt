<!doctype html>
<meta charset="utf-8">
<title>Native table row names use author text</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<table><tr id="target" title="Row"><td>Cell</td></tr></table>
<script>
promise_test(async () => {
  assert_equals(await test_driver.get_computed_label(target), 'Row');
  target.removeAttribute('title');
  assert_equals(await test_driver.get_computed_label(target), '');
}, 'A native table row does not acquire its cells content as a name');
</script>
