<!doctype html>
<meta charset="utf-8">
<title>Only new popup creation consumes transient activation</title>
<link rel="help" href="https://html.spec.whatwg.org/#the-rules-for-choosing-a-navigable">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<body>
<script>
promise_test(async t => {
  await test_driver.bless('create popup');
  assert_true(navigator.userActivation.isActive);
  const popup = window.open('', 'bc2-activation-popup');
  t.add_cleanup(() => popup.close());
  assert_false(navigator.userActivation.isActive, 'new popup consumes activation');
  assert_false(popup.navigator.userActivation.isActive, 'new popup starts inactive');
  await test_driver.bless('reuse popup');
  assert_equals(window.open('', 'bc2-activation-popup'), popup);
  assert_true(navigator.userActivation.isActive, 'existing popup preserves activation');
}, 'new popup consumes activation, named popup reuse does not');
</script>
