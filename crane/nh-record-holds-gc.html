<!doctype html>
<meta charset="utf-8">
<title>Crane: a MutationRecord holds its nodes through the trees they move to</title>
<link rel=help href="https://dom.spec.whatwg.org/#interface-mutationrecord">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
// Lane nodeholds (tmp/plans/lane-nodeholds-handoff.md). A record holds its
// nodes natively, as Blink's Member<Node> does, and roots - from the record -
// only the root of a tree that leaves the document while it holds a node in
// it. Each case lets go of everything but the record, collects, reissues freed
// slots with churn, and reads the record. A queued record is collected around
// without a task turn: a turn would deliver it.

function collectNow() {
  TestUtils.gc();
  const churn = [];
  for (let i = 0; i < 2000; i++) {
    churn.push(document.createTextNode('churn'), document.createElement('i'), document.createElement('div'));
  }
  TestUtils.gc();
  return churn.length;
}

test(() => {
  assert_true(!!(self.TestUtils && TestUtils.gc), 'TestUtils.gc is available');
  const mo = new MutationObserver(() => {});
  mo.observe(document.body, { childList: true, subtree: true });
  (() => {
    const section = document.body.appendChild(document.createElement('section'));
    mo.takeRecords();
    const inner = section.appendChild(document.createElement('div'));
    inner.appendChild(document.createElement('em')).append('kept');
    section.remove();
  })();
  collectNow();
  const records = mo.takeRecords();
  mo.disconnect();
  assert_equals(records.length, 4);
  assert_equals(records[0].target.localName, 'section');
  assert_equals(records[0].addedNodes[0].localName, 'div');
  assert_equals(records[1].addedNodes[0].textContent, 'kept');
  assert_equals(records[2].addedNodes[0].data, 'kept');
  assert_equals(records[3].removedNodes[0], records[0].target);
  assert_equals(records[0].addedNodes[0].parentNode, records[0].target, 'the tree is whole');
}, 'records queued while their nodes were in the document keep them after their tree leaves it');

test(() => {
  const parent = document.body.appendChild(document.createElement('div'));
  const first = new MutationObserver(() => {});
  const second = new MutationObserver(() => {});
  first.observe(parent, { childList: true });
  second.observe(parent, { childList: true });
  (() => { const text = document.createTextNode('both'); parent.append(text); text.remove(); })();
  collectNow();
  const a = first.takeRecords();
  collectNow();
  const b = second.takeRecords();
  assert_equals(a.length, 2);
  assert_equals(b.length, 2);
  assert_equals(a[1].removedNodes[0].data, 'both');
  assert_equals(b[1].removedNodes[0], a[1].removedNodes[0]);
  assert_equals(b[0].addedNodes[0], a[0].addedNodes[0]);
  parent.remove();
}, 'the records two observers get for one mutation each keep its nodes');

test(() => {
  const mo = new MutationObserver(() => {});
  (() => {
    const doc = document.implementation.createHTMLDocument('t');
    doc.ed = 'doc';
    mo.observe(doc.body, { attributes: true, childList: true });
    doc.body.setAttribute('data-x', '1');
    doc.body.append(doc.createElement('p'));
  })();
  collectNow();
  const records = mo.takeRecords();
  assert_equals(records.length, 2);
  assert_equals(records[0].target.localName, 'body');
  assert_equals(records[0].target.ownerDocument.ed, 'doc', 'the document with no window is kept, with its expando');
  assert_equals(records[1].addedNodes[0].parentNode, records[0].target);
}, 'a record of a document with no window keeps that document');

promise_test(async t => {
  const parent = document.body.appendChild(document.createElement('div'));
  const mo = new MutationObserver(() => {});
  mo.observe(parent, { childList: true });
  const weak = [];
  (() => {
    const span = document.createElement('span');
    parent.append(span);
    span.remove();
    const records = mo.takeRecords();
    span.records = records;
    weak.push(new WeakRef(span), new WeakRef(records[1]));
  })();
  await new Promise(r => t.step_timeout(r, 0));
  TestUtils.gc();
  TestUtils.gc();
  assert_array_equals(weak.map(ref => ref.deref() === undefined), [true, true], 'both collected');
  mo.disconnect();
  parent.remove();
}, 'a record and a removed node that names it are collected together');
</script>
