<!doctype html>
<meta charset="utf-8">
<title>Compile, instantiate and call 100 WebAssembly modules</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// (module (func (export "answer") (result i32) i32.const 42))
const bytes = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,
  3,2,1,0,7,10,1,6,97,110,115,119,101,114,0,0,10,6,1,4,0,65,42,11]);
test(() => {
  let sum = 0;
  const start = performance.now();
  for (let i = 0; i < 100; ++i) {
    const module = new WebAssembly.Module(bytes);
    const instance = new WebAssembly.Instance(module);
    sum += instance.exports.answer();
  }
  const elapsed = performance.now() - start;
  assert_equals(sum, 4200);
  console.log("wj1 compile/instantiate/call 100: " + elapsed + " ms");
}, "100 compiled and instantiated modules return the expected result");
</script>
