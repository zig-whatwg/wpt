<!doctype html>
<meta charset="utf-8">
<title>ShadowRealm module descendants use default credentials</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#hostloadimportedmodule">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
promise_test(async () => {
  const remote = 'http://{{domains[www2]}}:{{ports[http][0]}}';
  const cookieName = 'sc2shadowcredentials';
  await fetch(remote + '/cookies/resources/set-cookie.py?name=' + cookieName + '&path=/',
              {mode: 'cors', credentials: 'include'});
  const checker = id => remote + '/html/semantics/scripting-1/the-script-element/module/resources/check-cookie.py?id=' +
      id + '&cookieName=' + cookieName + '&origin=' + encodeURIComponent(location.origin);
  const control = await fetch(checker('sc2ShadowControl'), {credentials: 'include'});
  assert_true((await control.text()).includes("'found'"), 'The cross-origin cookie exists');

  const realm = new ShadowRealm();
  // The existing cookie checker assigns window.<id>; expose that spelling
  // as an alias of this realm's own global, without adding any browser APIs.
  realm.evaluate('globalThis.window = globalThis; undefined');
  const source = 'import ' + JSON.stringify(checker('sc2ShadowStaticCookie')) + ';' +
      'await import(' + JSON.stringify(checker('sc2ShadowDynamicCookie')) + ');' +
      'export const cookies = JSON.stringify([sc2ShadowStaticCookie, sc2ShadowDynamicCookie]);';
  const actual = await realm.importValue('data:text/javascript,' + encodeURIComponent(source), 'cookies');
  assert_array_equals(JSON.parse(actual), ['not found', 'not found']);
}, 'ShadowRealm static and dynamic descendants exclude cross-origin cookies by default');
</script>
