<!doctype html>
<meta charset="utf-8">
<title>Image properties use the existing substitution and inheritance paths</title>
<link rel="help" href="https://drafts.csswg.org/css-images-4/#the-object-fit">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="parent"><div id="child"></div></div>
<script>
test(() => {
  const parent = document.getElementById('parent');
  const child = document.getElementById('child');
  parent.style.cssText = '--rendering: pixelated; image-rendering: var(--rendering); image-orientation: none; object-fit: cover scale-down';
  assert_equals(getComputedStyle(parent).objectFit, 'cover scale-down');
  assert_equals(getComputedStyle(child).objectFit, 'fill');
  assert_equals(getComputedStyle(child).imageRendering, 'pixelated');
  assert_equals(getComputedStyle(child).imageOrientation, 'none');
  parent.style.setProperty('--rendering', 'smooth');
  assert_equals(getComputedStyle(child).imageRendering, 'smooth');
}, 'image rendering and orientation inherit while object-fit retains its initial value');
</script>
