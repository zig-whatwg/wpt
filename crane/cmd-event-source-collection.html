<!doctype html>
<meta charset="utf-8">
<title>CommandEvent and ToggleEvent retain their source across collection</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#the-commandevent-interface">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
for (const EventClass of [CommandEvent, ToggleEvent]) {
  promise_test(async t => {
    function makeEvent() {
      const source = document.createElement('button');
      source.marker = EventClass.name;
      const event = new EventClass('cmd-source', {source});
      source.event = event;
      return event;
    }
    const event = makeEvent();
    for (let i = 0; i < 3; ++i) {
      await new Promise(resolve => t.step_timeout(resolve, 0));
      TestUtils.gc();
    }
    assert_not_equals(event.source, null);
    assert_equals(event.source.marker, EventClass.name);
    assert_equals(event.source.event, event);
  }, EventClass.name + ' retains a detached source and its back-reference');
}
</script>
