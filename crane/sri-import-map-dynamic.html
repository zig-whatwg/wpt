"./sri-script.js?dynamic-good":"sha256-5XflVAZ06rIPFW7MEg8x7ShHWvkljMdmw1FFdSnKgyQ=",
"./sri-script.js?dynamic-bad":"sha256-AAAA"
}}</script>
<script>

  await import('./sri-script.js?dynamic-good');
