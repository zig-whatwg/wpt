<!doctype html>
<title>SVG dataset getter</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/dom.html#dom-dataset">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(() => {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  assert_true(svg.dataset instanceof DOMStringMap);
}, "SVG elements expose a DOMStringMap through dataset");
</script>
