 <!DOCTYPE html>
<meta charset="utf-8">
<title>Progressive Worker Prerequisites Test</title>
<meta name="help" href="https://html.spec.whatwg.org/multipage/workers.html">
<meta name="timeout" content="long">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<script>
// ============================================================================
// PHASE 1: JAVASCRIPT FUNDAMENTALS
// These must pass before anything else can work
// ============================================================================

test(function() {
  assert_equals(typeof Function, 'function', 'Function constructor exists');
  assert_equals(typeof Object, 'function', 'Object constructor exists');
  assert_equals(typeof Array, 'function', 'Array constructor exists');
}, 'Phase 1.1: Basic constructors exist');

test(function() {
  var fn = new Function('return 42');
  assert_equals(fn(), 42, 'Function constructor creates callable function');
}, 'Phase 1.2: Function constructor works');

test(function() {
  assert_equals(typeof Promise, 'function', 'Promise constructor exists');
  assert_true(Promise.resolve instanceof Function, 'Promise.resolve exists');
  assert_true(Promise.reject instanceof Function, 'Promise.reject exists');
}, 'Phase 1.3: Promise constructor exists');

promise_test(function() {
  return Promise.resolve(42).then(function(value) {
    assert_equals(value, 42, 'Promise resolved with correct value');
  });
}, 'Phase 1.4: Promise.resolve and then work');

promise_test(function() {
  return new Promise(function(resolve) {
    resolve('test');
  }).then(function(value) {
    assert_equals(value, 'test', 'Promise constructor resolve works');
  });
}, 'Phase 1.5: Promise constructor with resolver works');

test(function() {
  assert_equals(typeof Symbol, 'function', 'Symbol exists');
  assert_equals(typeof Symbol.iterator, 'symbol', 'Symbol.iterator exists');
}, 'Phase 1.6: Symbol exists');

test(function() {
  assert_equals(typeof ArrayBuffer, 'function', 'ArrayBuffer exists');
  var buffer = new ArrayBuffer(8);
  assert_equals(buffer.byteLength, 8, 'ArrayBuffer has correct length');
}, 'Phase 1.7: ArrayBuffer works');

test(function() {
  assert_equals(typeof Uint8Array, 'function', 'Uint8Array exists');
  var arr = new Uint8Array([1, 2, 3]);
  assert_equals(arr.length, 3, 'Uint8Array has correct length');
  assert_equals(arr[0], 1, 'Uint8Array indexing works');
}, 'Phase 1.8: TypedArray works');

// ============================================================================
// PHASE 2: ERROR HANDLING
// Workers need proper error propagation
// ============================================================================

test(function() {
  assert_equals(typeof Error, 'function', 'Error constructor exists');
  assert_equals(typeof TypeError, 'function', 'TypeError constructor exists');
  assert_equals(typeof SyntaxError, 'function', 'SyntaxError constructor exists');
}, 'Phase 2.1: Error constructors exist');

test(function() {
  var err = new Error('test message');
  assert_equals(err.message, 'test message', 'Error message property works');
  assert_true(err instanceof Error, 'Error instanceof works');
}, 'Phase 2.2: Error instances work correctly');

promise_test(function() {
  return Promise.reject(new Error('rejected')).then(
    function() { assert_unreached('should not resolve'); },
    function(err) { assert_equals(err.message, 'rejected'); }
  );
}, 'Phase 2.3: Promise rejection works');

  // ============================================================================
  // PHASE 3: EVENT SYSTEM
  // Workers communicate through events
  // ============================================================================

  test(function() {
    assert_equals(typeof Event, 'function', 'Event constructor exists');
    var event = new Event('test');
    assert_equals(event.type, 'test', 'Event type property works');
  }, 'Phase 3.1: Event constructor works');

  test(function() {
    assert_equals(typeof EventTarget, 'function', 'EventTarget constructor exists');
  }, 'Phase 3.2: EventTarget constructor exists');

  test(function() {
    var target = new EventTarget();
    assert_true(target.addEventListener instanceof Function, 'addEventListener exists');
    assert_true(target.removeEventListener instanceof Function, 'removeEventListener exists');
    assert_true(target.dispatchEvent instanceof Function, 'dispatchEvent exists');
  }, 'Phase 3.3: EventTarget methods exist');

  test(function() {
    var target = new EventTarget();
    var called = false;
    target.addEventListener('test', function(e) {
      called = true;
      assert_equals(e.type, 'test', 'Event type is correct');
    });
    target.dispatchEvent(new Event('test'));
    assert_true(called, 'Event listener was called');
  }, 'Phase 3.4: EventTarget addEventListener and dispatchEvent work');

  test(function() {
    var target = new EventTarget();
    var callCount = 0;
    var listener = function() { callCount++; };
    target.addEventListener('test', listener);
    target.removeEventListener('test', listener);
    target.dispatchEvent(new Event('test'));
    assert_equals(callCount, 0, 'Removed listener should not be called');
  }, 'Phase 3.5: EventTarget removeEventListener works');

  test(function() {
    assert_equals(typeof MessageEvent, 'function', 'MessageEvent constructor exists');
    var event = new MessageEvent('message', { data: 'hello' });
    assert_equals(event.type, 'message', 'MessageEvent type is correct');
    assert_equals(event.data, 'hello', 'MessageEvent data is correct');
  }, 'Phase 3.6: MessageEvent constructor works');

  test(function() {
    assert_equals(typeof ErrorEvent, 'function', 'ErrorEvent constructor exists');
    var event = new ErrorEvent('error', {
      message: 'test error',
      filename: 'test.js',
      lineno: 10,
      colno: 5
    });
    assert_equals(event.message, 'test error', 'ErrorEvent message works');
    assert_equals(event.filename, 'test.js', 'ErrorEvent filename works');
    assert_equals(event.lineno, 10, 'ErrorEvent lineno works');
  }, 'Phase 3.7: ErrorEvent constructor works');

// ============================================================================
// PHASE 4: TIMERS AND EVENT LOOP
// Workers have their own event loop
// ============================================================================

async_test(function(t) {
  setTimeout(t.step_func_done(function() {
    assert_true(true, 'setTimeout callback executed');
  }), 0);
}, 'Phase 4.1: setTimeout works');

async_test(function(t) {
  var count = 0;
  var id = setInterval(t.step_func(function() {
    count++;
    if (count >= 2) {
      clearInterval(id);
      t.done();
    }
  }), 10);
}, 'Phase 4.2: setInterval and clearInterval work');

 async_test(function(t) {
 var order = [];
 setTimeout(function() {
   order.push('timeout');
   assert_array_equals(order, ['microtask', 'timeout'], 'Microtask ran before timeout');
   t.done();
 }, 0);
 Promise.resolve().then(t.step_func(function() {
   order.push('microtask');
 }));
 }, 'Phase 4.3: Microtask queue runs before next task');

 test(function() {
 assert_equals(typeof queueMicrotask, 'function', 'queueMicrotask exists');
 }, 'Phase 4.4: queueMicrotask exists');

 async_test(function(t) {
 var called = false;
 queueMicrotask(t.step_func_done(function() {
   called = true;
   assert_true(called, 'queueMicrotask callback executed');
 }));
 }, 'Phase 4.5: queueMicrotask works');

 // ============================================================================
 // PHASE 5: STRUCTURED CLONE (BASIC)
 // postMessage requires structured cloning
 // ============================================================================

test(function() {
  assert_equals(typeof structuredClone, 'function', 'structuredClone exists');
}, 'Phase 5.1: structuredClone function exists');

test(function() {
  // Primitives
  assert_equals(structuredClone(42), 42, 'number clones correctly');
  assert_equals(structuredClone('hello'), 'hello', 'string clones correctly');
  assert_equals(structuredClone(true), true, 'boolean clones correctly');
  assert_equals(structuredClone(null), null, 'null clones correctly');
  assert_equals(structuredClone(undefined), undefined, 'undefined clones correctly');
}, 'Phase 5.2: structuredClone handles primitives');

test(function() {
  var obj = { a: 1, b: 'two', c: [1, 2, 3] };
  var cloned = structuredClone(obj);
  assert_not_equals(cloned, obj, 'Clone is a new object');
  assert_equals(cloned.a, 1, 'Property a cloned');
  assert_equals(cloned.b, 'two', 'Property b cloned');
  assert_array_equals(cloned.c, [1, 2, 3], 'Array property cloned');
  assert_not_equals(cloned.c, obj.c, 'Array is a new array');
}, 'Phase 5.3: structuredClone handles objects and arrays');

test(function() {
  var date = new Date('2024-01-01');
  var cloned = structuredClone(date);
  assert_true(cloned instanceof Date, 'Clone is a Date');
  assert_equals(cloned.getTime(), date.getTime(), 'Date value preserved');
  assert_not_equals(cloned, date, 'Clone is a new Date object');
}, 'Phase 5.4: structuredClone handles Date');

test(function() {
  var regex = /test/gi;
  var cloned = structuredClone(regex);
  assert_true(cloned instanceof RegExp, 'Clone is a RegExp');
  assert_equals(cloned.source, 'test', 'RegExp source preserved');
  assert_equals(cloned.flags, 'gi', 'RegExp flags preserved');
}, 'Phase 5.5: structuredClone handles RegExp');

test(function() {
  var buffer = new ArrayBuffer(8);
  var view = new Uint8Array(buffer);
  view[0] = 42;
  var cloned = structuredClone(buffer);
  assert_true(cloned instanceof ArrayBuffer, 'Clone is ArrayBuffer');
  assert_equals(cloned.byteLength, 8, 'byteLength preserved');
  var clonedView = new Uint8Array(cloned);
  assert_equals(clonedView[0], 42, 'Content preserved');
  assert_not_equals(cloned, buffer, 'Clone is a new ArrayBuffer');
}, 'Phase 5.6: structuredClone handles ArrayBuffer');

test(function() {
  var map = new Map([['a', 1], ['b', 2]]);
  var cloned = structuredClone(map);
  assert_true(cloned instanceof Map, 'Clone is a Map');
  assert_equals(cloned.get('a'), 1, 'Map entry a preserved');
  assert_equals(cloned.get('b'), 2, 'Map entry b preserved');
}, 'Phase 5.7: structuredClone handles Map');

test(function() {
  var set = new Set([1, 2, 3]);
  var cloned = structuredClone(set);
  assert_true(cloned instanceof Set, 'Clone is a Set');
  assert_true(cloned.has(1), 'Set has 1');
  assert_true(cloned.has(2), 'Set has 2');
  assert_true(cloned.has(3), 'Set has 3');
}, 'Phase 5.8: structuredClone handles Set');

test(function() {
  // Circular reference
  var obj = { a: 1 };
  obj.self = obj;
  var cloned = structuredClone(obj);
  assert_equals(cloned.a, 1, 'Property preserved');
  assert_equals(cloned.self, cloned, 'Circular reference preserved');
}, 'Phase 5.9: structuredClone handles circular references');

test(function() {
  assert_throws_dom('DataCloneError', function() {
    structuredClone(function() {});
  }, 'Functions cannot be cloned');
}, 'Phase 5.10: structuredClone rejects functions');

test(function() {
  assert_throws_dom('DataCloneError', function() {
    structuredClone(Symbol('test'));
  }, 'Symbols cannot be cloned');
}, 'Phase 5.11: structuredClone rejects symbols');

 // ============================================================================
 // PHASE 6: STRUCTURED CLONE WITH TRANSFER
 // Workers use transferable objects
 // ============================================================================

 test(function() {
   var buffer = new ArrayBuffer(8);
   var view = new Uint8Array(buffer);
   view[0] = 42;

   var cloned = structuredClone(buffer, { transfer: [buffer] });

   assert_equals(buffer.byteLength, 0, 'Original buffer detached');
   assert_equals(cloned.byteLength, 8, 'Transferred buffer has correct size');
   var clonedView = new Uint8Array(cloned);
   assert_equals(clonedView[0], 42, 'Data transferred correctly');
 }, 'Phase 6.1: ArrayBuffer transfer works');

 test(function() {
   var buffer = new ArrayBuffer(8);
   assert_throws_dom('DataCloneError', function() {
     structuredClone(buffer, { transfer: [buffer, buffer] });
   }, 'Cannot transfer same buffer twice');
 }, 'Phase 6.2: Duplicate transfer throws');

// ============================================================================
// PHASE 7: MESSAGECHANNEL AND MESSAGEPORT
// Workers use MessagePorts internally
// ============================================================================

test(function() {
  assert_equals(typeof MessageChannel, 'function', 'MessageChannel constructor exists');
}, 'Phase 7.1: MessageChannel constructor exists');

test(function() {
  var channel = new MessageChannel();
  assert_true(channel.port1 instanceof MessagePort, 'port1 is a MessagePort');
  assert_true(channel.port2 instanceof MessagePort, 'port2 is a MessagePort');
}, 'Phase 7.2: MessageChannel creates two ports');

test(function() {
  var channel = new MessageChannel();
  assert_true(channel.port1.postMessage instanceof Function, 'postMessage exists');
  assert_true(channel.port1.start instanceof Function, 'start exists');
  assert_true(channel.port1.close instanceof Function, 'close exists');
}, 'Phase 7.3: MessagePort has required methods');

 async_test(function(t) {
   var channel = new MessageChannel();
   channel.port2.onmessage = t.step_func_done(function(e) {
     assert_equals(e.data, 'hello', 'Message received correctly');
   });
   channel.port1.postMessage('hello');
 }, 'Phase 7.4: MessageChannel basic message passing works');

 async_test(function(t) {
   var channel = new MessageChannel();
   channel.port2.onmessage = t.step_func_done(function(e) {
     assert_equals(e.data.value, 42, 'Object message received');
     assert_array_equals(e.data.arr, [1, 2, 3], 'Array in message received');
   });
   channel.port1.postMessage({ value: 42, arr: [1, 2, 3] });
 }, 'Phase 7.5: MessageChannel passes structured data');

 async_test(function(t) {
   var channel = new MessageChannel();
   var buffer = new ArrayBuffer(8);
   var view = new Uint8Array(buffer);
   view[0] = 99;

   channel.port2.onmessage = t.step_func_done(function(e) {
     assert_true(e.data instanceof ArrayBuffer, 'Received ArrayBuffer');
     assert_equals(e.data.byteLength, 8, 'Correct size');
     var receivedView = new Uint8Array(e.data);
     assert_equals(receivedView[0], 99, 'Data preserved');
   });

   channel.port1.postMessage(buffer, [buffer]);
   assert_equals(buffer.byteLength, 0, 'Original buffer detached');
 }, 'Phase 7.6: MessageChannel transfer works');

 async_test(function(t) {
   var channel1 = new MessageChannel();
   var channel2 = new MessageChannel();

   // Transfer channel2.port2 through channel1
   channel1.port2.onmessage = t.step_func(function(e) {
     var receivedPort = e.ports[0];
     assert_true(receivedPort instanceof MessagePort, 'Received a MessagePort');

     receivedPort.onmessage = t.step_func_done(function(e2) {
       assert_equals(e2.data, 'through transferred port', 'Message through transferred port');
     });

     receivedPort.postMessage('through transferred port');
   });

   channel2.port2.onmessage = t.step_func(function(e) {
     // Echo back
     e.target.postMessage(e.data);
   });

   channel1.port1.postMessage('transfer', [channel2.port1]);
 }, 'Phase 7.7: MessagePort transfer works');

 async_test(function(t) {
   var channel = new MessageChannel();
   var messages = [];

   channel.port2.onmessage = t.step_func(function(e) {
     messages.push(e.data);
     if (messages.length === 3) {
       assert_array_equals(messages, [1, 2, 3], 'Messages received in order');
       t.done();
     }
   });

   channel.port1.postMessage(1);
   channel.port1.postMessage(2);
   channel.port1.postMessage(3);
 }, 'Phase 7.8: MessageChannel preserves message order');
