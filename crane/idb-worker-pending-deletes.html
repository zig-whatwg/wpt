<!doctype html>
<meta charset="utf-8">
<title>Worker shutdown owns pending IndexedDB deletion tasks</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
async_test(t => {
  const worker = new Worker('idb-worker-pending-deletes.js');
  t.add_cleanup(() => worker.terminate());
  worker.onerror = t.unreached_func('the worker must reach its shutdown task');
  worker.onmessage = t.step_func_done(({data}) => {
    assert_equals(data.error, undefined);
    assert_array_equals(data.states, ['pending', 'pending', 'pending', 'pending']);
  });
}, 'A worker can close after queuing database deletions and deliver its final message');
</script>
