<!doctype html>
<meta charset="utf-8">
<title>DOMParser replaces isolated surrogates before XML parsing</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#dom-domparser-parsefromstring">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
for (const type of ["text/xml", "application/xml", "application/xhtml+xml", "image/svg+xml"]) {
  for (const [name, input, expected] of [
    ["high surrogate", "a\uD83Cb", "a\uFFFDb"],
    ["low surrogate", "a\uDC00b", "a\uFFFDb"],
    ["adjacent high surrogates", "\uD800\uD801", "\uFFFD\uFFFD"],
    ["valid BMP before a lone surrogate", "\uD000\uD800", "\uD000\uFFFD"],
    ["valid pair", "a\uD83D\uDD25b", "a\uD83D\uDD25b"],
  ]) {
    test(() => {
      const doc = new DOMParser().parseFromString('<root a="' + input + '"><![CDATA[' + input + ']]><text>' + input + '</text></root>', type);
      assert_equals(doc.getElementsByTagName("parsererror").length, 0);
      assert_equals(doc.documentElement.getAttribute("a"), expected, "attribute");
      assert_equals(doc.documentElement.firstChild.data, expected, "CDATA");
      assert_equals(doc.getElementsByTagName("text")[0].textContent, expected, "text");
    }, type + " replaces " + name + " consistently");
  }
  for (const reference of ["&#xD800;", "&#xDFFF;", "&#55296;"]) {
    test(() => {
      const doc = new DOMParser().parseFromString("<root>" + reference + "</root>", type);
      assert_equals(doc.getElementsByTagName("parsererror").length, 1);
    }, type + " still rejects surrogate numeric reference " + reference);
  }
}
</script>
