<!doctype html>
<meta charset="utf-8">
<title>Form named getter isolated regression</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/forms.html#the-form-element">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(() => {
  const form = document.createElement("form");
  const input = form.appendChild(document.createElement("input"));
  input.name = "control";
  assert_equals(form.control, input);
}, "a form exposes a listed control through its current name");
</script>
