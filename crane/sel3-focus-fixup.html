<!doctype html>
<meta charset="utf-8">
<title>Focus fixup runs during rendering without a script focus read</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#update-the-rendering">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
for (const parentHidden of (location.search ? [false] : [false, true])) {
  promise_test(async t => {
    const parent = document.body.appendChild(document.createElement('section'));
    const input = parent.appendChild(document.createElement('input'));
    t.add_cleanup(() => parent.remove());
    input.focus();
    assert_true(input.matches(':focus'));
    assert_true(parent.matches(':focus-within'));
    await new Promise(resolve => requestAnimationFrame(() => {
      (parentHidden ? parent : input).style.display = 'none';
      requestAnimationFrame(resolve);
    }));
    // No activeElement/hasFocus read may perform the fixup for this test.
    assert_false(input.matches(':focus'));
    assert_false(input.matches(':focus-within'));
    assert_false(parent.matches(':focus-within'));
  }, `Rendering clears focus selectors after hiding the ${parentHidden ? 'parent' : 'input'}`);
}
</script>
