<!doctype html>
<meta charset="utf-8">
<title>document.open aborts an XHR while navigation is pending</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  const frame = document.createElement("iframe");
  t.add_cleanup(() => frame.remove());
  const loaded = new Promise(resolve => frame.onload = resolve);
  frame.src = "/common/blank.html";
  document.body.appendChild(frame);
  await loaded;
  frame.onload = null;
  const xhr = new frame.contentWindow.XMLHttpRequest();
  const events = [];
  xhr.open("GET", "/common/slow.py?delay=1500");
  xhr.onreadystatechange = () => events.push("state:" + xhr.readyState);
  xhr.onabort = () => events.push("abort:" + xhr.readyState);
  const ended = new Promise(resolve => xhr.onloadend = () => {
    events.push("loadend:" + xhr.readyState);
    resolve();
  });
  xhr.send();
  frame.contentWindow.location.href = "/common/slow.py?delay=2000";
  frame.contentDocument.open();
  await ended;
  assert_array_equals(events, ["state:4", "abort:4", "loadend:4"]);
  assert_equals(xhr.readyState, xhr.DONE, "document cancellation does not run abort()'s UNSENT reset");
  assert_equals(xhr.status, 0);
}, "document.open while navigating runs XHR request error steps in order");
</script>
