<!doctype html>
<meta charset="utf-8">
<title>Worker module descendants retain WorkerOptions credentials</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// The existing WPT endpoint reports COOKIE_NAME from the request.
document.cookie = 'COOKIE_NAME=1; Path=/workers/modules/';
add_completion_callback(() => {
  document.cookie = 'COOKIE_NAME=; Max-Age=0; Path=/workers/modules/';
});
for (const shared of [false, true]) {
  for (const kind of ['static', 'dynamic']) {
    for (const credentials of ['omit', 'same-origin', 'include']) {
      promise_test(async t => {
        const url = `/workers/modules/resources/${kind}-import-same-origin-credentials-checker-worker.js`;
        const options = {type: 'module', credentials, name: `${shared}-${kind}-${credentials}`};
        const worker = shared ? new SharedWorker(url, options) : new Worker(url, options);
        const port = shared ? worker.port : worker;
        t.add_cleanup(() => shared ? port.close() : worker.terminate());
        const answer = new Promise((resolve, reject) => {
          port.onmessage = e => resolve(e.data);
          worker.onerror = reject;
        });
        if (shared) port.start();
        assert_equals(await answer, credentials === 'omit' ? '' : '1');
      }, `${shared ? 'Shared' : 'Dedicated'} worker ${kind} import uses ${credentials} credentials`);
    }
  }
}
</script>
