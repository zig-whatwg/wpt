<!doctype html>
<meta charset="utf-8">
<title>Crane computed decoration currentcolor omission, isolated</title>
<link rel="help" href="https://drafts.csswg.org/css-text-decor-4/#text-decoration-property">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
test(t => {
  const node = document.createElement('div');
  node.style.cssText = 'color:rgb(10, 20, 30); text-decoration:underline solid currentcolor';
  document.body.append(node);
  t.add_cleanup(() => node.remove());
  assert_equals(node.style.getPropertyValue('text-decoration'), 'underline');
  assert_equals(getComputedStyle(node).getPropertyValue('text-decoration'), 'underline');
  assert_equals(getComputedStyle(node).getPropertyValue('text-decoration-color'), 'rgb(10, 20, 30)');
  node.style.setProperty('text-decoration-color', 'rgb(10, 20, 30)');
  assert_equals(getComputedStyle(node).getPropertyValue('text-decoration'), 'underline rgb(10, 20, 30)');
}, 'computed decoration omits symbolic currentcolor but retains an equal explicit color');
</script>
