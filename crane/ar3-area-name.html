<!doctype html>
<meta charset="utf-8">
<title>Image map areas expose their text alternatives</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<img alt="Map" usemap="#ar3-map" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==">
<map name="ar3-map"><area id="target" href="#" shape="rect" coords="0,0,1,1" alt="Region" aria-label="Author"></map>
<script>
promise_test(async () => {
  assert_equals(await test_driver.get_computed_label(target), 'Author');
  target.removeAttribute('aria-label');
  assert_equals(await test_driver.get_computed_label(target), 'Region');
}, 'An area uses its accessible name despite having no rendered CSS box');
</script>
