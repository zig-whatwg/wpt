<!doctype html>
<meta charset="utf-8">
<title>A written script can remove its frame while its parser is on the stack</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#document-write-steps">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  let removals = 0;
  window.craneRemoveWrittenFrame = t.step_func(frame => {
    ++removals;
    frame.remove();
    if (typeof gc === 'function') gc();
  });
  t.add_cleanup(() => { delete window.craneRemoveWrittenFrame; });
  for (let i = 0; i < 8; ++i) {
    const frame = document.createElement('iframe');
    document.body.appendChild(frame);
    t.add_cleanup(() => frame.remove());
    let doc = frame.contentDocument;
    doc.open();
    doc.write('<body><div>before<script>parent.craneRemoveWrittenFrame(frameElement);' +
      '<\/script><p id="after">after</p>');
    assert_false(frame.isConnected, 'The written script removed its frame synchronously');
    doc = null;
    await new Promise(resolve => step_timeout(resolve, 0));
    if (typeof gc === 'function') {
      gc();
      gc();
    }
  }
  assert_equals(removals, 8, 'Every active parser unwound after its frame was removed');
}, 'Removing and collecting a frame from its written script keeps parser cleanup valid');
</script>
