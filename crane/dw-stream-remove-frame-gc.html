<!doctype html>
<meta charset="utf-8">
<title>A written script can remove its frame while its parser is on the stack</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#document-write-steps">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  let removals = 0;
  let openWeak;
  window.craneRemoveWrittenFrame = t.step_func(frame => {
    ++removals;
    frame.remove();
    TestUtils.gc();
    assert_not_equals(openWeak.deref(), undefined, 'the active parser retains its detached mapped node during removal');
  });
  t.add_cleanup(() => { delete window.craneRemoveWrittenFrame; });
  for (let i = 0; i < 8; ++i) {
    const frame = document.createElement('iframe');
    document.body.appendChild(frame);
    t.add_cleanup(() => frame.remove());
    let doc = frame.contentDocument;
    doc.open();
    doc.write('<body><div id="open">before');
    openWeak = (() => {
      const open = doc.getElementById('open');
      assert_not_equals(open, null);
      open.remove();
      return new WeakRef(open);
    })();
    // End the WeakRef-creation job before the written script collects.
    await new Promise(resolve => step_timeout(resolve, 0));
    doc.write('</div><script>parent.craneRemoveWrittenFrame(frameElement);' +
      '<\/script><p id="after">after</p>');
    assert_false(frame.isConnected, 'The written script removed its frame synchronously');
    doc = null;
    await new Promise(resolve => step_timeout(resolve, 0));
    TestUtils.gc();
    TestUtils.gc();
  }
  assert_equals(removals, 8, 'Every active parser unwound after its frame was removed');
}, 'Full collection while removing a frame from its written script keeps parser cleanup valid');
</script>
