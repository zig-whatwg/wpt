<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>HTTP cache cost: 1,000 fetches of distinct cacheable URLs (every one a miss)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/utils.js"></script>
<script>
// Each URL is new, so each fetch misses the cache - and, being cacheable
// (max-age=60, an ETag), is stored: what a fetch-heavy page costs with the
// HTTP cache on. The file's duration is the measurement (lane httpcache1).
promise_test(async () => {
  const run = token();
  let received = 0;
  for (let batch = 0; batch < 50; ++batch) {
    const fetches = [];
    for (let i = 0; i < 20; ++i) {
      const n = batch * 20 + i;
      fetches.push(fetch(`/resource-timing/resources/cacheable-and-validated.py?content=m${n}&run=${run}`).then(r => r.text()));
    }
    for (const text of await Promise.all(fetches)) if (text.startsWith("m")) ++received;
  }
  assert_equals(received, 1000);
}, "1000 distinct cacheable fetches");
</script>
