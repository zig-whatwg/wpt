<!DOCTYPE html>
<meta charset="utf-8">
<title>import() and import.meta.url in a dedicated worker</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#hostloadimportedmodule">
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#hostgetimportmetaproperties">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
const moduleUrl = new URL("resources/import-meta.mjs", location.href).href;

function nextMessage(worker) {
  return new Promise((resolve, reject) => {
    worker.addEventListener("message", e => resolve(e.data), { once: true });
    worker.addEventListener("error", e => reject(new Error("worker error: " + e.message)), { once: true });
  });
}

promise_test(async () => {
  const worker = new Worker("resources/eb-import-worker.js");
  const result = await nextMessage(worker);
  assert_equals(result.error, undefined, "import() fulfilled");
  assert_equals(result.url, moduleUrl, "the specifier resolves against the worker script's URL, and import.meta.url is the module's URL");
  assert_true(result.same, "a second import() of the URL is the same module");
  assert_equals(result.missing, "TypeError", "a module that cannot be fetched rejects with a TypeError");
  worker.terminate();
}, "import() in a classic worker script");

promise_test(async () => {
  const worker = new Worker("resources/eb-import-worker.js");
  await nextMessage(worker);
  const later = nextMessage(worker);
  worker.postMessage("later");
  assert_equals((await later).later, moduleUrl);
  worker.terminate();
}, "import() from a function the worker script defined, called from a later task");
</script>
