<!doctype html>
<meta charset="utf-8">
<title>Initial about:blank has HTML-namespace elements</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
function initialDocument(t, kind) {
  if (kind === "iframe") {
    const frame = document.createElement("iframe");
    document.body.appendChild(frame);
    t.add_cleanup(() => frame.remove());
    return frame.contentDocument;
  }
  const popup = window.open("about:blank");
  assert_not_equals(popup, null, "window.open succeeds");
  t.add_cleanup(() => popup.close());
  return popup.document;
}
for (const kind of ["iframe", "window"]) {
  test(t => {
    const doc = initialDocument(t, kind);
    assert_not_equals(doc.documentElement, null);
    assert_equals(doc.documentElement.namespaceURI, "http://www.w3.org/1999/xhtml");
  }, `${kind} initial root has HTML namespace`);
  for (const accessor of ["head", "body"]) {
    test(t => {
      const doc = initialDocument(t, kind);
      assert_not_equals(doc[accessor], null, `${accessor} accessor`);
      assert_equals(doc[accessor].namespaceURI, "http://www.w3.org/1999/xhtml");
    }, `${kind} initial ${accessor} exists and has HTML namespace`);
  }
}
</script>
