<!DOCTYPE html>
<meta charset="utf-8">
<title>Web Locks: a window and a dedicated worker contend for one lock</title>
<link rel="help" href="https://w3c.github.io/web-locks/#lock-manager">
<meta name="timeout" content="long">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
"use strict";
// A dedicated worker runs on a thread of its own: the window's requests and
// the worker's meet in the Browser's one lock manager for this origin. Each
// side takes the lock many times; inside it, query() must show exactly one
// holder - and both sides must finish.
let next = 0;
function ask(worker, message) {
  const id = ++next;
  return new Promise(resolve => {
    worker.addEventListener("message", function listener(e) {
      if (e.data.id !== id) return;
      worker.removeEventListener("message", listener);
      resolve(e.data);
    });
    worker.postMessage(Object.assign({ id }, message));
  });
}

async function contend(name, rounds) {
  let overlaps = 0;
  for (let i = 0; i < rounds; i++) {
    await navigator.locks.request(name, async () => {
      const state = await navigator.locks.query();
      if (state.held.filter(l => l.name === name).length !== 1) overlaps++;
      await null;
    });
  }
  return overlaps;
}

promise_test(async t => {
  const worker = new Worker("resources/wl-worker.js");
  t.add_cleanup(() => worker.terminate());
  const name = `wl-contention-${Math.random()}`;
  const rounds = 200;
  const [mine, theirs] = await Promise.all([contend(name, rounds), ask(worker, { op: "contend", name, rounds })]);
  assert_equals(mine, 0, "the window never saw a second holder");
  assert_equals(theirs.overlaps, 0, "the worker never saw a second holder");
  const state = await navigator.locks.query();
  assert_equals(state.held.filter(l => l.name === name).length, 0);
  assert_equals(state.pending.filter(l => l.name === name).length, 0);
}, "a window and a dedicated worker take one exclusive lock in turn, 200 times each");

promise_test(async t => {
  const worker = new Worker("resources/wl-worker.js");
  t.add_cleanup(() => worker.terminate());
  const name = `wl-handoff-${Math.random()}`;
  assert_true((await ask(worker, { op: "hold", name })).held);
  // The worker holds it: the window waits.
  let granted = false;
  const mine = navigator.locks.request(name, () => { granted = true; });
  const state = await navigator.locks.query();
  const held = state.held.filter(l => l.name === name);
  const pending = state.pending.filter(l => l.name === name);
  assert_equals(held.length, 1);
  assert_equals(pending.length, 1);
  assert_not_equals(held[0].clientId, pending[0].clientId, "the worker and the window are two clients");
  assert_false(granted);
  await ask(worker, { op: "release", name });
  await mine;
  assert_true(granted, "released on the worker's thread, granted on the window's");
}, "a lock the worker releases is granted to the window waiting for it");
</script>
