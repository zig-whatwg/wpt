<!doctype html>
<meta charset=utf-8>
<meta name=timeout content=long>
<meta name=variant content="?h1">
<meta name=variant content="?wpt_flags=h2">
<title>1000 fresh WebSocket open, echo and close round trips</title>
<script src=/resources/testharness.js></script>
<script src=/resources/testharnessreport.js></script>
<script>
promise_test(async t => {
  const h2 = new URLSearchParams(location.search).get('wpt_flags') === 'h2';
  const target = h2 ? 'wss://{{host}}:{{ports[h2][0]}}/echo'
                    : 'ws://{{host}}:{{ports[ws][0]}}/echo';
  const start = performance.now();
  for (let n = 0; n < 1000; ++n) {
    await new Promise((resolve, reject) => {
      const socket = new WebSocket(target, 'echo');
      let echoed = false;
      socket.onopen = () => socket.send(String(n));
      socket.onmessage = t.step_func(e => {
        assert_equals(e.data, String(n));
        echoed = true;
        socket.close(1000);
      });
      socket.onerror = () => reject(new Error('connection failed at iteration ' + n));
      socket.onclose = t.step_func(e => {
        assert_true(echoed);
        assert_true(e.wasClean);
        assert_equals(socket.bufferedAmount, 0);
        resolve();
      });
    });
  }
  console.log('PV1_WS_COST_MS=' + (performance.now() - start).toFixed(3));
}, '1000 fresh open/echo/close cycles preserve payload, clean close and bufferedAmount');
</script>
