<!DOCTYPE html>
<meta charset=utf-8>
<title>Which src forms a dynamically inserted script can resolve</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
// Splits "the insertion steps never ran" from "the URL never resolved".
// Each case inserts the same script through a different spelling of its URL,
// and waits for its load event: a script-inserted external script runs from a
// task (prepare step 35), never inside appendChild.
function insertAndWait(t, src, flag) {
  window[flag] = false;
  var s = document.createElement('script');
  s.src = src;
  s.onload = t.step_func_done(function () {
    assert_true(window[flag] === true, 'ran before its load event');
  });
  s.onerror = t.unreached_func('error event: the URL did not resolve or fetch');
  document.body.appendChild(s);
}

async_test(function (t) {
  insertAndWait(t,
    'http://web-platform.test:8000/crane/resources/script-insertion-external.js',
    '__external_ran');
}, 'absolute http URL');

async_test(function (t) {
  insertAndWait(t,
    '/crane/resources/script-insertion-external.js?root',
    '__external_ran');
}, 'root-relative URL');

async_test(function (t) {
  insertAndWait(t,
    'resources/script-insertion-external.js?rel',
    '__external_ran');
}, 'document-relative URL');

// document.baseURI is the URL the scripts above resolve against. It once read
// an internal field nothing assigned and came back undefined, while script
// URL resolution fell back to the V8 context's document URL.
test(function () {
  assert_equals(document.baseURI,
    'http://web-platform.test:8000/crane/script-insertion-src-forms.html');
}, 'document.baseURI is the document URL');
</script>
</body>
