<!DOCTYPE html>
<meta charset="utf-8">
<title>sw1-b7: a stylesheet a service worker answers with new Response(null) loads</title>
<!--
  static-router-request-destination.https.html and -mutiple-conditions append
  <link rel=stylesheet> to a controlled frame whose worker answers
  new Response(nonce) with no nonce: new Response(null) - no body, no
  Content-Type, which HTML takes as the link type's default, text/css. The
  link's load event must fire: Chrome, Firefox and Safari all fire it
  (static-router-request-destination's "not matched" case passes in all
  three at wpt.fyi 23b0b89b1a). HTML 4.2.4.3 step 7.2's "bodyBytes is null"
  would fire error; Crane follows the browsers (golden rule 2).
-->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/service-workers/service-worker/resources/test-helpers.sub.js"></script>
<body>
<script>
'use strict';
const SCOPE = '/service-workers/service-worker/resources/direct.html';

function appendCSS(win, href) {
  return new Promise((resolve, reject) => {
    const link = win.document.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    link.onload = () => resolve('load');
    link.onerror = () => resolve('error');
    win.document.head.appendChild(link);
  });
}

let frame;
promise_test(async t => {
  const registration = await service_worker_unregister_and_register(t, 'resources/sw1b7-null-body-sw.js', SCOPE);
  await wait_for_state(t, registration.installing, 'activated');
  frame = await with_iframe(SCOPE);
  assert_true(!!frame.contentWindow.navigator.serviceWorker.controller, 'controlled');
}, 'setup');

for (const answer of ['css', 'null', 'string-null']) {
  promise_test(async t => {
    const outcome = await Promise.race([
      appendCSS(frame.contentWindow, `direct.txt?answer=${answer}`),
      new Promise(r => step_timeout(() => r('neither'), 3000))]);
    assert_equals(outcome, 'load');
  }, `a stylesheet answered by ${answer}: load`);
}

promise_test(async t => {
  frame.remove();
  await service_worker_unregister(t, SCOPE);
}, 'cleanup');
</script>
