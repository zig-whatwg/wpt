<!doctype html>
<meta charset="utf-8">
<title>link rel=expect: a target already parsed and closed does not block rendering</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/links.html#process-internal-resource-link">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<meta id="target" name="viewport" content="width=device-width">
<link rel=expect href="#target" blocking="render">
<script>
// Process internal resource link step 5: the indicated element exists and is
// on no parser's stack of open elements, so "otherwise, unblock rendering".
function delay() {
  document.write('<script src="/loading/resources/dummy.js?pipe=trickle(d0.3)"></' + 'script>');
}
const t = async_test("a frame runs while the parser waits in the body");
requestAnimationFrame(t.step_func_done(() => {
  assert_false(!!document.getElementById("after"), "the frame ran during parsing");
}));
</script>
<body>
<p>before</p>
<script>delay();</script>
<script>delay();</script>
<p id="after">after</p>
</body>
