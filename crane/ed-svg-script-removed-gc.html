<!doctype html>
<meta charset="utf-8">
<title>Crane: a queued SVG script's element lives until its load event</title>
<link rel=help href="https://html.spec.whatwg.org/multipage/scripting.html#execute-the-script-element">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<svg id=ed-svg></svg>
<script>
// A script-inserted external SVG script runs from a task, then gets its load
// event (SVG 2 15.2: an SVG script is HTML's script element; HTML "execute
// the script element" step 6 fires load at it). The pending script keeps the
// element until then - Blink's PendingScript traces
// Member<ScriptElementBase> element_, WebKit's PendingScript holds
// Ref<ScriptElement> - even when the script removes its own element and
// nothing else names it. Crane's queued task once held only the element's
// address and generation, checked once before the script ran: a script that
// let its element go and collected freed it, and load was fired at the freed
// slot.
promise_test(async t => {
  assert_true(!!(self.TestUtils && TestUtils.gc), 'TestUtils.gc is available');
  self.log = [];
  (() => {
    const script = document.createElementNS('http://www.w3.org/2000/svg', 'script');
    script.addEventListener('load', () => log.push('load'));
    script.addEventListener('error', () => log.push('error'));
    script.setAttribute('href', 'ed-svg-script-removes-itself.js');
    document.getElementById('ed-svg').appendChild(script);
  })();
  for (let i = 0; i < 50 && !log.includes('load') && !log.includes('error'); i++) {
    await new Promise(r => t.step_timeout(r, 10));
  }
  assert_array_equals(log, ['ran', 'load'], 'the script ran, then its own element got load');
}, 'a queued SVG script that removes its element and collects still gets its load event');
</script>
