<!DOCTYPE html>
<meta charset="utf-8">
<title>MutationObserver callbacks run in creation order (DOM "notify mutation observers" step 2)</title>
<link rel="help" href="https://dom.spec.whatwg.org/#notify-mutation-observers">
<!-- Lane perf2 batch 4. whatwg/dom#1507 (2026-10-09) sorts the pending mutation observers by
     their creation index. The first two cases are wpt#63390's
     dom/nodes/MutationObserver-callback-order.window.js, newer than Crane's pinned WPT tree;
     the third registers observers on one node in another order than they were created. -->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
"use strict";

function nextTask(t) {
  return new Promise(resolve => t.step_timeout(resolve, 0));
}

promise_test(async t => {
  const firstTarget = document.createElement("div");
  const secondTarget = document.createElement("div");
  const order = [];
  const first = new MutationObserver(() => order.push("first"));
  const second = new MutationObserver(() => order.push("second"));
  first.observe(firstTarget, { attributes: true });
  second.observe(secondTarget, { attributes: true });

  secondTarget.setAttribute("data-test", "");
  firstTarget.setAttribute("data-test", "");
  await nextTask(t);

  assert_array_equals(order, ["first", "second"]);
}, "Mutation observers are notified in the order they were created");

promise_test(async t => {
  const parent = document.createElement("div");
  const child = parent.appendChild(document.createElement("div"));
  const order = [];
  const first = new MutationObserver(() => order.push("first"));
  const second = new MutationObserver(() => order.push("second"));
  first.observe(parent, { childList: true });
  second.observe(parent, { attributes: true, subtree: true });

  child.remove();
  child.setAttribute("data-test", "");
  await nextTask(t);

  assert_array_equals(order, ["first", "second"]);
}, "Mutation observers are notified in the order they were created, also when one observes a removed subtree");

promise_test(async t => {
  const target = document.createElement("div");
  const order = [];
  const a = new MutationObserver(() => order.push("a"));
  const b = new MutationObserver(() => order.push("b"));
  const c = new MutationObserver(() => order.push("c"));
  c.observe(target, { attributes: true });
  b.observe(target, { attributes: true });
  a.observe(target, { attributes: true });

  target.setAttribute("data-test", "");
  await nextTask(t);

  assert_array_equals(order, ["a", "b", "c"]);
}, "Observers registered on one node in another order than created are notified in creation order");
</script>
