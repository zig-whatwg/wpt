<!doctype html>
<meta charset="utf-8">
<title>Global event handler defaults by receiver</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#event-handler-idl-attributes">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
for (const [name, create] of [
  ['Window', () => window],
  ['Document', () => document],
  ['HTMLElement', () => document.createElement('span')],
  ['SVGElement', () => document.createElementNS('http://www.w3.org/2000/svg', 'g')],
]) {
  test(() => assert_equals(create().onclick, null), name + ' starts with a null onclick handler');
}
</script>
