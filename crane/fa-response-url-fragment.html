<!doctype html><meta charset="utf-8">
<title>Fetch response URL excludes fragments</title>
<link rel="help" href="https://fetch.spec.whatwg.org/#dom-response-url">
<script src="/resources/testharness.js"></script><script src="/resources/testharnessreport.js"></script>
<script>
promise_test(async () => {
  for (const fragment of ['#', '#part']) {
    const url = new URL('/common/blank.html?kept=%23' + fragment, location.href);
    const request = new Request(url.href);
    const response = await fetch(request);
    const expected = url.href.slice(0, url.href.indexOf('#'));
    assert_equals(response.url, expected);
    assert_equals(response.url, expected, 'repeated getter');
    assert_equals(response.clone().url, expected, 'clone');
    assert_equals(request.url, url.href, 'request retains its fragment');
  }
}, 'Response URL removes only the literal fragment delimiter and its suffix');
</script>
