<!doctype html>
<meta charset="utf-8">
<title>WebCrypto secret key operations use native immutable slots</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
const bytes = hex => Uint8Array.from(hex.match(/../g) ?? [], value => parseInt(value, 16));
const hex = buffer => Array.from(new Uint8Array(buffer), byte => byte.toString(16).padStart(2, "0")).join("");
for (const name of ["AES-CTR", "AES-CBC", "AES-GCM", "AES-KW"]) {
  promise_test(async () => {
    const usages = name === "AES-KW" ? ["wrapKey", "unwrapKey"] : ["encrypt", "decrypt"];
    const material = new Uint8Array(16).fill(42);
    const importing = crypto.subtle.importKey("raw", material, name, true, usages);
    material.fill(0);
    const key = await importing;
    assert_equals(key.type, "secret");
    assert_equals(key.algorithm.name, name);
    assert_equals(key.algorithm.length, 128);
    assert_equals(hex(await crypto.subtle.exportKey("raw", key)), "2a".repeat(16));
    const jwk = await crypto.subtle.exportKey("jwk", key);
    assert_equals(jwk.kty, "oct");
    assert_equals(jwk.ext, true);
    const copy = await crypto.subtle.importKey("jwk", jwk, name, true, usages);
    assert_equals(hex(await crypto.subtle.exportKey("raw", copy)), "2a".repeat(16));
  }, `${name} owns its raw bytes and roundtrips a JWK`);
}
promise_test(async t => {
  const key = await crypto.subtle.importKey("raw", new Uint8Array(20).fill(0x0b), {name: "HMAC", hash: "SHA-256"}, true, ["verify", "sign", "verify"]);
  assert_array_equals(key.usages, ["sign", "verify"]);
  const message = new TextEncoder().encode("Hi There");
  const signature = await crypto.subtle.sign("HMAC", key, message);
  assert_equals(hex(signature), "b0344c61d8db38535ca8afceaf0bf12b881dc200c9833da726e9376c2e32cff7");
  key.algorithm.hash.name = "SHA-1";
  key.usages.length = 0;
  assert_true(await crypto.subtle.verify("HMAC", key, signature, message));
  assert_false(await crypto.subtle.verify("HMAC", key, new Uint8Array(1), message));
  await promise_rejects_dom(t, "InvalidAccessError", crypto.subtle.encrypt({name: "AES-GCM", iv: new Uint8Array(12)}, key, message));
}, "HMAC follows RFC 4231 and ignores mutations of exposed metadata");
promise_test(async () => {
  const key = await crypto.subtle.importKey("raw", new Uint8Array(16), "AES-GCM", true, ["encrypt", "decrypt"]);
  const algorithm = {name: "AES-GCM", iv: new Uint8Array(12)};
  const encrypted = await crypto.subtle.encrypt(algorithm, key, new Uint8Array(16));
  assert_equals(hex(encrypted), "0388dace60b6a392f328c2b971b2fe78ab6e47d42cec13bdf53a67b21257bddf");
  assert_equals(hex(await crypto.subtle.decrypt(algorithm, key, encrypted)), "00".repeat(16));
}, "AES-GCM matches the NIST all-zero vector");
promise_test(async () => {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode("password"), "PBKDF2", false, ["deriveBits", "deriveKey"]);
  const algorithm = {name: "PBKDF2", hash: "SHA-1", iterations: 1, salt: new TextEncoder().encode("salt")};
  assert_equals(hex(await crypto.subtle.deriveBits(algorithm, base, 160)), "0c60c80f961f0e71f3a9b524af6012062fe037a6");
  const key = await crypto.subtle.deriveKey(algorithm, base, {name: "AES-GCM", length: 128}, true, ["encrypt"]);
  assert_equals(hex(await crypto.subtle.exportKey("raw", key)), "0c60c80f961f0e71f3a9b524af601206");
}, "PBKDF2 derives bits and a key using RFC 6070");
promise_test(async t => {
  await promise_rejects_dom(t, "SyntaxError", crypto.subtle.importKey("raw", new Uint8Array(16), "AES-GCM", false, []));
  await promise_rejects_dom(t, "SyntaxError", crypto.subtle.importKey("raw", new Uint8Array(16), "AES-GCM", false, ["sign"]));
  await promise_rejects_dom(t, "DataError", crypto.subtle.importKey("raw", new Uint8Array(15), "AES-GCM", false, ["encrypt"]));
  const key = await crypto.subtle.importKey("raw", new Uint8Array(16), "AES-GCM", false, ["encrypt"]);
  await promise_rejects_dom(t, "InvalidAccessError", crypto.subtle.exportKey("raw", key));
}, "secret keys enforce usage, length, and extractability checks");
promise_test(async () => {
  const wrappingKey = await crypto.subtle.importKey("raw", bytes("000102030405060708090a0b0c0d0e0f"), "AES-KW", false, ["wrapKey", "unwrapKey"]);
  const key = await crypto.subtle.importKey("raw", bytes("00112233445566778899aabbccddeeff"), "AES-GCM", true, ["encrypt"]);
  const wrapped = await crypto.subtle.wrapKey("raw", key, wrappingKey, "AES-KW");
  assert_equals(hex(wrapped), "1fa68b0a8112b447aef34bd8fb5a7b829d3e862371d2cfe5");
  const result = await crypto.subtle.unwrapKey("raw", wrapped, wrappingKey, "AES-KW", "AES-GCM", true, ["encrypt"]);
  assert_equals(hex(await crypto.subtle.exportKey("raw", result)), "00112233445566778899aabbccddeeff");
}, "AES-KW wrap and unwrap match RFC 3394");
</script>
