<!doctype html>
<meta charset="utf-8">
<title>Full-width CSS numeric type exponents</title>
<link rel="help" href="https://drafts.css-houdini.org/css-typed-om-1/#numeric-typing">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body><script>
// Q84 Chrome156/Safari27 probe,2026-10-27: signed32-bit, wrapping beyond.
// Never stringify or convert these shared graphs: their expansion is huge.
test(() => {
  let v = CSS.px(1);
  for (let i = 0; i < 15; i++) v = new CSSMathProduct(v, v);
  const type = v.type(), inverse = new CSSMathInvert(v).type();
  assert_equals(type.length ?? 0, 32768);
  assert_equals(inverse.length ?? 0, -32768);
  if (32768 === 0) { assert_false(Object.hasOwn(type, 'length')); assert_false(Object.hasOwn(inverse, 'length')); }
}, 'Q84 type and inverse at 15 repeated products');
test(() => {
  let v = CSS.px(1);
  for (let i = 0; i < 16; i++) v = new CSSMathProduct(v, v);
  const type = v.type(), inverse = new CSSMathInvert(v).type();
  assert_equals(type.length ?? 0, 65536);
  assert_equals(inverse.length ?? 0, -65536);
  if (65536 === 0) { assert_false(Object.hasOwn(type, 'length')); assert_false(Object.hasOwn(inverse, 'length')); }
}, 'Q84 type and inverse at 16 repeated products');
test(() => {
  let v = CSS.px(1);
  for (let i = 0; i < 30; i++) v = new CSSMathProduct(v, v);
  const type = v.type(), inverse = new CSSMathInvert(v).type();
  assert_equals(type.length ?? 0, 1073741824);
  assert_equals(inverse.length ?? 0, -1073741824);
  if (1073741824 === 0) { assert_false(Object.hasOwn(type, 'length')); assert_false(Object.hasOwn(inverse, 'length')); }
}, 'Q84 type and inverse at 30 repeated products');
test(() => {
  let v = CSS.px(1);
  for (let i = 0; i < 31; i++) v = new CSSMathProduct(v, v);
  const type = v.type(), inverse = new CSSMathInvert(v).type();
  assert_equals(type.length ?? 0, -2147483648);
  assert_equals(inverse.length ?? 0, -2147483648);
  if (-2147483648 === 0) { assert_false(Object.hasOwn(type, 'length')); assert_false(Object.hasOwn(inverse, 'length')); }
}, 'Q84 type and inverse at 31 repeated products');
test(() => {
  let v = CSS.px(1);
  for (let i = 0; i < 32; i++) v = new CSSMathProduct(v, v);
  const type = v.type(), inverse = new CSSMathInvert(v).type();
  assert_equals(type.length ?? 0, 0);
  assert_equals(inverse.length ?? 0, 0);
  if (0 === 0) { assert_false(Object.hasOwn(type, 'length')); assert_false(Object.hasOwn(inverse, 'length')); }
}, 'Q84 type and inverse at 32 repeated products');
</script>
