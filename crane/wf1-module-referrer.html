<!doctype html>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Static worker imports use outside policy; dynamic imports use worker policy</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
for (const shared of [false, true]) {
  for (const kind of ['static', 'dynamic']) {
    for (const responsePolicy of [null, 'origin']) {
    promise_test(async t => {
      let url = `/workers/modules/resources/${kind}-import-same-origin-referrer-checker-worker.js`;
      if (responsePolicy) url += `?pipe=header(Referrer-Policy,${responsePolicy})`;
      const options = {type: 'module', name: `wf1-referrer-${shared}-${kind}-${responsePolicy}`};
      const worker = shared ? new SharedWorker(url, options) : new Worker(url, options);
      const port = shared ? worker.port : worker;
      t.add_cleanup(() => shared ? port.close() : worker.terminate());
      const answer = new Promise((resolve, reject) => {
        port.onmessage = e => resolve(e.data);
        worker.onerror = reject;
      });
      if (shared) port.start();
      const expected = responsePolicy ? location.origin + '/' :
          kind === 'static' ? '' : new URL(url, location.href).href;
      assert_equals(await answer, expected);
    }, `${shared ? 'Shared' : 'Dedicated'} worker ${kind} import with response policy ${responsePolicy ?? 'absent'} selects its referrer policy`);
    }
  }
}
</script>
