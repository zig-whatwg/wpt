<!doctype html>
<meta charset="utf-8">
<title>Empty final cookie Domain</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(t => {
  t.add_cleanup(() => { document.cookie = 'ck_final_domain=; Max-Age=0'; });
  document.cookie = 'ck_final_domain=present; Domain=' + location.hostname + '; Domain=';
  assert_true(document.cookie.split('; ').includes('ck_final_domain=present'));
}, 'An empty final Domain restores host-only storage');
</script>
