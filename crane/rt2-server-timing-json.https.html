<!doctype html>
<meta charset="utf-8">
<title>Server-Timing JSON ownership limitation</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
promise_test(async () => {
  const url = new URL('rt2-server-timing.txt?json', location.href).href;
  await (await fetch(url)).text();
  const entry = performance.getEntriesByName(url)[0];
  assert_equals(entry.serverTiming.length, 2);
  assert_equals(entry.serverTiming, entry.serverTiming);
  // Returned dictionaries now transfer owned handles to the binding.
  // The default toJSON includes the Server-Timing array.
  assert_equals(entry.toJSON().serverTiming.length, 2);
  assert_true(Object.hasOwn(JSON.parse(JSON.stringify(entry)), 'serverTiming'));
}, 'Resource JSON omits serverTiming until the binding can release its handle');
</script>
