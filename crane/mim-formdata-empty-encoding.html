<!doctype html>
<meta charset="utf-8">
<title>Empty FormData has a multipart closing delimiter</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
for (const kind of ["Request", "Response"]) {
  const make = (body, headers) => kind === "Request"
    ? new Request(location.href, {method: "POST", body, headers})
    : new Response(body, {headers});
  promise_test(async () => {
    const body = make(new FormData());
    const type = body.headers.get("Content-Type");
    assert_true(type.startsWith("multipart/form-data; boundary="));
    const boundary = type.slice("multipart/form-data; boundary=".length);
    assert_greater_than(boundary.length, 0);
    assert_equals(await body.text(), `--${boundary}--\r\n`);
  }, `${kind} encodes empty FormData with its closing delimiter`);
  promise_test(async () => {
    assert_array_equals(Array.from((await make(new FormData()).formData()).entries()), []);
  }, `${kind} round-trips empty FormData`);
  promise_test(async t => {
    await promise_rejects_js(t, TypeError,
      make("", {"Content-Type": "multipart/form-data;boundary=boundary"}).formData());
  }, `${kind} rejects raw zero-byte multipart data`);
}
</script>
