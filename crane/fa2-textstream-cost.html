<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>10 MiB Blob text stream peak memory and read cost</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
setup({explicit_done: true});
(async () => {
  const size = 10 * 1024 * 1024;
  const blob = new Blob(['x'.repeat(size)]);
  async function read() {
    const reader = blob.textStream().getReader();
    let length = 0;
    for (;;) {
      const {done, value} = await reader.read();
      if (done) return length;
      assert_equals(typeof value, 'string');
      length += value.length;
    }
  }
  assert_equals(await read(), size);
  const start = performance.now();
  let length = 0;
  for (let i = 0; i < 8; i++) length += await read();
  const elapsed = performance.now() - start;
  test(() => assert_equals(length, 8 * size), 'fa2 cost textStream: ' + elapsed.toFixed(3) + ' ms');
})().catch(e => test(() => { throw e; }, 'Blob text stream cost completes')).finally(done);
</script>
