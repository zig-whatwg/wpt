<!doctype html>
<meta charset="utf-8">
<title>Font palette and synthesis remain independent of font shorthand</title>
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-prop">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="parent"><div id="child"></div></div>
<script>
test(() => {
  const parent = document.getElementById('parent');
  const child = document.getElementById('child');
  parent.style.cssText = '--palette: light; font-palette: var(--palette); font-synthesis: none';
  parent.style.font = '16px serif';
  assert_equals(getComputedStyle(child).getPropertyValue('font-palette'), 'light');
  for (const component of ['weight', 'style', 'small-caps', 'position'])
    assert_equals(getComputedStyle(child).getPropertyValue('font-synthesis-' + component), 'none');
  parent.style.setProperty('--palette', 'dark');
  assert_equals(getComputedStyle(child).getPropertyValue('font-palette'), 'dark');
}, 'font does not reset palette or synthesis and their values inherit');
</script>
