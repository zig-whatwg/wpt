<!doctype html>
<meta charset="utf-8">
<title>Anchor navigation uses the node document encoding</title>
<link rel="help" href="https://html.spec.whatwg.org/#following-hyperlinks">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  const frame = document.createElement('iframe');
  t.add_cleanup(() => frame.remove());
  const loaded = new Promise(resolve => frame.onload = resolve);
  frame.src = '/html/semantics/links/links-created-by-a-and-area-elements/support/anchor-src-encoding-iframe.html';
  document.body.appendChild(frame);
  await loaded;
  assert_equals(frame.contentDocument.characterSet, 'windows-1252');
  const anchor = frame.contentDocument.createElement('a');
  anchor.href = '?\u00df';
  frame.contentDocument.body.appendChild(anchor);
  const navigated = new Promise(resolve => frame.onload = resolve);
  anchor.click();
  await navigated;
  assert_equals(frame.contentWindow.location.search, '?%DF');
}, 'click uses the document encoding for the query');
</script>
