<!doctype html>
<meta charset="utf-8">
<title>Module fetch starts before append returns and completes asynchronously</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
async_test(t => {
  const url = URL.createObjectURL(new Blob([
    "globalThis.dwBlobModuleExecuted = true;"
  ], {type: "text/javascript"}));
  const script = document.createElement("script");
  script.type = "module";
  script.src = url;
  let appendReturned = false;
  t.add_cleanup(() => { script.remove(); URL.revokeObjectURL(url); });
  script.onerror = t.unreached_func("Revocation must not cancel a started module fetch");
  script.onload = t.step_func_done(() => {
    assert_true(appendReturned, "Completion remains asynchronous");
    assert_true(globalThis.dwBlobModuleExecuted, "The fetched module executes");
  });
  document.head.append(script);
  assert_not_equals(globalThis.dwBlobModuleExecuted, true, "Evaluation remains asynchronous");
  URL.revokeObjectURL(url);
  appendReturned = true;
}, "Revoking a blob URL immediately after append preserves its module fetch");

async_test(t => {
  const url = URL.createObjectURL(new Blob([
    "globalThis.dwRevokedModuleExecuted = true;"
  ], {type: "text/javascript"}));
  URL.revokeObjectURL(url);
  const script = document.createElement("script");
  script.type = "module";
  script.src = url;
  let appendReturned = false;
  t.add_cleanup(() => script.remove());
  script.onload = t.unreached_func("A revoked URL cannot start a module fetch");
  script.onerror = t.step_func_done(() => {
    assert_true(appendReturned, "Failure remains asynchronous");
    assert_not_equals(globalThis.dwRevokedModuleExecuted, true);
  });
  document.head.append(script);
  appendReturned = true;
}, "Revoking a blob URL before append rejects its module asynchronously");
</script>
