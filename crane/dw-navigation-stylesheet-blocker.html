<!doctype html>
<meta charset="utf-8">
<title>A navigation parser resumes classic scripts after blocking stylesheets</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
window.dwNavigationEvents = [];

function navigationState() {
  return JSON.stringify({
    events: window.dwNavigationEvents,
    after: !!document.getElementById("after"),
    readyState: document.readyState
  });
}

const inlineTest = async_test("a navigation's inline classic script waits for its sheet and resumes");
const externalTest = async_test("a navigation's external classic script waits for its sheet and resumes");
const eofTest = async_test("a navigation's pending script completes remaining input before document load");

document.addEventListener("DOMContentLoaded", () => dwNavigationEvents.push("DOMContentLoaded"));

window.addEventListener("load", inlineTest.step_func(() => {
  const state = navigationState();
  assert_true(dwNavigationEvents.includes("inline"), state);
  assert_less_than(dwNavigationEvents.indexOf("sheet-inline"), dwNavigationEvents.indexOf("inline"), state);
  inlineTest.done();
}));

window.addEventListener("load", externalTest.step_func(() => {
  const state = navigationState();
  assert_true(dwNavigationEvents.includes("external"), state);
  assert_less_than(dwNavigationEvents.indexOf("sheet-external"), dwNavigationEvents.indexOf("external"), state);
  externalTest.done();
}));

window.addEventListener("load", eofTest.step_func(() => {
  const state = navigationState();
  assert_equals(document.getElementById("after")?.textContent, "after", state);
  assert_equals(document.readyState, "complete", state);
  assert_array_equals(dwNavigationEvents, [
    "sheet-inline", "inline", "sheet-external", "external", "after", "DOMContentLoaded"
  ], state);
  eofTest.done();
}));

for (const testCase of [inlineTest, externalTest, eofTest]) {
  testCase.step_timeout(() => {
    assert_unreached("document load did not complete: " + navigationState());
  }, 6000);
}
</script>
<link rel="stylesheet"
      href="/html/semantics/scripting-1/the-script-element/execution-timing/css/background.css?pipe=trickle(d1)"
      onload="dwNavigationEvents.push('sheet-inline')"
      onerror="dwNavigationEvents.push('error-inline')">
<script>dwNavigationEvents.push("inline");</script>
<link rel="stylesheet"
      href="/html/semantics/scripting-1/the-script-element/execution-timing/css/background.css?external&amp;pipe=trickle(d1)"
      onload="dwNavigationEvents.push('sheet-external')"
      onerror="dwNavigationEvents.push('error-external')">
<script src="resources/dw-navigation-stylesheet-blocker.js"></script>
<p id="after">after</p>
<script>dwNavigationEvents.push("after");</script>
