<!doctype html>
<meta charset="utf-8">
<title>Isolated native checked pseudo-class</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(() => {
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.checked = true;
  assert_true(input.matches(':checked'));
}, ':checked reads the native checkedness state');
</script>
