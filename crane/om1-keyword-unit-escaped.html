<!doctype html>
<meta charset="utf-8">
<title>Typed OM keyword and numeric leaves</title>
<link rel="help" href="https://drafts.css-houdini.org/css-typed-om-1/#csskeywordvalue">
<link rel="help" href="https://drafts.css-houdini.org/css-typed-om-1/#cssunitvalue">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
"use strict";
test(() => {
  const value = new CSSKeywordValue("inherit");
  assert_true(value instanceof CSSStyleValue);
  assert_equals(value.value, "inherit");
  assert_equals(String(value), "inherit");
  value.value = "custom Ident";
  assert_equals(String(value), "custom\\ Ident");
  assert_throws_js(TypeError, () => { value.value = ""; });
  assert_equals(value.value, "custom Ident");
  assert_throws_js(TypeError, () => new CSSKeywordValue(""));
}, "Keywords preserve their string and reject only an empty value");

test(() => {
  const value = new CSSUnitValue(12.5, "px");
  assert_true(value instanceof CSSNumericValue);
  assert_true(value instanceof CSSStyleValue);
  assert_equals(value.value, 12.5);
  assert_equals(value.unit, "px");
  assert_equals(String(value), "12.5px");
  value.value = -7;
  assert_equals(String(value), "-7px");
  assert_equals(String(new CSSUnitValue(3, "number")), "3");
  assert_equals(String(new CSSUnitValue(25, "percent")), "25%");
  assert_throws_js(TypeError, () => new CSSUnitValue(1, "not-a-unit"));
}, "Numeric leaves expose value, unit and CSS serialization");

test(() => {
  assert_equals(CSS.px(2).unit, "px");
  assert_equals(CSS.number(3).value, 3);
  assert_equals(String(CSS.percent(4)), "4%");
  assert_equals(String(CSS.s(5)), "5s");
}, "CSS numeric factories construct the corresponding numeric leaf");
</script>
