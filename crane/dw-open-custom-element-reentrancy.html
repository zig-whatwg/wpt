<!doctype html>
<meta charset="utf-8">
<title>Document.open keeps replace-all inside its custom-element reaction scope</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#document-open-steps">
<link rel="help" href="https://dom.spec.whatwg.org/#concept-node-replace-all">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
function createFrame(t) {
  return new Promise(resolve => {
    const frame = document.createElement('iframe');
    t.add_cleanup(() => frame.remove());
    frame.onload = () => resolve(frame);
    frame.srcdoc = '<!doctype html><body></body>';
    document.body.appendChild(frame);
  });
}

function installReentrantElement(win, writeMarker) {
  win.writeFromCallback = writeMarker;
  win.eval(`
    globalThis.openObservations = [];
    customElements.define('dw-open-reentrant', class extends HTMLElement {
      disconnectedCallback() {
        const doc = this.ownerDocument;
        openObservations.push(doc.readyState);
        doc.open();
        if (writeFromCallback)
          doc.write('<!doctype html><body><p id="callback-marker">callback</p>');
      }
    });
    document.body.appendChild(document.createElement('dw-open-reentrant'));
  `);
}

promise_test(async t => {
  const frame = await createFrame(t);
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  assert_equals(doc.readyState, 'complete');
  installReentrantElement(win, false);
  doc.open();
  assert_array_equals(win.openObservations, ['loading'],
    'The outer open installs its parser before invoking disconnected callbacks');
  doc.write('<!doctype html><body><p id="after-open">retained parser</p>');
  assert_equals(doc.getElementById('after-open').textContent, 'retained parser');
  doc.close();
}, 'A disconnected callback can replace the parser installed by document.open');

promise_test(async t => {
  const frame = await createFrame(t);
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  installReentrantElement(win, true);
  doc.open();
  assert_array_equals(win.openObservations, ['loading']);
  const marker = doc.getElementById('callback-marker');
  assert_not_equals(marker, null, 'The callback writes into its replacement parser');
  assert_equals(marker.textContent, 'callback');
  doc.write('<p id="continued-marker">continued</p>');
  assert_equals(doc.getElementById('callback-marker'), marker);
  assert_equals(doc.getElementById('continued-marker').textContent, 'continued');
  doc.close();
  assert_equals(doc.getElementById('callback-marker'), marker,
    'The callback-created tree survives EOF');
}, 'Writes from a disconnected callback survive the outer document.open return');

promise_test(async t => {
  const frame = await createFrame(t);
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const children = Array.from(doc.childNodes);
  assert_greater_than(children.length, 1, 'The old document has multiple children');
  const observer = new win.MutationObserver(() => {});
  t.add_cleanup(() => observer.disconnect());
  observer.observe(doc, {childList: true});
  doc.open();
  const records = observer.takeRecords();
  assert_equals(records.length, 1, 'Replace-all queues one grouped removal record');
  assert_equals(records[0].target, doc);
  assert_array_equals(Array.from(records[0].removedNodes), children);
  assert_equals(records[0].addedNodes.length, 0);
  assert_equals(records[0].previousSibling, null);
  assert_equals(records[0].nextSibling, null);
  doc.close();
}, 'Document.open uses the grouped mutation record from replace-all');
</script>
