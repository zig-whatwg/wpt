<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>IndexedDB cost: open, put 10,000 records, get 10,000 records in one agent</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// The single-agent path of the Browser's IndexedDB server (lane idbshare1):
// one open, one readwrite transaction with 10,000 puts, one readonly
// transaction with 10,000 gets. The file's duration is the measurement.
function settled(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function done(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onabort = () => reject(tx.error);
  });
}
promise_test(async t => {
  const name = 'ids-cost-put-get-' + Math.random();
  await settled(indexedDB.deleteDatabase(name));
  const open = indexedDB.open(name, 1);
  open.onupgradeneeded = () => open.result.createObjectStore('records');
  const db = await settled(open);
  t.add_cleanup(() => { db.close(); return settled(indexedDB.deleteDatabase(name)); });
  const write = db.transaction('records', 'readwrite');
  const store = write.objectStore('records');
  for (let i = 0; i < 10000; ++i) store.put({i, text: 'record ' + i}, i);
  await done(write);
  const read = db.transaction('records');
  const records = read.objectStore('records');
  let sum = 0;
  for (let i = 0; i < 10000; ++i) records.get(i).onsuccess = e => { sum += e.target.result.i; };
  await done(read);
  assert_equals(sum, 10000 * 9999 / 2);
}, 'open, put 10,000 records, get 10,000 records');
</script>
