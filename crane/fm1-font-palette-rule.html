<!doctype html>
<meta charset="utf-8">
<title>A retained font palette rule owns its descriptors</title>
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#om-fontpalettevalues">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(() => {
  let sheet = new CSSStyleSheet();
  sheet.replaceSync('@font-palette-values --Held { font-family: Ahem; base-palette: 2; override-colors: 3 #123, 3 #456; }');
  const rule = sheet.cssRules[0];
  assert_true(rule instanceof CSSFontPaletteValuesRule);
  sheet.deleteRule(0);
  sheet = null;
  TestUtils.gc();
  TestUtils.gc();
  assert_equals(rule.parentStyleSheet, null);
  assert_equals(rule.name, '--Held');
  assert_equals(rule.fontFamily, 'Ahem');
  assert_equals(rule.basePalette, '2');
  assert_equals(rule.overrideColors, '3 rgb(17, 34, 51), 3 rgb(68, 85, 102)');
}, 'a detached CSSFontPaletteValuesRule survives collection of its former sheet');
</script>
