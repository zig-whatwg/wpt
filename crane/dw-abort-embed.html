<!doctype html>
<meta charset="utf-8">
<title>window.stop cancels an embed resource fetch</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
for (const stop of [true, false]) promise_test(async t => {
  const frame = document.createElement("iframe");
  t.add_cleanup(() => frame.remove());
  const loaded = new Promise(resolve => frame.onload = resolve);
  frame.src = "/common/blank.html";
  document.body.appendChild(frame);
  await loaded;
  const embed = frame.contentDocument.createElement("embed");
  let loads = 0;
  embed.onload = () => loads++;
  embed.type = "image/png";
  embed.src = "/common/slow.py?delay=500&pipe=header(Content-Type,image/png)";
  frame.contentDocument.body.appendChild(embed);
  // The element's setup task must run and start its fetch before stop.
  await new Promise(resolve => t.step_timeout(resolve, 100));
  assert_equals(loads, 0, "the slow resource is still pending before stop");
  if (stop) frame.contentWindow.stop();
  await new Promise(resolve => t.step_timeout(resolve, 800));
  assert_equals(loads, stop ? 0 : 1, stop ? "stop suppresses load" : "the uncanceled producer fires load");
}, stop ? "window.stop prevents a pending embed resource from firing load" : "the uncanceled embed resource fires load");
</script>
