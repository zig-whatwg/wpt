<!doctype html>
<meta charset="utf-8">
<title>location.ancestorOrigins is masked by the iframe's referrerpolicy, snapshotted at navigation start</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/document-sequences.html#internal-ancestor-origin-objects-list-creation-steps">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
// whatwg/html#11560 (2026-03-11): the internal ancestor origin objects list
// masks by the iframe element referrer policy; Firefox ships it (gr2audit A19).
const self_origin = location.origin;

function loaded(iframe) {
  return new Promise(resolve => iframe.addEventListener('load', resolve, {once: true}));
}

promise_test(async t => {
  const iframe = document.createElement('iframe');
  iframe.referrerPolicy = 'no-referrer';
  t.add_cleanup(() => iframe.remove());
  document.body.append(iframe);
  // The initial about:blank document takes the attribute as it is at creation.
  assert_array_equals([...iframe.contentWindow.location.ancestorOrigins], ['null']);
  iframe.referrerPolicy = '';
  assert_array_equals([...iframe.contentWindow.location.ancestorOrigins], ['null'],
                      'the list does not change with the attribute');
}, 'no-referrer masks the initial about:blank document');

promise_test(async t => {
  const iframe = document.createElement('iframe');
  t.add_cleanup(() => iframe.remove());
  iframe.srcdoc = '<p>x';
  const done = loaded(iframe);
  document.body.append(iframe);
  await done;
  assert_array_equals([...iframe.contentWindow.location.ancestorOrigins], [self_origin]);
}, 'no referrerpolicy exposes the parent origin');

promise_test(async t => {
  const iframe = document.createElement('iframe');
  t.add_cleanup(() => iframe.remove());
  document.body.append(iframe);
  iframe.referrerPolicy = 'no-referrer';
  const done = loaded(iframe);
  iframe.srcdoc = '<p>masked';
  // The navigation has started: changing the attribute now does not reach it.
  iframe.referrerPolicy = '';
  await done;
  assert_array_equals([...iframe.contentWindow.location.ancestorOrigins], ['null']);
}, 'the referrer policy is snapshotted when the navigation starts');

promise_test(async t => {
  const iframe = document.createElement('iframe');
  t.add_cleanup(() => iframe.remove());
  iframe.referrerPolicy = 'same-origin';
  iframe.srcdoc = '<p>same origin';
  const done = loaded(iframe);
  document.body.append(iframe);
  await done;
  assert_array_equals([...iframe.contentWindow.location.ancestorOrigins], [self_origin]);
}, 'same-origin does not mask a same-origin parent');

promise_test(async t => {
  const iframe = document.createElement('iframe');
  t.add_cleanup(() => iframe.remove());
  iframe.referrerPolicy = 'same-origin';
  const got = new Promise(resolve => window.addEventListener('message', e => {
    if (e.source === iframe.contentWindow) resolve(e.data);
  }));
  iframe.src = 'data:text/html,<script>parent.postMessage([...location.ancestorOrigins], "*")<\/script>';
  document.body.append(iframe);
  assert_array_equals(await got, ['null']);
}, 'same-origin masks the parent of a document of another origin');

promise_test(async t => {
  const iframe = document.createElement('iframe');
  t.add_cleanup(() => iframe.remove());
  iframe.referrerPolicy = 'no-referrer';
  iframe.srcdoc = '<iframe srcdoc="<p>grandchild"></iframe>';
  const done = loaded(iframe);
  document.body.append(iframe);
  await done;
  const inner = iframe.contentDocument.querySelector('iframe');
  if (!inner.contentDocument || inner.contentDocument.readyState !== 'complete') await loaded(inner);
  // The spec's own example: the masked top origin stays masked below.
  assert_array_equals([...inner.contentWindow.location.ancestorOrigins], [self_origin, 'null']);
}, 'a masked origin stays masked for the grandchild');
</script>
