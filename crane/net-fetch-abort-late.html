<!DOCTYPE html>
<meta charset="utf-8">
<title>fetch(): an abort after the body has arrived, unread, still errors it</title>
<link rel="help" href="https://fetch.spec.whatwg.org/#abort-fetch">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// The abort steps fetch() adds to the request's signal keep responseObject:
// "abort the fetch() call" errors its body if it is still readable - also
// when every byte has arrived and none has been read.
const url = "/fetch/api/resources/data.json";

async function arrived(signal) {
  const response = await fetch(url, { signal });
  // Long enough for a small body to have arrived in full.
  await new Promise(r => setTimeout(r, 200));
  return response;
}

promise_test(async t => {
  const controller = new AbortController();
  const response = await arrived(controller.signal);
  controller.abort();
  await promise_rejects_dom(t, "AbortError", response.body.getReader().read());
}, "the body's stream, made after the abort, is errored");

promise_test(async t => {
  const controller = new AbortController();
  const response = await arrived(controller.signal);
  const reader = response.body.getReader();
  controller.abort();
  await promise_rejects_dom(t, "AbortError", reader.read());
}, "the body's stream, made before the abort, is errored");

promise_test(async t => {
  const controller = new AbortController();
  const response = await arrived(controller.signal);
  const reason = new Error("mine");
  controller.abort(reason);
  await promise_rejects_exactly(t, reason, response.text());
  await promise_rejects_exactly(t, reason, response.json(), "again, with the reason");
}, "the body methods reject with the abort reason, every time");

promise_test(async () => {
  const controller = new AbortController();
  const response = await arrived(controller.signal);
  const text = await response.text();
  controller.abort();
  assert_true(text.length > 0);
  assert_true(response.bodyUsed);
}, "an abort after the body was read changes nothing");
</script>
