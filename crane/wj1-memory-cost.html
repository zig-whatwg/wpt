<!doctype html>
<meta charset="utf-8">
<title>WebAssembly Memory construction cost</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>

const make = () => new WebAssembly.Memory({initial:0,maximum:1});
const read = m => m.buffer.byteLength === 0 ? 1 : 0;
let checksum = 0;
function batch() {
  const values = new Array(100);
  for (let i = 0; i < 100; i++) values[i] = make();
  for (let i = 0; i < 100; i++) checksum += read(values[i]);
}
for (let i = 0; i < 10; i++) batch();
checksum = 0;
const start = performance.now();
for (let i = 0; i < 100; i++) batch();
const elapsed = performance.now() - start;
test(() => assert_equals(checksum, 100 * 100),
  `Wasm Memory construction: ${elapsed.toFixed(6)} ms for 100 batches`);
</script>
