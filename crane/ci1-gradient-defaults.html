  },
  {

];
function hasMethod(value, method) {
  assert_true(value.startsWith('linear-gradient('), 'a valid gradient');
  return value.startsWith(`linear-gradient(in ${method}, `);
}
for (const c of cases) {
  for (const method of ['srgb', 'oklab']) {
    const input = `linear-gradient(in ${method}, ${c.stop}, blue)`;
    test(() => {
      const target = document.createElement('div');
      target.style.backgroundImage = input;
      assert_equals(hasMethod(target.style.backgroundImage, method),
                    c.specified !== (method === 'srgb'));
    }, `Specified default: ${c.stop}, method ${method}, scheme ${c.scheme}, parent ${c.parent}`);
    test(t => {
      const root = document.documentElement;
      const oldScheme = root.style.colorScheme;
      const opposite = c.scheme === 'light' ? 'dark' : 'light';
      root.style.colorScheme = opposite;
      const parent = document.createElement('div');
      parent.style.colorScheme = opposite;
      parent.style.color = c.parent;
      const target = document.createElement('div');
      target.style.colorScheme = c.scheme;
      target.style.backgroundImage = input;
      parent.append(target);
      document.body.append(parent);
      t.add_cleanup(() => { parent.remove(); root.style.colorScheme = oldScheme; });
      assert_equals(getComputedStyle(root).colorScheme, opposite);
      assert_equals(getComputedStyle(parent).colorScheme, opposite);
      assert_equals(getComputedStyle(target).colorScheme, c.scheme);
      if (c.parent.startsWith('oklch(')) {
        assert_equals(getComputedStyle(parent).color, c.parent,
                      'modern inherited color must be supported');
      }
      assert_equals(hasMethod(getComputedStyle(target).backgroundImage, method),
                    c.computed !== (method === 'srgb'));
    }, `Computed default: ${c.stop}, method ${method}, scheme ${c.scheme}, parent ${c.parent}`);
  }
}
