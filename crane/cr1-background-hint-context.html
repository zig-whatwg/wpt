<!doctype html>
<meta charset="utf-8">
<title>HTML background hint base URL and adoption</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/rendering.html#tables-2">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
function makeTable(t) {
  const table = document.createElement('table');
  table.innerHTML = '<tbody><tr><td>hint context</td></tr></tbody>';
  document.body.append(table);
  t.add_cleanup(() => table.remove());
  return table;
}
function settle(t) { return new Promise(resolve => t.step_timeout(resolve, 1000)); }
promise_test(async t => {
  const table = makeTable(t);
  const hint = new URL('/resource-timing/resources/blue.png?cr1-hint-author-hidden', location).href;
  const author = new URL('/resource-timing/resources/blue.png?cr1-hint-author-used', location).href;
  table.setAttribute('background', hint);
  table.style.backgroundImage = `url("${author}")`;
  assert_equals(getComputedStyle(table).backgroundImage, `url("${author}")`);
  await settle(t);
  assert_equals(performance.getEntriesByName(hint).length, 0);
  assert_equals(performance.getEntriesByName(author).length, 1);
}, 'an author image replaces the background hint before fetching');
promise_test(async t => {
  const base = document.createElement('base');
  base.href = '/resource-timing/resources/';
  document.head.prepend(base);
  t.add_cleanup(() => base.remove());
  const table = makeTable(t);
  const value = 'blue.png?cr1-hint-base';
  table.setAttribute('background', value);
  const first = new URL(value, base.href).href;
  assert_equals(getComputedStyle(table).backgroundImage, `url("${first}")`);
  await settle(t);
  assert_equals(performance.getEntriesByName(first).length, 1);
  base.href = '/images/';
  const second = new URL(value, base.href).href;
  assert_equals(getComputedStyle(table).backgroundImage, `url("${second}")`, 'base mutation invalidates the hint');
  await settle(t);
  assert_equals(performance.getEntriesByName(second).length, 1);
}, 'a document base URL change resolves a background hint against the new base');
promise_test(async t => {
  const table = makeTable(t);
  table.setAttribute('background', 'blue.png?cr1-hint-adopt');
  const oldURL = new URL(table.getAttribute('background'), document.baseURI).href;
  assert_equals(getComputedStyle(table).backgroundImage, `url("${oldURL}")`);
  const frame = document.createElement('iframe');
  frame.srcdoc = '<!doctype html><base href="/resource-timing/resources/"><body>';
  const loaded = new Promise(resolve => frame.onload = resolve);
  document.body.append(frame);
  t.add_cleanup(() => frame.remove());
  await loaded;
  frame.contentDocument.body.append(table);
  const newURL = new URL(table.getAttribute('background'), frame.contentDocument.baseURI).href;
  assert_not_equals(newURL, oldURL);
  assert_equals(frame.contentWindow.getComputedStyle(table).backgroundImage, `url("${newURL}")`);
  await settle(t);
  assert_equals(frame.contentWindow.performance.getEntriesByName(newURL).length, 1);
}, 'adoption recomputes a background hint in the receiving document');
</script>
