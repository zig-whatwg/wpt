<!DOCTYPE html>
<meta charset="utf-8">
<title>A frame's initial about:blank document, written and closed, loads and runs what was written</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#dom-document-close">
<link rel="help" href="https://html.spec.whatwg.org/multipage/iframe-embed-object.html#iframe-load-event-steps">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
// common/security-features' "iframe-blank" source context, in its parts: an
// iframe with no src, then document.write() of a page that loads
// common.sub.js and listens for a message, then document.close() - whose
// "the end" queues the frame's load event - then a message round trip. Each
// stage times out on its own, so a failure names the stage.

function within(promise, stage, ms = 3000) {
  return Promise.race([promise, new Promise((_, reject) => step_timeout(() => reject(new Error("stage did not finish: " + stage)), ms))]);
}

promise_test(async () => {
  const iframe = document.createElement("iframe");
  const first = new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
  document.body.appendChild(iframe);
  await within(first, "the initial about:blank load event");
  await new Promise(resolve => step_timeout(resolve, 0));

  const second = new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
  iframe.contentDocument.write(
      "<!DOCTYPE html><html><head>" +
      "<script src='/common/security-features/resources/common.sub.js'><\/script>" +
      "<script>window.addEventListener('message', e => parent.postMessage('pong:' + typeof invokeRequest, '*'));<\/script>" +
      "</head></html>");
  iframe.contentDocument.close();
  await within(second, "the load event after document.close()");
  assert_equals(iframe.contentDocument.scripts.length, 2, "the written scripts are in the document");
  assert_equals(typeof iframe.contentWindow.invokeRequest, "function", "the written external script ran");

  const reply = new Promise(resolve => addEventListener("message", e => resolve(e.data), { once: true }));
  iframe.contentWindow.postMessage("ping", "*");
  assert_equals(await within(reply, "the message round trip"), "pong:function");
}, "write, close, load, then a message round trip");

promise_test(async () => {
  const iframe = document.createElement("iframe");
  const first = new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
  document.body.appendChild(iframe);
  await within(first, "the initial about:blank load event");
  iframe.contentDocument.write("<script>window.ranInline = 1; window.addEventListener('message', e => parent.postMessage('pong', '*'));<\/script>");
  iframe.contentDocument.close();
  assert_equals(iframe.contentWindow.ranInline, 1, "the written inline script ran");
  const reply = new Promise(resolve => addEventListener("message", e => resolve(e.data), { once: true }));
  iframe.contentWindow.postMessage("ping", "*");
  assert_equals(await within(reply, "the message round trip"), "pong");
}, "an inline written listener hears the parent's message, and answers");
</script>
