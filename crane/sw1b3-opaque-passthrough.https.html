<!DOCTYPE html>
<meta name="timeout" content="long">
<title>Crane: an opaque response a service worker answers with reaches a script element whole</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script src="/service-workers/service-worker/resources/test-helpers.sub.js"></script>
<body>
<script>
// Lane sw1-b3. respondWith() step 10.2.4 copies the Response object's
// response - for an opaque one, a filtered response whose internal
// response holds the network's status and body - and the controlled page's
// script element reads that internal response (HTML "fetch a classic
// script": response's unsafe response). The script must load and run as it
// does with no service worker in the way.
const SCOPE = '/crane/resources/sw1b3-cost-scope/';
const SCRIPT = get_host_info().HTTPS_REMOTE_ORIGIN + '/service-workers/service-worker/resources/opaque-script-small.js';
let frame;

promise_test(async t => {
  const reg = await service_worker_unregister_and_register(t, '/crane/resources/sw1b3-opaque-worker.js', SCOPE);
  await wait_for_state(t, reg.installing, 'activated');
  frame = await with_iframe(SCOPE + 'blank.html');
  assert_not_equals(frame.contentWindow.navigator.serviceWorker.controller, null, 'controlled');
}, 'setup: a controlled frame');

function loadScript(t, search) {
  const w = frame.contentWindow;
  return new Promise((resolve, reject) => {
    const el = w.document.createElement('script');
    el.src = SCRIPT + search;
    el.onload = () => resolve(typeof w.runScript);
    el.onerror = () => reject(new Error('the script did not load'));
    w.document.body.appendChild(el);
  });
}

promise_test(async t => {
  assert_equals(await loadScript(t, '?none'), 'function');
}, 'with no respondWith() the cross-origin script loads (the baseline)');

promise_test(async t => {
  frame.contentWindow.runScript = undefined;
  assert_equals(await loadScript(t, '?net'), 'function');
}, 'respondWith(fetch(request)) of a cross-origin no-cors script: it loads and runs');

promise_test(async t => {
  frame.contentWindow.runScript = undefined;
  assert_equals(await loadScript(t, '?cache'), 'function');
}, 'respondWith() of the opaque response cache.match() gives back: it loads and runs');

promise_test(async t => {
  frame.remove();
  await service_worker_unregister(t, SCOPE);
  const w = await caches.delete('sw1b3-opaque');
}, 'cleanup');
</script>
