<!doctype html>
<meta charset="utf-8">
<title>Whitespace script source resolves relative to the document base</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/scripting.html#prepare-the-script-element">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
async_test(t => {
  const base = document.createElement('base');
  base.href = '/crane/wa1-whitespace-script-source.js';
  document.head.append(base);
  const script = document.createElement('script');
  script.src = '   ';
  script.onload = t.step_func_done(() => assert_equals(wa1WhitespaceScriptLoads, 1));
  script.onerror = t.unreached_func('Whitespace resolves to the base resource');
  t.add_cleanup(() => { script.remove(); base.remove(); delete self.wa1WhitespaceScriptLoads; });
  document.body.append(script);
}, 'Whitespace is not the empty string in script preparation');
</script>
