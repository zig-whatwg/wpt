<!doctype html>
<meta charset="utf-8">
<title>unwrapKey("jwk") parses the unwrapped JWK in a new global, in a page's agent</title>
<!--
  Lane engfix. WebCrypto "parse a JWK" step 4 parses the unwrapped bytes with
  JSON.parse "in the context of a new global object". Crane makes that global
  with engine.parseJsonInNewGlobal, which made a bare V8 Context::New: in a
  page's agent, restored from Crane's snapshot, that crashed the page (the
  tests/v8/new_global_snapshot_test.zig crash). Every test here unwraps a JWK
  from a page, several times over; a crash fails them all.
-->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
const encoder = new TextEncoder();

async function aesCbcKek() {
  return crypto.subtle.importKey("raw", new Uint8Array(16).fill(7), "AES-CBC", false, ["encrypt", "unwrapKey"]);
}

promise_test(async () => {
  const kek = await crypto.subtle.generateKey({name: "AES-KW", length: 128}, false, ["wrapKey", "unwrapKey"]);
  const key = await crypto.subtle.generateKey({name: "AES-GCM", length: 256}, true, ["encrypt", "decrypt"]);
  const wrapped = await crypto.subtle.wrapKey("jwk", key, kek, "AES-KW");
  const unwrapped = await crypto.subtle.unwrapKey("jwk", wrapped, kek, "AES-KW", "AES-GCM", true, ["encrypt", "decrypt"]);
  assert_true(unwrapped instanceof CryptoKey);
  assert_equals(unwrapped.type, "secret");
  assert_equals(unwrapped.algorithm.name, "AES-GCM");
  assert_equals(unwrapped.algorithm.length, 256);
  const iv = new Uint8Array(12);
  const ciphertext = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, encoder.encode("engfix"));
  const plaintext = await crypto.subtle.decrypt({name: "AES-GCM", iv}, unwrapped, ciphertext);
  assert_equals(new TextDecoder().decode(plaintext), "engfix");
}, "A key wrapped as a JWK with AES-KW unwraps, and decrypts what the original encrypted");

promise_test(async () => {
  const kek = await aesCbcKek();
  const algorithm = {name: "AES-CBC", iv: new Uint8Array(16)};
  const jwk = '{"kty":"oct","k":"AAAAAAAAAAAAAAAAAAAAAA","alg":"A128GCM","ext":true}';
  const ciphertext = await crypto.subtle.encrypt(algorithm, kek, encoder.encode(jwk));
  for (let i = 0; i < 8; i++) {
    const key = await crypto.subtle.unwrapKey("jwk", ciphertext, kek, algorithm, "AES-GCM", true, ["encrypt"]);
    assert_equals(key.algorithm.name, "AES-GCM", `unwrap ${i}`);
    const exported = await crypto.subtle.exportKey("jwk", key);
    assert_equals(exported.k, "AAAAAAAAAAAAAAAAAAAAAA", `unwrap ${i}`);
    assert_equals(Object.getPrototypeOf(exported), Object.prototype, `unwrap ${i}: exportKey's result is the page's`);
  }
}, "A JWK unwrapped eight times in a row, each parsed in a global of its own");

promise_test(async () => {
  const kek = await aesCbcKek();
  const algorithm = {name: "AES-CBC", iv: new Uint8Array(16)};
  const ciphertext = await crypto.subtle.encrypt(algorithm, kek, encoder.encode('{"kty":"oct","k":"AAAAAAAAAAAAAAAAAAAAAA"}'));
  const key = await crypto.subtle.unwrapKey("jwk", ciphertext, kek, algorithm, "AES-GCM", false, ["decrypt"]);
  assert_equals(key.algorithm.length, 128);
  assert_false(key.extractable);
  assert_array_equals(key.usages, ["decrypt"]);
}, "An unwrapped JWK makes a non-extractable key with the usages asked for");

promise_test(async t => {
  const kek = await aesCbcKek();
  const algorithm = {name: "AES-CBC", iv: new Uint8Array(16)};
  const ciphertext = await crypto.subtle.encrypt(algorithm, kek, encoder.encode('{"kty":'));
  await promise_rejects_js(t, SyntaxError,
    crypto.subtle.unwrapKey("jwk", ciphertext, kek, algorithm, "AES-GCM", true, ["encrypt"]));
  // The page is still alive, and the next unwrap works.
  const good = await crypto.subtle.encrypt(algorithm, kek, encoder.encode('{"kty":"oct","k":"AAAAAAAAAAAAAAAAAAAAAA"}'));
  const key = await crypto.subtle.unwrapKey("jwk", good, kek, algorithm, "AES-GCM", true, ["encrypt"]);
  assert_equals(key.type, "secret");
}, "Malformed unwrapped JSON rejects with the page's SyntaxError, and the next unwrap still works");

promise_test(async t => {
  const kek = await aesCbcKek();
  const algorithm = {name: "AES-CBC", iv: new Uint8Array(16)};
  const ciphertext = await crypto.subtle.encrypt(algorithm, kek, encoder.encode('{"k":"AAAAAAAAAAAAAAAAAAAAAA"}'));
  Object.defineProperty(Object.prototype, "kty", {configurable: true, value: "oct"});
  t.add_cleanup(() => { delete Object.prototype.kty; });
  await promise_rejects_dom(t, "DataError",
    crypto.subtle.unwrapKey("jwk", ciphertext, kek, algorithm, "AES-GCM", true, ["encrypt"]));
}, "The unwrapped JWK does not see the page's Object.prototype");
</script>
