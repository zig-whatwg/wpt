<!doctype html>
<meta charset="utf-8">
<title>Image button source changes start real image requests</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  const input = document.createElement('input');
  input.type = 'image';
  document.body.append(input);
  t.add_cleanup(() => input.remove());
  const first = new URL('/resource-timing/resources/blue.png?cr1-input-first', location).href;
  const load = new Promise((resolve, reject) => {
    input.onload = resolve;
    input.onerror = reject;
  });
  input.src = first;
  await load;
  assert_equals(performance.getEntriesByName(first).length, 1);
  assert_equals(performance.getEntriesByName(first)[0].initiatorType, 'input');
  input.type = 'text';
  const second = first + '-changed';
  input.src = second;
  const again = new Promise((resolve, reject) => {
    input.onload = resolve;
    input.onerror = reject;
  });
  input.type = 'image';
  await again;
  assert_equals(performance.getEntriesByName(second).length, 1);
}, 'input image loads on src and relevant type transitions');
</script>
