<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Runner cost at 1,000 subtests</title>
<meta name="timeout" content="long">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<div id="log"></div>
<script>
// Half of a two-point measurement of what a subtest costs the *runner*, as
// opposed to what it costs inside the page.
//
// In-page cost is already known to be ~400us/subtest and the harness itself
// scales flat. What is not known is the cost outside the page: marshalling
// 21,269 results back through JSON.stringify, parsing them, and formatting one
// output line each. That only shows up in the runner's wall clock.
//
// This page and scale-10k.html are identical except for N, and both complete
// normally - no async_test left hanging, or the wall time would just be the
// timeout. Subtract the two wall times, divide by 9,000, and the slope is the
// true per-subtest cost of a test file.
//
// Bodies are empty on purpose: any assertion would measure the assertion.
//
// Baseline measured 2026-08-17, before the runner disabled the harness's HTML
// results table (journal phases, ms):
//
//            subtests   nav   load    wait    wall
//   1k           1001   137    200    2334    2723
//   10k         10001   150    820   21796   23319
//
// Slope over the 9,000 extra subtests: load 0.069 ms/subtest, wait 2.163
// ms/subtest. So 97% of the marginal cost was in the wait phase - after every
// subtest had already run - and it was testharness.js rendering one table row
// per subtest into #log. Nothing reads that table; the runner collects results
// through __wpt_complete/__wpt_results and then destroys the context.
//
// Note the wait scaled 9.34x for 10x the subtests, i.e. linear. It was a large
// per-subtest constant, not an algorithmic blowup, which is why it hid so well:
// every file looked proportionate to its own size.

const N = 1000;
const t0 = Date.now();
for (let i = 0; i < N; i++) {
  test(function () {}, "trivial subtest " + i);
}
const inPageMs = Date.now() - t0;

test(function () {
  assert_equals(N, 1000);
}, "N=" + N + ", in-page registration+run " + inPageMs + "ms (" +
   ((inPageMs * 1000) / N).toFixed(1) + " us/subtest)");
</script>
</body>
</html>
