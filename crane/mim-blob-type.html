<!doctype html>
<meta charset="utf-8">
<title>Blob and File preserve File API type normalization</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// Aligned wpt.fyi stable runs 2026-10-06, parsing.any.html Blob/File:
// Chrome 154, Firefox 157, Safari 27 each 353/955. All three lowercase
// printable ASCII without parsing MIME syntax (File API constructor/slice).
for (const [input, expected] of [
  ['TEXT/HTML;CHARSET=GBK', 'text/html;charset=gbk'],
  ['Text/Plain; A=First;A=Second', 'text/plain; a=first;a=second'],
  [' NOT A MIME TYPE ', ' not a mime type '],
  ['x/x;a="A\\B"', 'x/x;a="a\\b"'],
  ['x/x;\ttest=x', ''],
  ['x/x;\ftest=x', ''],
  ['x/x;a=\u007f', ''],
  ['x/x;a=\u00ff', ''],
  ['x/x;a=\ud800', ''],
  ['', ''],
]) {
  test(() => {
    assert_equals(new Blob([], {type: input}).type, expected);
    assert_equals(new File([], 'name', {type: input}).type, expected);
    assert_equals(new Blob(['abc']).slice(0, 1, input).type, expected);
  }, 'Blob/File/slice normalize ' + JSON.stringify(input));
}
test(() => {
  const blob = new Blob(['abc'], {type: 'TEXT/PLAIN'});
  assert_equals(blob.slice().type, '');
  assert_equals(new Blob([blob]).type, '');
  assert_equals(new File([blob], 'name').type, '');
}, 'Omitting a type does not inherit the source Blob type');
</script>
