<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Repeated child mutations preserve MutationObserver record counts</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
(() => {
const parent = document.createElement("div");
const child = document.createElement("span");
const observer = new MutationObserver(() => {});
observer.observe(parent, {childList: true});
let records = 0;
const start = performance.now();
for (let i = 0; i < 100000; ++i) {
  parent.appendChild(child);
  parent.removeChild(child);
  // Bound the number of queued records without suppressing any mutation.
  if (i % 1000 === 999) records += observer.takeRecords().length;
}
const elapsed = performance.now() - start;
observer.disconnect();
test(() => {
  assert_equals(records, 200000);
  assert_equals(parent.childNodes.length, 0);
  assert_equals(child.parentNode, null);
}, "Append/remove 100000 observed nodes: " + elapsed.toFixed(3) + " ms");
})();
</script>
