<!doctype html>
<meta charset="utf-8">
<title>WebAssembly adaptation in ShadowRealm</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(() => {
  const shadow = new ShadowRealm();
  assert_equals(shadow.evaluate(`(() => {
    const Module = WebAssembly.Module, prototype = Module.prototype;
    function Target() {}
    Target.prototype = null;
    WebAssembly.Module = function() { throw Error('mutable namespace'); };
    const m = Reflect.construct(Module, [new Uint8Array([0,97,115,109,1,0,0,0])], Target);
    if (Object.getPrototypeOf(m) !== prototype) return 'wrong prototype';
    const g = new WebAssembly.Global({value:'i32', mutable:true});
    Object.getOwnPropertyDescriptor(WebAssembly.Global.prototype,'value').set.call(g);
    return g.value === 0 ? 'ok' : 'wrong setter';
  })()`), 'ok');
}, 'ShadowRealm has its own intrinsic Module prototype and optional Global setter argument');
promise_test(async () => {
  const shadow = new ShadowRealm();
  shadow.evaluate(`globalThis.done = 'pending'; void (async () => {
    try {
      const bytes = new Uint8Array([0,97,115,109,1,0,0,0,
        1,7,1,96,2,127,127,1,127,2,7,1,1,109,1,102,0,0,
        3,2,1,0,6,6,1,127,1,65,0,11,7,9,2,1,102,0,1,1,103,3,0,
        10,14,1,12,0,32,0,32,1,16,0,36,0,35,0,11]);
      const i = new WebAssembly.Instance(new WebAssembly.Module(bytes),
        {m:{f:new WebAssembly.Suspending((a,b) => a+b)}});
      const p = WebAssembly.promising(i.exports.f)(2,3);
      if (i.exports.g.value !== 0) throw Error('not suspended');
      globalThis.done = await p === 5 ? 'ok' : 'wrong result';
    } catch(e) { globalThis.done = String(e); }
  })()`);
  for (let n=0; n<10 && shadow.evaluate('done') === 'pending'; n++) await Promise.resolve();
  assert_equals(shadow.evaluate('done'), 'ok');
}, 'ShadowRealm JSPI suspends a primitive return through its own Promise intrinsic');
</script>
