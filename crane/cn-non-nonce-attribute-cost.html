<!doctype html>
<title>10,000 ordinary attribute changes with nonce hooks installed</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
{
  const element = document.createElement('div');
  document.documentElement.append(element);
  const start = performance.now();
  for (let i = 0; i < 10000; ++i) element.setAttribute('data-count', String(i));
  const elapsed = performance.now() - start;
  test(() => assert_equals(element.getAttribute('data-count'), '9999'),
       'CN non-nonce attributes: ' + elapsed.toFixed(3) + ' ms for 10000 writes');
  element.remove();
}
</script>
