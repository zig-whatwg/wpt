<!doctype html>
<meta charset="utf-8">
<title>Generated body Content-Type provenance during Blob packaging</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
const makeForm = () => {
  const form = new FormData();
  form.append("name", "value");
  return form;
};
const compact = type => type.replace(/; /g, ";").toLowerCase();
for (const kind of ["Request", "Response"]) {
  const make = (body, headers) => kind === "Request"
    ? new Request(location.href, {method: "POST", body, headers})
    : new Response(body, {headers});
  for (const [label, body] of [
    ["empty FormData", () => new FormData()],
    ["FormData", makeForm],
    ["URLSearchParams", () => new URLSearchParams("a=b")],
    ["text", () => "body"],
    ["empty text", () => ""],
    ["Blob", () => new Blob(["body"], {type: "Text/Plain; A=First;A=Second"})],
  ]) {
    promise_test(async () => {
      const object = make(body());
      const type = object.headers.get("Content-Type");
      assert_not_equals(type, null);
      assert_equals((await object.blob()).type, type.toLowerCase());
    }, `${kind} preserves generated ${label} Content-Type formatting`);
  }
  promise_test(async () => {
    const object = make(makeForm(), {"Content-Type": "X/X; A=First;A=Second"});
    assert_equals((await object.blob()).type, "x/x;a=first");
  }, `${kind} parses an explicitly supplied Content-Type`);
  promise_test(async () => {
    const object = make(makeForm());
    object.headers.set("content-type", "X/X; A=First;A=Second");
    assert_equals((await object.blob()).type, "x/x;a=first");
  }, `${kind} parses a replacement Content-Type set through Headers`);
  promise_test(async () => {
    const object = make(makeForm());
    const type = object.headers.get("Content-Type");
    object.headers.set("Content-Type", type);
    assert_equals((await object.blob()).type, compact(type));
  }, `${kind} clears generated provenance even when Headers.set repeats its value`);
  promise_test(async () => {
    const object = make(makeForm());
    object.headers.append("CONTENT-TYPE", "X/X; A=First;A=Second");
    assert_equals((await object.blob()).type, "x/x;a=first");
  }, `${kind} parses duplicate Content-Type entries after Headers.append`);
  promise_test(async () => {
    const object = make(makeForm());
    object.headers.delete("content-type");
    assert_equals((await object.blob()).type, "");
  }, `${kind} has no Blob type after Content-Type deletion`);
  promise_test(async () => {
    const object = make(makeForm());
    const type = object.headers.get("Content-Type");
    object.headers.delete("Content-Type");
    object.headers.append("Content-Type", type);
    assert_equals((await object.blob()).type, compact(type));
  }, `${kind} does not restore generated provenance by reappending deleted text`);
  promise_test(async () => {
    const object = make(makeForm());
    const type = object.headers.get("Content-Type");
    object.headers.set("X-Test", "value");
    assert_equals((await object.blob()).type, type.toLowerCase());
  }, `${kind} retains generated provenance when an unrelated header changes`);
  promise_test(async () => {
    const object = make(makeForm());
    const type = object.headers.get("Content-Type");
    const copy = object.clone();
    assert_equals((await copy.blob()).type, type.toLowerCase());
    assert_equals((await object.blob()).type, type.toLowerCase());
  }, `${kind}.clone preserves generated Content-Type provenance`);
  promise_test(async () => {
    const object = make(makeForm());
    const type = object.headers.get("Content-Type");
    const copy = object.clone();
    copy.headers.set("Content-Type", type);
    assert_equals((await copy.blob()).type, compact(type));
    assert_equals((await object.blob()).type, type.toLowerCase());
  }, `${kind}.clone has independent header provenance after mutation`);
}
promise_test(async () => {
  const original = new Request(location.href, {method: "POST", body: makeForm()});
  const type = original.headers.get("Content-Type");
  const copy = new Request(original);
  assert_equals((await copy.blob()).type, type.toLowerCase());
}, "Request constructed from a Request preserves generated Content-Type");
promise_test(async () => {
  const response = Response.json({value: 1});
  assert_equals((await response.blob()).type, "application/json");
}, "Response.json generated Content-Type still packages a JSON Blob");
</script>
