<!DOCTYPE html>
<meta charset="utf-8">
<title>Crane: a module whose top-level await never settles is let go with its page</title>
<!--
  leaks2 lane (2026-10-03). A module script still waiting on top-level await
  when it finishes evaluating hands its evaluation promise to HTML's "run a
  module script" step 8 ("upon rejection, report the exception"): the page
  reacts to it (script_execution.zig, PendingModuleEvaluation). A promise
  that never settles kept that reaction's record - c_allocator, so not in the
  runner's DebugAllocator count - for the life of the process. The reaction
  is dropped when the page's realm ends (engine.PromiseReactionSteps.dropped).
  Not observable from script: the measurement is `leaks --atExit` over a
  runner process running this file.
-->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script type="module">
  window.moduleStarted = true;
  await new Promise(() => {});
  window.moduleFinished = true;
</script>
<script>
promise_test(async () => {
  await new Promise(resolve => setTimeout(resolve, 0));
  assert_true(window.moduleStarted, 'the module ran up to its await');
  assert_equals(window.moduleFinished, undefined, 'and never past it');
}, 'a module script stays suspended on a top-level await that never settles');
</script>
