<!doctype html>
<title>Isolated static worker import interception regression</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/service-workers/service-worker/resources/test-helpers.sub.js"></script>
<script>
promise_test(async t => {
  const root = '/service-workers/service-worker/resources/';
  const url = root + 'service-worker-interception-static-import-worker.js';
  const registration = await service_worker_unregister_and_register(
      t, root + 'service-worker-interception-service-worker.js', url);
  t.add_cleanup(() => registration.unregister());
  await wait_for_state(t, registration.installing, 'activated');
  const worker = new Worker(url, {type: 'module'});
  t.add_cleanup(() => worker.terminate());
  const event = await new Promise(resolve => worker.onmessage = resolve);
  assert_equals(event.data, 'LOADED_FROM_SERVICE_WORKER');
}, 'Static import should be intercepted by a service worker');
</script>
