<!doctype html>
<title>XHR response progress advances between notifications</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
async_test(t => {
  const xhr = new XMLHttpRequest();
  let previous = -1;
  let count = 0;
  xhr.onprogress = t.step_func(e => {
    assert_greater_than(e.loaded, previous, "successive progress events report new bytes");
    previous = e.loaded;
    ++count;
  });
  xhr.onload = t.step_func_done(e => {
    assert_equals(xhr.responseText, "Test Message");
    assert_greater_than(count, 0);
    assert_equals(previous, 12);
    assert_equals(e.loaded, 12);
    assert_equals(xhr.readyState, 4);
  });
  xhr.onerror = t.unreached_func("same-origin echo request failed");
  xhr.open("POST", "/xhr/resources/content.py");
  xhr.send("Test Message");
}, "Response completion does not repeat the last already dispatched progress value");
</script>
