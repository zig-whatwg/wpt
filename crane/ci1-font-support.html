<!doctype html>
<meta charset="utf-8">
<title>Font support conditions follow per-keyword browser support</title>
<link rel="help" href="https://drafts.csswg.org/css-conditional-5/#at-supports-ext">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
// Integrator probes 1023m (Chrome, Firefox, Safari): CSS.supports and the
// @supports rule agree for every keyword. Use the majority for each keyword.
// format(svg) is separate from tech(color-svg). There is no rendering test.
const cases = [
  [
    "font-tech(features-opentype)",
    true
  ],
  [
    "font-tech(features-aat)",
    true
  ],
  [
    "font-tech(features-graphite)",
    false
  ],
  [
    "font-tech(color-COLRv0)",
    true
  ],
  [
    "font-tech(color-COLRv1)",
    true
  ],
  [
    "font-tech(color-svg)",
    true
  ],
  [
    "font-tech(color-sbix)",
    true
  ],
  [
    "font-tech(color-CBDT)",
    false
  ],
  [
    "font-tech(variations)",
    true
  ],
  [
    "font-tech(palettes)",
    true
  ],
  [
    "font-tech(incremental)",
    false
  ],
  [
    "font-tech(incremental-patch)",
    false
  ],
  [
    "font-tech(incremental-range)",
    false
  ],
  [
    "font-tech(incremental-auto)",
    false
  ],
  [
    "font-format(opentype)",
    true
  ],
  [
    "font-format(truetype)",
    true
  ],
  [
    "font-format(woff)",
    true
  ],
  [
    "font-format(woff2)",
    true
  ],
  [
    "font-format(collection)",
    false
  ],
  [
    "font-format(embedded-opentype)",
    false
  ],
  [
    "font-format(svg)",
    false
  ],
  [
    "font-tech(color-colrv1)",
    true
  ],
  [
    "font-format(WOFF2)",
    true
  ],
  [
    "FONT-TECH( FEATURES-AAT )",
    true
  ],
  [
    "font-format(\"woff2\")",
    false
  ],
  [
    "font-tech(features-aat, variations)",
    false
  ],
  [
    "font-tech(features-aat variations)",
    false
  ],
  [
    "font-tech()",
    false
  ],
  [
    "font-format()",
    false
  ],
  [
    "font-tech(unknown)",
    false
  ],
  [
    "font-format(unknown)",
    false
  ]
];
for (const [condition, expected] of cases) {
  test(() => assert_equals(CSS.supports(condition), expected),
       `CSS.supports ${condition}`);
  test(t => {
    const target = document.createElement('div');
    target.id = 'ci1-font-support-target';
    const sheet = document.createElement('style');
    sheet.textContent = `#${target.id} { color: rgb(17, 34, 51); }
      @supports ${condition} { #${target.id} { color: rgb(85, 102, 119); } }`;
    document.body.append(target, sheet);
    t.add_cleanup(() => { sheet.remove(); target.remove(); });
    assert_equals(getComputedStyle(target).color,
                  expected ? 'rgb(85, 102, 119)' : 'rgb(17, 34, 51)');
    // Chrome and Safari preserve the author's case; Firefox lowercases.
    if (condition === 'font-format(WOFF2)' ||
        condition === 'FONT-TECH( FEATURES-AAT )') {
      assert_equals(sheet.sheet.cssRules[1].conditionText, condition);
    }
  }, `@supports ${condition}`);
}
</script>
