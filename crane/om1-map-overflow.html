<title>Non-finite Typed OM property assignment</title>
<link rel="help" href="https://drafts.css-houdini.org/css-typed-om-1/#numeric-objects">
<script src="/resources/testharness.js"></script>

// Q81: spec wins Chrome/Safari 1-1 set splits; existing computation owns ranges.
test(t => {
  const el = document.createElement('div'); document.body.appendChild(el); t.add_cleanup(() => el.remove());
  const v = CSS.px(1e308).mul(2);
  el.attributeStyleMap.set('width', v);
  assert_true(el.style.getPropertyValue('width') === 'calc(infinity * 1px)', 'specified: ' + el.style.getPropertyValue('width'));
  const read = el.attributeStyleMap.get('width');
  assert_true(read instanceof CSSMathSum && String(read) === 'calc(infinitypx)', 'math reification: ' + String(read));
  const control = document.createElement('div'); document.body.appendChild(control);
  control.style.width = 'calc(infinity * 1px)';
  assert_true(getComputedStyle(el).width === getComputedStyle(control).width, 'existing CSS computation');
  const a = el.computedStyleMap().get('width'), b = control.computedStyleMap().get('width');
  assert_true(a.constructor === b.constructor && String(a) === String(b), 'existing computed reification');
  control.remove();
}, 'Q81 px multiplication overflow sets width');
test(t => {
  const el = document.createElement('div'); document.body.appendChild(el); t.add_cleanup(() => el.remove());
  const v = CSS.number(1e308).add(1e308);
  el.attributeStyleMap.set('z-index', v);
  assert_true(el.style.getPropertyValue('z-index') === 'calc(infinity)', 'specified: ' + el.style.getPropertyValue('z-index'));
  const read = el.attributeStyleMap.get('z-index');
  assert_true(read instanceof CSSMathSum && String(read) === 'calc(infinity)', 'math reification: ' + String(read));
  const computed = el.computedStyleMap().get('z-index');
  assert_true(computed instanceof CSSUnitValue && computed.unit === 'number' && computed.value === 2147483647, 'computed unit');
  assert_true(getComputedStyle(el).getPropertyValue('z-index') === '2147483647', 'computed CSSOM');
}, 'Q81 number addition overflow sets z-index');
