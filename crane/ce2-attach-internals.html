<!doctype html>
<meta charset="utf-8">
<title>attachInternals guards and shadow availability</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(() => {
  assert_throws_dom('NotSupportedError', () => document.createElement('div').attachInternals());
  class Disabled extends HTMLElement { static disabledFeatures = ['internals']; }
  customElements.define('ce2-disabled-internals', Disabled);
  assert_throws_dom('NotSupportedError', () => new Disabled().attachInternals());
  class Allowed extends HTMLElement {}
  customElements.define('ce2-allowed-internals', Allowed);
  const element = new Allowed();
  const internals = element.attachInternals();
  assert_true(internals instanceof ElementInternals);
  assert_throws_dom('NotSupportedError', () => element.attachInternals());
  assert_throws_dom('NotSupportedError', () => internals.form);
  assert_throws_dom('NotSupportedError', () => internals.setFormValue('value'));
}, 'attachInternals applies definition, disabledFeatures, and single-call checks');

test(() => {
  class WithShadow extends HTMLElement {
    constructor() {
      super();
      this.root = this.attachShadow({mode: 'closed'});
      this.internals = this.attachInternals();
    }
  }
  customElements.define('ce2-internals-shadow', WithShadow);
  const element = new WithShadow();
  assert_equals(element.shadowRoot, null);
  assert_equals(element.internals.shadowRoot, element.root);
}, 'internals can access an available closed shadow root');
</script>
