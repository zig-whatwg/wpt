// ============================================================================
// CROSS-REALM HELPER
// General solution for cross-realm instanceof checks with iframes.
// JavaScript realms (windows/iframes) each have their own constructors.
// When checking instanceof for objects from a different realm, you must
// use that realm's constructor, not the current realm's.
// ============================================================================

/**
 * Cross-realm instanceof check - works for ANY constructor type.
 * @param {Object} obj - The object to check
 * @param {string} constructorName - Name of the constructor (e.g., 'HTMLBodyElement')
 * @param {Window} realm - The window/realm the object belongs to
 * @returns {boolean} - True if obj is an instance of realm's constructor
 */
function isInstanceOf(obj, constructorName, realm) {
  var Constructor = (realm || window)[constructorName];
  return obj instanceof Constructor;
}

async_test(function(t) {

async_test(function(t) {

  var loadCount = 0;

  iframe.addEventListener('load', t.step_func(function() {
    loadCount++;
  }));

  document.body.appendChild(iframe);

  // Give time for any duplicate events
  setTimeout(t.step_func_done(function() {
    assert_equals(loadCount, 1, 'Load event fired exactly once');
    iframe.remove();
  }), 100);
}, 'Phase 10.2: iframe load event fires once');

async_test(function(t) {
  var iframe = document.createElement('iframe');

  iframe.addEventListener('load', t.step_func_done(function(e) {
    eventObj = e;
    assert_true(e instanceof Event, 'Event object received');
    assert_equals(e.type, 'load', 'Event type is load');
    assert_equals(e.target, iframe, 'Event target is iframe');
    iframe.remove();
  }));

  document.body.appendChild(iframe);
}, 'Phase 10.3: Load event has correct properties');

// PHASE 16: NESTED IFRAMES
// ============================================================================

async_test(function(t) {
  var outer = document.createElement('iframe');
  outer.srcdoc = '<iframe id="inner" srcdoc="<p>Nested</p>"></iframe>';

  outer.onload = t.step_func(function() {
    var inner = outer.contentDocument.getElementById('inner');

    // Inner might need its own load event
    if (inner.contentDocument && inner.contentDocument.body) {
      checkInner();
    } else {
      inner.onload = t.step_func(checkInner);
    }

    function checkInner() {
      assert_not_equals(inner.contentWindow, null, 'Nested iframe has contentWindow');
      outer.remove();
      t.done();
    }
  });

  document.body.appendChild(outer);
}, 'Phase 16.1: Nested iframes work');

async_test(function(t) {
  var outer = document.createElement('iframe');
  outer.srcdoc = '<iframe id="inner" srcdoc="<p>Nested</p>"></iframe>';

  outer.onload = t.step_func(function() {
    var inner = outer.contentDocument.getElementById('inner');

    inner.onload = t.step_func_done(function() {
      // Inner iframe's parent should be outer iframe's window
      assert_equals(inner.contentWindow.parent, outer.contentWindow, 'inner.parent is outer');
      // Inner iframe's top should be main window
      assert_equals(inner.contentWindow.top, window, 'inner.top is main window');
      outer.remove();
    });

    // If already loaded
    if (inner.contentDocument && inner.contentDocument.body) {
      assert_equals(inner.contentWindow.parent, outer.contentWindow, 'inner.parent is outer');
      assert_equals(inner.contentWindow.top, window, 'inner.top is main window');
      outer.remove();
      t.done();
    }
  });

  document.body.appendChild(outer);
}, 'Phase 16.2: Nested iframe parent/top chain correct');

async_test(function(t) {
  var outer = document.createElement('iframe');
  outer.srcdoc = '<iframe id="inner"></iframe>';

  outer.onload = t.step_func_done(function() {
    // Outer's frames collection should include inner
    assert_equals(outer.contentWindow.frames.length, 1, 'Outer has 1 frame');
    outer.remove();
  });

  document.body.appendChild(outer);
}, 'Phase 16.3: Nested iframe in parent frames collection');
