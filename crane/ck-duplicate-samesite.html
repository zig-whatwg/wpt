<!doctype html>
<meta charset="utf-8">
<title>Invalid final cookie SameSite</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(t => {
  t.add_cleanup(() => { document.cookie = 'ck_final_site=; Max-Age=0'; });
  document.cookie = 'ck_final_site=present; SameSite=None; SameSite=unsupported';
  assert_true(document.cookie.split('; ').includes('ck_final_site=present'));
}, 'An unsupported final SameSite replaces None with Default');
</script>
