<!doctype html>
<title>WebSocket number protocols and messages use ECMAScript strings</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/websockets/constants.sub.js"></script>
<script>
for (const value of [1e21, 1e-7, 1.5e30]) {
  async_test(t => {
    const socket = new WebSocket(SCHEME_DOMAIN_PORT + '/protocol_array', value);
    t.add_cleanup(() => socket.close());
    socket.onerror = t.unreached_func('protocol echo connection failed');
    socket.onmessage = t.step_func_done(event => {
      assert_equals(socket.protocol, String(value));
      assert_equals(event.data, String(value));
    });
  }, 'Numeric protocol round-trip: ' + value);
  async_test(t => {
    const socket = new WebSocket(SCHEME_DOMAIN_PORT + '/echo');
    t.add_cleanup(() => socket.close());
    socket.onerror = t.unreached_func('message echo connection failed');
    socket.onopen = t.step_func(() => socket.send(value));
    socket.onmessage = t.step_func_done(event => assert_equals(event.data, String(value)));
  }, 'Numeric message round-trip: ' + value);
}
</script>
