<!doctype html>
<meta charset="utf-8">
<title>Color controls parse CSS Color 4 literals into the HTML sRGB destination</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/input.html#color-state-(type=color)">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
for (const [source, expected] of [
  ['crimson', '#dc143c'], ['bisque', '#ffe4c4'], ['rebeccapurple', '#663399'],
  ['r\\65 d', '#ff0000'], ['rgb(none 100% 0 / none)', '#00ff00'],
  ['rgba(100%, 0%, 0%, 50%)', '#ff0000'], ['rgb(50% 127.5 0 / .25)', '#808000'],
  ['hsl(150deg 100 53.5)', '#12ff88'], ['hsla(-.5turn, 100%, 50%, .25)', '#00ffff'],
  ['hwb(150 20% 10%)', '#33e68c'], ['hwb(45 40% 80%)', '#555555'],
  ['lab(50% 0 0)', '#777777'], ['lch(50 0 123deg)', '#777777'],
  ['oklab(50% 0 0)', '#636363'], ['oklch(65% .15 270)', '#6c88ea'],
  ['color(srgb-linear .5 .5 .5)', '#bcbcbc'],
  ['color(display-p3 .5 0 0)', '#8c0000'], ['color(display-p3 1 0 0)', '#ff0000'],
  ['color(a98-rgb .5 .5 .5)', '#818181'], ['color(prophoto-rgb .5 .5 .5)', '#929292'],
  ['color(xyz-d50 .2005 .14089 .4472)', '#7654cd'],
  ['color(xyz-d65 .21661 .14602 .59452)', '#7654cd'],
  ['rgb(1, 2 3)', '#000000'], ['rgb(1 2 3 * .5)', '#000000'],
  ['rgb(1, 2%, 3)', '#000000'], ['hsl(0, 100, 50)', '#000000'],
  ['currentColor', '#000000']
]) test(() => {
  const input = document.createElement('input');
  input.type = 'color';
  input.value = source;
  assert_equals(input.value, expected);
}, source + ' serializes in the HTML sRGB destination');

test(() => {
  const input = document.createElement('input');
  input.type = 'color';
  input.value = 'ActiveBorder';
  const legacy = input.value;
  input.value = 'ButtonBorder';
  assert_equals(input.value, legacy);
  assert_not_equals(input.value, '#000000');
}, 'Deprecated system colors resolve to their standard system keyword');
</script>
