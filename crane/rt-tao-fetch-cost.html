<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Explicit TAO fetch timing cost control</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(() => {
  const xhr = new XMLHttpRequest();
  const pipe = encodeURIComponent('header(Timing-Allow-Origin,' + location.origin + ')');
  for (let i = 0; i < 2000; ++i) {
    xhr.open('GET', '/common/blank.html?pipe=' + pipe + '&rt-tao-fetch-cost=' + i, false);
    xhr.send();
    assert_equals(xhr.status, 200);
  }
}, '2000 sequential fetches with explicit TAO complete successfully');
</script>
