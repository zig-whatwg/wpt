<!doctype html>
<title>XHR request cost: same-origin and CORS preflight</title>
<meta name="timeout" content="long">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script>
function request(url, cross) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", url);
    if (cross) xhr.setRequestHeader("X-Custom-Header", "cost");
    xhr.onload = () => { assert_equals(xhr.status, 200); resolve(); };
    xhr.onerror = reject;
    xhr.send();
  });
}
promise_test(async () => {
  const start = performance.now();
  for (let n = 0; n < 200; n++) await request("/xhr/resources/content.py", false);
  console.log("XHR_COST same-origin " + (performance.now() - start));
}, "200 same-origin XMLHttpRequests");
promise_test(async () => {
  const url = get_host_info().HTTP_REMOTE_ORIGIN + "/fetch/api/resources/preflight.py?allow_headers=x-custom-header";
  const start = performance.now();
  for (let n = 0; n < 50; n++) await request(url, true);
  console.log("XHR_COST cors " + (performance.now() - start));
}, "50 cross-origin preflighted XMLHttpRequests");
</script>
