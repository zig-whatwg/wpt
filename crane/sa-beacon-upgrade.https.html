<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<title>Beacon upgrades eligible requests before mixed-content rejection</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script src="/common/utils.js"></script>
<script>
promise_test(async t => {
  const violations = [];
  const record = event => {
    if (event.effectiveDirective === 'connect-src') violations.push(event);
  };
  document.addEventListener('securitypolicyviolation', record);
  t.add_cleanup(() => document.removeEventListener('securitypolicyviolation', record));
  const id = token();
  const endpoint = '/beacon/resources/content-type-and-body.py';
  // Keep the HTTPS port so the upgraded request reaches the HTTPS server.
  const origin = get_host_info().HTTPS_REMOTE_ORIGIN.replace(/^https:/, 'http:');
  const url = origin + endpoint + '?cmd=put&id=' + id;
  assert_true(navigator.sendBeacon(url, 'upgraded'));
  for (let attempt = 0; attempt < 100; ++attempt) {
    const response = await fetch(endpoint + '?cmd=get&id=' + id);
    if (response.ok) {
      assert_equals(await response.text(), 'text/plain;charset=UTF-8: upgraded');
      // Report-only CSP must see the original HTTP URL before UIR. Wait
      // for the queued event and verify it was neither lost nor duplicated.
      for (let wait = 0; wait < 20 && violations.length === 0; ++wait)
        await new Promise(resolve => step_timeout(resolve, 10));
      assert_equals(violations.length, 1);
      assert_equals(violations[0].disposition, 'report');
      assert_equals(violations[0].blockedURI, url);
      return;
    }
    await new Promise(resolve => step_timeout(resolve, 50));
  }
  assert_unreached('upgraded beacon did not reach the HTTPS server');
}, 'UIR permits the beacon and report-only CSP sees the original HTTP URL once');
</script>
