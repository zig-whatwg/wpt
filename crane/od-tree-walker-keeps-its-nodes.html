<!DOCTYPE html>
<meta charset="utf-8">
<title>Crane: a TreeWalker keeps its root and its current node</title>
<link rel=help href="https://dom.spec.whatwg.org/#interface-treewalker">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/od-node-document.js"></script>
<body>
<script>
"use strict";
// A TreeWalker script holds keeps its root and its current node, which
// script can set to any node. Blink: NodeIteratorBase::Trace visits root_,
// TreeWalker::Trace visits current_. Before lane ownerdoc both were bare
// pointers.

for (const kind of Object.keys(odDocumentMakers)) {
  promise_test(async t => {
    const walker = (() => {
      const doc = odMakeDocument(kind);
      const div = doc.createElement("div");
      div.innerHTML = "<i>1</i>";
      return doc.createTreeWalker(div);
    })();
    await odCollect(t);
    odAssertDocumentKept(walker.root, kind);
    assert_equals(walker.firstChild().localName, "i");
  }, `${kind}: a TreeWalker over a detached tree`);

  promise_test(async t => {
    const walker = (() => {
      const doc = odMakeDocument(kind);
      const walker = document.createTreeWalker(document.body);
      const elsewhere = doc.createElement("p");
      elsewhere.innerHTML = "<u>u</u>";
      walker.currentNode = elsewhere;
      return walker;
    })();
    await odCollect(t);
    assert_equals(walker.currentNode.localName, "p", "the current node script set");
    odAssertDocumentKept(walker.currentNode, kind);
    assert_equals(walker.firstChild().localName, "u");
  }, `${kind}: a current node in another document, set by script`);

  promise_test(async t => {
    const walker = (() => {
      const doc = odMakeDocument(kind);
      const div = doc.documentElement.appendChild(doc.createElement("div"));
      div.innerHTML = "<p><i>deep</i></p>";
      const walker = doc.createTreeWalker(div);
      walker.nextNode();
      walker.nextNode();
      div.firstChild.remove();
      return walker;
    })();
    await odCollect(t);
    assert_equals(walker.currentNode.localName, "i", "the current node, removed from the root");
    odAssertDocumentKept(walker.currentNode, kind);
  }, `${kind}: a current node removed from the walker's root`);
}
</script>
