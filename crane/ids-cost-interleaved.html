<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>IndexedDB cost: two connections in one agent running interleaved readwrite transactions</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// The transaction scheduler (lane idbshare1: its records are the Browser's
// server's): two connections of one agent alternate 2,000 readwrite
// transactions over one store, so each waits for the one before it to
// finish. The file's duration is the measurement.
function settled(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
promise_test(async t => {
  const name = 'ids-cost-interleaved-' + Math.random();
  await settled(indexedDB.deleteDatabase(name));
  const open = indexedDB.open(name, 1);
  open.onupgradeneeded = () => open.result.createObjectStore('records');
  const first = await settled(open);
  const second = await settled(indexedDB.open(name, 1));
  t.add_cleanup(() => { first.close(); second.close(); return settled(indexedDB.deleteDatabase(name)); });
  const order = [];
  const last = [];
  for (let i = 0; i < 2000; ++i) {
    const db = i % 2 ? second : first;
    const tx = db.transaction('records', 'readwrite');
    tx.objectStore('records').put(i, 'k');
    tx.oncomplete = () => order.push(i);
    if (i === 1999) last.push(new Promise(resolve => { tx.addEventListener('complete', resolve); }));
  }
  await last[0];
  assert_equals(order.length, 2000);
  for (let i = 0; i < 2000; ++i) assert_equals(order[i], i, 'transactions finish in creation order');
  const value = await settled(first.transaction('records').objectStore('records').get('k'));
  assert_equals(value, 1999);
}, 'two connections alternate 2,000 readwrite transactions over one store');
</script>
