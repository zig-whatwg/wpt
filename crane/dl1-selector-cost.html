<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Dialog selector cost with no dialog</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body><section id="root"></section>
<script>
root.innerHTML = '<div></div>'.repeat(10000);
for (let i = 0; i < 10; i++) root.querySelectorAll(':modal, :open');
let count = 0;
const start = performance.now();
for (let i = 0; i < 100; i++) count += root.querySelectorAll(':modal, :open').length;
const elapsed = performance.now() - start;
test(() => assert_equals(count, 0), `100 modal/open queries over 10000 ordinary elements: ${elapsed.toFixed(3)} ms`);
</script>
