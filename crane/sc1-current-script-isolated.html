<!doctype html>
<meta charset="utf-8">
<title>Shadow currentScript, isolated</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/scripting.html#execute-the-script-element">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  const host = document.body.appendChild(document.createElement('div'));
  t.add_cleanup(() => { host.remove(); delete globalThis.sc1RecordCurrentScript; });
  const root = host.attachShadow({mode: 'open'});
  const script = document.createElement('script');
  let observed = 'not executed';
  globalThis.sc1RecordCurrentScript = () => { observed = document.currentScript; };
  script.src = 'sc1-current-script-resource.js';
  const loaded = new Promise((resolve, reject) => {
    script.onload = resolve;
    script.onerror = reject;
  });
  root.appendChild(script);
  await loaded;
  assert_equals(observed, null);
}, 'An external script executing in a shadow root sees currentScript null');
</script>
