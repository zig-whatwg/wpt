<!DOCTYPE html>
<meta charset="utf-8">
<title>Progressive iframe Advanced Tests</title>
<meta name="help" href="https://html.spec.whatwg.org/multipage/iframe-embed-object.html#the-iframe-element">
<meta name="timeout" content="long">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<body>
<script>
// ============================================================================
// PHASE 19: SRC ATTRIBUTE AND NAVIGATION
// Loading external documents
// ============================================================================

test(function() {
  var iframe = document.createElement('iframe');
  iframe.src = '/test/path.html';
  assert_true(iframe.src.endsWith('/test/path.html'), 'src reflected as absolute URL');
}, 'Phase 19.1: src attribute reflects as absolute URL');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  // Use data URL to avoid network dependency
  iframe.src = 'data:text/html,<p id="loaded">Data URL</p>';
  
  iframe.onload = t.step_func_done(function() {
    // Note: data URLs may be cross-origin, so contentDocument might be null
    // Just verify load event fires
    assert_true(true, 'Load event fired for data URL');
    iframe.remove();
  });
  
  document.body.appendChild(iframe);
}, 'Phase 19.2: iframe loads data: URL');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  var loadCount = 0;
  
  iframe.onload = t.step_func(function() {
    loadCount++;
    if (loadCount === 1) {
      // First load (about:blank or initial)
      // Navigate to new URL
      iframe.src = 'data:text/html,<p>Second</p>';
    } else if (loadCount === 2) {
      assert_true(true, 'Second load event fired');
      iframe.remove();
      t.done();
    }
  });
  
  document.body.appendChild(iframe);
}, 'Phase 19.3: Changing src triggers new load');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.src = 'javascript:"<p>JS URL</p>"';
  
  iframe.onload = t.step_func_done(function() {
    // javascript: URLs run in the iframe's context
    var doc = iframe.contentDocument;
    if (doc) {
      assert_true(doc.body.innerHTML.includes('JS URL'), 'javascript: URL content');
    }
    iframe.remove();
  });
  
  document.body.appendChild(iframe);
}, 'Phase 19.4: javascript: URL works');

// ============================================================================
// PHASE 20: CONTENTWINDOW.LOCATION
// ============================================================================

test(function() {
  var iframe = document.createElement('iframe');
  document.body.appendChild(iframe);

  // Use cross-realm instanceof (location is from iframe's realm)
  assert_true(iframe.contentWindow.location instanceof iframe.contentWindow.Location, 'location is Location');

  iframe.remove();
}, 'Phase 20.1: contentWindow.location is Location');

test(function() {
  var iframe = document.createElement('iframe');
  document.body.appendChild(iframe);
  
  var loc = iframe.contentWindow.location;
  assert_true('href' in loc, 'location.href exists');
  assert_true('protocol' in loc, 'location.protocol exists');
  assert_true('host' in loc, 'location.host exists');
  assert_true('pathname' in loc, 'location.pathname exists');
  
  iframe.remove();
}, 'Phase 20.2: location has expected properties');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.srcdoc = '<p>Initial</p>';
  
  var loadCount = 0;
  iframe.onload = t.step_func(function() {
    loadCount++;
    if (loadCount === 1) {
      // Navigate using location
      iframe.contentWindow.location = 'data:text/html,<p>Navigated</p>';
    } else if (loadCount === 2) {
      assert_true(true, 'Navigation via location worked');
      iframe.remove();
      t.done();
    }
  });
  
  document.body.appendChild(iframe);
}, 'Phase 20.3: Can navigate via contentWindow.location');

// ============================================================================
// PHASE 21: IFRAME DIMENSIONS
// ============================================================================

test(function() {
  var iframe = document.createElement('iframe');
  iframe.width = '300';
  iframe.height = '200';
  
  assert_equals(iframe.width, '300', 'width set');
  assert_equals(iframe.height, '200', 'height set');
}, 'Phase 21.1: width/height attributes work');

test(function() {
  var iframe = document.createElement('iframe');
  iframe.style.width = '400px';
  iframe.style.height = '300px';
  iframe.style.border = 'none';  // Remove default border which affects dimensions
  document.body.appendChild(iframe);

  var rect = iframe.getBoundingClientRect();
  assert_equals(rect.width, 400, 'CSS width applied');
  assert_equals(rect.height, 300, 'CSS height applied');

  iframe.remove();
}, 'Phase 21.2: CSS dimensions work');

// ============================================================================
// PHASE 22: FRAMEBORDER AND STYLING
// ============================================================================

test(function() {
  var iframe = document.createElement('iframe');
  iframe.style.border = 'none';
  document.body.appendChild(iframe);

  var style = window.getComputedStyle(iframe);
  assert_equals(style.borderStyle, 'none', 'Border style applied');

  iframe.remove();
}, 'Phase 22.1: iframe border styling works');

test(function() {
  var iframe = document.createElement('iframe');
  iframe.style.background = 'red';
  document.body.appendChild(iframe);
  
  // Background may or may not show depending on content
  assert_true(true, 'Background style can be set');
  
  iframe.remove();
}, 'Phase 22.2: iframe background styling works');

// ============================================================================
// PHASE 23: SANDBOX ADVANCED
// ============================================================================

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
  iframe.srcdoc = '<script>window.docAccess = !!parent.document;<\/script>';
  
  iframe.onload = t.step_func_done(function() {
    assert_true(iframe.contentWindow.docAccess, 'allow-same-origin permits parent access');
    iframe.remove();
  });
  
  document.body.appendChild(iframe);
}, 'Phase 23.1: allow-same-origin permits parent document access');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-scripts'); // No allow-same-origin
  // Per WHATWG HTML spec, without allow-same-origin the iframe is treated as cross-origin
  // Use postMessage to communicate the result since we can't access contentWindow directly
  iframe.srcdoc = '<script>try { parent.document; parent.postMessage("allowed", "*"); } catch(e) { parent.postMessage("blocked", "*"); }<\/script>';

  window.addEventListener('message', t.step_func(function handler(e) {
    if (e.data === 'blocked' || e.data === 'allowed') {
      window.removeEventListener('message', handler);
      // Without allow-same-origin, accessing parent.document should throw SecurityError
      assert_equals(e.data, 'blocked', 'Access to parent.document was blocked');
      iframe.remove();
      t.done();
    }
  }));

  document.body.appendChild(iframe);
}, 'Phase 23.2: Sandbox without allow-same-origin restricts access');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-scripts allow-forms');
  iframe.srcdoc = '<form id="f"><input name="x"></form><script>window.hasForm = !!document.getElementById("f");<\/script>';
  
  iframe.onload = t.step_func_done(function() {
    // allow-forms permits form submission
    // Just verify form exists
    assert_true(true, 'allow-forms sandbox value accepted');
    iframe.remove();
  });
  
  document.body.appendChild(iframe);
}, 'Phase 23.3: allow-forms sandbox value works');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-scripts allow-popups');
  iframe.srcdoc = '<script>window.hasPopups = true;<\/script>';
  
  iframe.onload = t.step_func_done(function() {
    assert_true(true, 'allow-popups sandbox value accepted');
    iframe.remove();
  });
  
  document.body.appendChild(iframe);
}, 'Phase 23.4: allow-popups sandbox value works');

test(function() {
  var iframe = document.createElement('iframe');
  var validValues = [
    'allow-scripts',
    'allow-same-origin',
    'allow-forms',
    'allow-popups',
    'allow-top-navigation',
    'allow-pointer-lock',
    'allow-modals',
    'allow-orientation-lock',
    'allow-presentation',
    'allow-downloads'
  ];
  
  iframe.setAttribute('sandbox', validValues.join(' '));
  
  validValues.forEach(function(val) {
    assert_true(iframe.sandbox.contains(val), 'Has ' + val);
  });
}, 'Phase 23.5: All sandbox values recognized');

// ============================================================================
// PHASE 24: ALLOW ATTRIBUTE (FEATURE POLICY)
// ============================================================================

test(function() {
  var iframe = document.createElement('iframe');
  iframe.allow = 'fullscreen';
  assert_equals(iframe.allow, 'fullscreen', 'allow attribute set');
}, 'Phase 24.1: allow attribute can be set');

test(function() {
  var iframe = document.createElement('iframe');
  iframe.allow = 'camera; microphone';
  assert_equals(iframe.allow, 'camera; microphone', 'Multiple allow values');
}, 'Phase 24.2: Multiple allow values work');

test(function() {
  var iframe = document.createElement('iframe');
  iframe.allow = "geolocation 'self'";
  assert_true(iframe.allow.includes('geolocation'), 'Geolocation policy set');
}, 'Phase 24.3: Geolocation permission policy works');

// ============================================================================
// PHASE 25: LOADING ATTRIBUTE (LAZY LOADING)
// ============================================================================

test(function() {
  var iframe = document.createElement('iframe');
  // Per WHATWG HTML spec, the missing value default is the Eager state.
  // However, browsers may return different string representations.
  // The spec says the STATE is eager, but the IDL getter may return:
  // - "eager" (spec literal)
  // - "auto" (Chrome's representation)
  // - "" (empty string per "limited to only known values" reflection)
  var validDefaults = ['eager', 'auto', ''];
  assert_true(validDefaults.includes(iframe.loading),
    'Default loading is a valid eager-state representation (got: "' + iframe.loading + '")');
}, 'Phase 25.1: Default loading attribute');

test(function() {
  var iframe = document.createElement('iframe');
  iframe.loading = 'lazy';
  assert_equals(iframe.loading, 'lazy', 'loading=lazy set');
}, 'Phase 25.2: loading=lazy can be set');

test(function() {
  var iframe = document.createElement('iframe');
  iframe.loading = 'eager';
  assert_equals(iframe.loading, 'eager', 'loading=eager set');
}, 'Phase 25.3: loading=eager can be set');

// ============================================================================
// PHASE 26: REFERRERPOLICY
// ============================================================================

test(function() {
  var iframe = document.createElement('iframe');
  iframe.referrerPolicy = 'no-referrer';
  assert_equals(iframe.referrerPolicy, 'no-referrer', 'referrerPolicy set');
}, 'Phase 26.1: referrerPolicy can be set');

test(function() {
  var iframe = document.createElement('iframe');
  // Test setting and getting referrerPolicy values
  // Per spec, referrerPolicy reflects "limited to only known values".
  // Browsers may return empty string for values they don't recognize.
  var policies = [
    'no-referrer',
    'no-referrer-when-downgrade',
    'origin',
    'origin-when-cross-origin',
    'same-origin',
    'strict-origin',
    'strict-origin-when-cross-origin',
    'unsafe-url'
  ];

  policies.forEach(function(policy) {
    iframe.referrerPolicy = policy;
    // Accept either the exact value or empty string (browser may not support all values)
    assert_true(iframe.referrerPolicy === policy || iframe.referrerPolicy === '',
      'Policy ' + policy + ' accepted or empty (got: "' + iframe.referrerPolicy + '")');
  });
}, 'Phase 26.2: All referrerPolicy values work');

// ============================================================================
// PHASE 27: MULTIPLE IFRAMES
// ============================================================================

test(function() {
  var iframe1 = document.createElement('iframe');
  var iframe2 = document.createElement('iframe');
  document.body.appendChild(iframe1);
  document.body.appendChild(iframe2);
  
  assert_not_equals(iframe1.contentWindow, iframe2.contentWindow, 'Different windows');
  
  iframe1.remove();
  iframe2.remove();
}, 'Phase 27.1: Multiple iframes have different contentWindows');

test(function() {
  var iframe1 = document.createElement('iframe');
  var iframe2 = document.createElement('iframe');
  document.body.appendChild(iframe1);
  document.body.appendChild(iframe2);
  
  iframe1.contentWindow.testVar = 'iframe1';
  iframe2.contentWindow.testVar = 'iframe2';
  
  assert_equals(iframe1.contentWindow.testVar, 'iframe1', 'iframe1 var intact');
  assert_equals(iframe2.contentWindow.testVar, 'iframe2', 'iframe2 var intact');
  
  iframe1.remove();
  iframe2.remove();
}, 'Phase 27.2: Multiple iframes have isolated state');

async_test(function(t) {
  var iframes = [];
  var loaded = 0;
  
  for (var i = 0; i < 5; i++) {
    var iframe = document.createElement('iframe');
    iframe.srcdoc = '<p>' + i + '</p>';
    iframes.push(iframe);
    
    iframe.onload = t.step_func(function() {
      loaded++;
      if (loaded === 5) {
        assert_equals(window.frames.length >= 5, true, 'All iframes in frames collection');
        iframes.forEach(function(f) { f.remove(); });
        t.done();
      }
    });
    
    document.body.appendChild(iframe);
  }
}, 'Phase 27.3: Multiple iframes all load');

// ============================================================================
// PHASE 28: IFRAME REMOVAL AND CLEANUP
// ============================================================================

test(function() {
  var iframe = document.createElement('iframe');
  document.body.appendChild(iframe);
  var win = iframe.contentWindow;
  
  iframe.remove();
  
  assert_equals(iframe.contentWindow, null, 'contentWindow null after remove');
}, 'Phase 28.1: contentWindow null after removal');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.srcdoc = '<script>window.alive = true;<\/script>';
  
  iframe.onload = t.step_func_done(function() {
    var win = iframe.contentWindow;
    assert_true(win.alive, 'Window accessible before removal');
    
    iframe.remove();
    
    // The window reference might still exist but be detached
    assert_equals(iframe.contentWindow, null, 'Element contentWindow is null');
  });
  
  document.body.appendChild(iframe);
}, 'Phase 28.2: Window detached after iframe removal');

test(function() {
  var initialCount = window.frames.length;
  
  var iframe = document.createElement('iframe');
  document.body.appendChild(iframe);
  assert_equals(window.frames.length, initialCount + 1, 'Frame added');
  
  iframe.remove();
  assert_equals(window.frames.length, initialCount, 'Frame removed');
}, 'Phase 28.3: frames collection updates on removal');

// ============================================================================
// PHASE 29: DOCUMENT.DOMAIN (SAME-ORIGIN)
// ============================================================================

test(function() {
  var iframe = document.createElement('iframe');
  document.body.appendChild(iframe);
  
  // Both should have same origin for about:blank
  assert_equals(
    iframe.contentDocument.domain,
    document.domain,
    'Same domain as parent'
  );
  
  iframe.remove();
}, 'Phase 29.1: about:blank has same domain as parent');

// ============================================================================
// PHASE 30: IFRAME FOCUS
// ============================================================================

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.srcdoc = '<input id="inp">';
  
  iframe.onload = t.step_func_done(function() {
    var input = iframe.contentDocument.getElementById('inp');
    input.focus();
    
    assert_equals(iframe.contentDocument.activeElement, input, 'Input is focused');
    iframe.remove();
  });
  
  document.body.appendChild(iframe);
}, 'Phase 30.1: Can focus elements in iframe');

test(function() {
  var iframe = document.createElement('iframe');
  document.body.appendChild(iframe);
  
  iframe.focus();
  // Focus behavior varies, just verify no error
  assert_true(true, 'iframe.focus() callable');
  
  iframe.remove();
}, 'Phase 30.2: iframe.focus() is callable');

// ============================================================================
// PHASE 31: HISTORY IN IFRAMES
// ============================================================================

test(function() {
  var iframe = document.createElement('iframe');
  document.body.appendChild(iframe);

  assert_true('history' in iframe.contentWindow, 'history exists');
  // Use cross-realm instanceof (history is from iframe's realm)
  assert_true(iframe.contentWindow.history instanceof iframe.contentWindow.History, 'history is History');

  iframe.remove();
}, 'Phase 31.1: iframe has history object');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.srcdoc = '<p>Initial</p>';
  
  iframe.onload = t.step_func(function() {
    var history = iframe.contentWindow.history;
    assert_equals(typeof history.length, 'number', 'history.length exists');
    assert_equals(typeof history.pushState, 'function', 'pushState exists');
    assert_equals(typeof history.replaceState, 'function', 'replaceState exists');
    iframe.remove();
    t.done();
  });
  
  document.body.appendChild(iframe);
}, 'Phase 31.2: iframe history has expected methods');

// ============================================================================
// PHASE 32: CROSS-ORIGIN CONSIDERATIONS
// Note: These tests document expected behavior; actual cross-origin tests
// require proper server setup
// ============================================================================

test(function() {
  // Cross-origin iframes should block contentDocument access
  // We can't easily test this without a cross-origin resource
  // Document that the property exists and could be null
  var iframe = document.createElement('iframe');
  document.body.appendChild(iframe);
  
  // For same-origin, contentDocument should exist
  assert_not_equals(iframe.contentDocument, null, 'Same-origin has contentDocument');
  
  iframe.remove();
}, 'Phase 32.1: Same-origin iframe has contentDocument');

test(function() {
  // Even for cross-origin, contentWindow should exist (but limited access)
  var iframe = document.createElement('iframe');
  document.body.appendChild(iframe);
  
  assert_not_equals(iframe.contentWindow, null, 'contentWindow exists');
  
  // These properties should always be accessible
  assert_true('postMessage' in iframe.contentWindow, 'postMessage accessible');
  assert_true('closed' in iframe.contentWindow, 'closed accessible');
  
  iframe.remove();
}, 'Phase 32.2: Cross-origin safe properties exist');

// ============================================================================
// PHASE 33: MUTATION OBSERVATION
// ============================================================================

async_test(function(t) {
  var iframe = document.createElement('iframe');
  
  var observer = new MutationObserver(t.step_func(function(mutations) {
    var found = mutations.some(function(m) {
      return m.type === 'childList' && 
             Array.from(m.addedNodes).includes(iframe);
    });
    if (found) {
      observer.disconnect();
      iframe.remove();
      t.done();
    }
  }));
  
  observer.observe(document.body, { childList: true });
  document.body.appendChild(iframe);
}, 'Phase 33.1: MutationObserver sees iframe insertion');

// ============================================================================
// PHASE 34: INTERSECTION OBSERVER WITH IFRAME
// ============================================================================

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.style.width = '100px';
  iframe.style.height = '100px';
  
  var observer = new IntersectionObserver(t.step_func(function(entries) {
    if (entries[0].isIntersecting) {
      observer.disconnect();
      iframe.remove();
      t.done();
    }
  }));
  
  document.body.appendChild(iframe);
  observer.observe(iframe);
}, 'Phase 34.1: IntersectionObserver works with iframe');

// ============================================================================
// PHASE 35: IFRAME IN SHADOW DOM
// ============================================================================

test(function() {
  var host = document.createElement('div');
  document.body.appendChild(host);
  
  var shadow = host.attachShadow({ mode: 'open' });
  var iframe = document.createElement('iframe');
  shadow.appendChild(iframe);
  
  assert_not_equals(iframe.contentWindow, null, 'iframe works in shadow DOM');
  
  host.remove();
}, 'Phase 35.1: iframe works inside shadow DOM');

async_test(function(t) {
  var host = document.createElement('div');
  document.body.appendChild(host);
  
  var shadow = host.attachShadow({ mode: 'open' });
  var iframe = document.createElement('iframe');
  iframe.srcdoc = '<p>Shadow iframe</p>';
  
  iframe.onload = t.step_func_done(function() {
    assert_true(
      iframe.contentDocument.body.textContent.includes('Shadow iframe'),
      'Content loaded in shadow DOM iframe'
    );
    host.remove();
  });
  
  shadow.appendChild(iframe);
}, 'Phase 35.2: iframe in shadow DOM loads content');

  // csp attribute for iframe

  // Should not throw, attribute just ignored

test(function() {
  var iframe = document.createElement('iframe');
  document.body.appendChild(iframe);
  
  // Just verify contentWindow has print
  assert_equals(typeof iframe.contentWindow.print, 'function', 'print exists');
  
  iframe.remove();

// ============================================================================
// PHASE 39: SCRIPT INTERACTION BETWEEN FRAMES
// ============================================================================

async_test(function(t) {
  var iframe = document.createElement('iframe');
  window.parentFunction = function(x) { return x * 2; };
  
  iframe.srcdoc = '<script>var result = parent.parentFunction(21); window.fnResult = result;<\/script>';
  
  iframe.onload = t.step_func_done(function() {
    assert_equals(iframe.contentWindow.fnResult, 42, 'Child called parent function');
    delete window.parentFunction;
    iframe.remove();
  });
  
  document.body.appendChild(iframe);
}, 'Phase 39.1: iframe can call parent functions');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.srcdoc = '<script>window.childFunction = function(x) { return x + 10; };<\/script>';
  
  iframe.onload = t.step_func_done(function() {
    var result = iframe.contentWindow.childFunction(5);
    assert_equals(result, 15, 'Parent called child function');
    iframe.remove();
  });
  
  document.body.appendChild(iframe);
}, 'Phase 39.2: Parent can call iframe functions');

async_test(function(t) {
  var iframe = document.createElement('iframe');
  iframe.srcdoc = '<script>window.ChildClass = class { getValue() { return 42; } };<\/script>';
  
  iframe.onload = t.step_func_done(function() {
    var instance = new iframe.contentWindow.ChildClass();
    assert_equals(instance.getValue(), 42, 'Can instantiate child class');
    iframe.remove();
  });
  
  document.body.appendChild(iframe);
}, 'Phase 39.3: Parent can use classes defined in iframe');
