<!doctype html>
<meta charset="utf-8">
<title>link rel=expect: a parsed target unblocks rendering when the parser pops it, not at its start tag</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/links.html#process-internal-resource-link">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<link rel=expect href="#target" blocking="render">
<script>
// Chrome and Safari unblock when the indicated element finishes parsing its
// children (Blink Element::DidFinishParsingChildren, WebKit
// Element::finishParsingChildren); a frame while the parser waits INSIDE the
// target would see #inside-done missing.
function delay() {
  document.write('<script src="/loading/resources/dummy.js?pipe=trickle(d0.3)"></' + 'script>');
}
const t = async_test("the first frame comes after the target's end tag and before the rest of the page");
requestAnimationFrame(t.step_func_done(() => {
  assert_true(!!document.getElementById("target"), "target parsed");
  assert_true(!!document.getElementById("inside-done"), "the target's children were all parsed");
  assert_false(!!document.getElementById("after"), "the frame ran before the rest of the document");
}));
</script>
<body>
<div id="target">
  <p>first child</p>
  <script>delay();</script>
  <p id="inside-done">last child</p>
</div>
<script>delay();</script>
<script>delay();</script>
<p id="after">after</p>
</body>
