<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Requests with an empty cookie jar</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script>
promise_test(async t => {
  const origins = [location.origin, get_host_info().HTTPS_REMOTE_ORIGIN];
  for (let i = 0; i < 200; ++i) {
    const response = await fetch(origins[i % 2] + '/cookies/resources/list.py',
                                 {credentials: 'include', cache: 'no-store'});
    assert_true(response.ok);
    const cookies = await response.json();
    assert_equals(Object.keys(cookies).length, 0);
  }
}, 'An empty cookie jar stays empty across 200 same-host and subdomain requests');
</script>
