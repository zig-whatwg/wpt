<!doctype html>
<meta charset="utf-8">
<title>Decompression uses a native transform</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
promise_test(async t => {
  // RFC 1950 stream containing the ASCII bytes 'hello'.
  const input = Uint8Array.of(120,156,203,72,205,201,201,7,0,6,44,2,21);
  const stream = new DecompressionStream('deflate');
  const writer = stream.writable.getWriter();
  const reader = stream.readable.getReader();
  const write = writer.write(input);
  const first = await reader.read();
  await write;
  assert_true(first.value instanceof Uint8Array);
  assert_array_equals(first.value, [104,101,108,108,111]);
  const close = writer.close();
  assert_true((await reader.read()).done);
  await close;
}, 'A complete deflate input produces decoded bytes before close');
</script>
