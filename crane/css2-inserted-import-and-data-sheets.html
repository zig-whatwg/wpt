<!doctype html>
<meta charset="utf-8">
<title>An @import insertRule() inserts is fetched; data: style sheets are exposed synchronously, their events fire later (lane css2)</title>
<link rel="help" href="https://drafts.csswg.org/css-cascade-4/#fetch-an-import">
<link rel="help" href="https://html.spec.whatwg.org/#link-type-stylesheet">
<!--
  Browser behaviour (golden rule 2): an @import that insertRule() inserts is
  fetched in Chrome, Firefox and Safari; a sheet at a data: URL is in place
  synchronously in Chrome (its data: resources are static data, handed over
  at once) and Firefox (the sheet object exists from the load's start), and
  its load event still fires in a task. A network sheet arrives later, as
  in Chrome and Safari.
-->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="target" class="import">import</div>
<div id="data" class="data">data</div>
<script>
"use strict";

function waitFor(condition, t) {
  return new Promise((resolve, reject) => {
    const deadline = performance.now() + 5000;
    (function poll() {
      if (condition()) return resolve();
      if (performance.now() > deadline) return reject(new Error("timed out"));
      t.step_timeout(poll, 10);
    })();
  });
}

promise_test(async t => {
  const style = document.createElement("style");
  document.head.appendChild(style);
  t.add_cleanup(() => style.remove());
  const { sheet } = style;
  sheet.insertRule('@import "/css/cssom/support/import-green.css"', 0);
  const rule = sheet.cssRules[0];
  assert_equals(rule.styleSheet, null, "a network sheet is not there yet");
  await waitFor(() => rule.styleSheet !== null, t);
  assert_equals(rule.styleSheet.parentStyleSheet, sheet, "parentStyleSheet");
  assert_equals(rule.styleSheet.ownerRule, rule, "ownerRule");
  assert_equals(rule.styleSheet.cssRules.length, 1, "its rules");
  assert_equals(getComputedStyle(document.getElementById("target")).color, "rgb(0, 128, 0)", "the imported rule applies");
}, "insertRule @import of a network URL: fetched, delivered to the rule, applied");

test(() => {
  const style = document.createElement("style");
  document.head.appendChild(style);
  const { sheet } = style;
  sheet.insertRule('@import "data:text/css,.data{color:rgb(0,0,255)}"', 0);
  const rule = sheet.cssRules[0];
  assert_not_equals(rule.styleSheet, null, "a data: sheet is there at once");
  assert_equals(rule.styleSheet.parentStyleSheet, sheet);
  assert_equals(rule.styleSheet.cssRules.length, 1);
  assert_equals(getComputedStyle(document.getElementById("data")).color, "rgb(0, 0, 255)");
  style.remove();
}, "insertRule @import of a data: URL: its sheet at once");

async_test(t => {
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "data:text/css,.data{color:rgb(1,2,3)}";
  let loads = 0;
  link.onload = t.step_func_done(() => {
    loads++;
    assert_equals(loads, 1, "one load event");
    link.remove();
  });
  link.onerror = t.unreached_func("error");
  document.head.appendChild(link);
  assert_not_equals(link.sheet, null, "the sheet at once");
  assert_equals(link.sheet.cssRules.length, 1);
  assert_equals(getComputedStyle(document.getElementById("data")).color, "rgb(1, 2, 3)");
  assert_equals(loads, 0, "the load event fires later");
}, "A data: stylesheet link: its sheet at once, its load event in a task");

async_test(t => {
  const style = document.createElement("style");
  style.textContent = '@import "data:text/css,.data{color:rgb(4,5,6)}";';
  let loads = 0;
  style.onload = t.step_func_done(() => {
    loads++;
    style.remove();
  });
  document.head.appendChild(style);
  const rule = style.sheet.cssRules[0];
  assert_not_equals(rule.styleSheet, null, "the data: import at once");
  assert_equals(getComputedStyle(document.getElementById("data")).color, "rgb(4, 5, 6)");
  assert_equals(loads, 0, "the load event fires later");
}, "A style element's data: @import: its sheet at once, the element's load event in a task");
</script>
