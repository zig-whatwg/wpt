<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>document.write cost without a Trusted Types policy</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
const frame = document.createElement("iframe");
document.body.append(frame);
const doc = frame.contentDocument;
doc.open();
doc.write("<!doctype html><body>");
const writeStart = performance.now();
for (let i = 0; i < 10000; ++i) doc.write("x");
const writeElapsed = performance.now() - writeStart;
doc.close();
test(() => {
  assert_equals(doc.body.textContent, "x".repeat(10000));
}, "Document write: " + writeElapsed.toFixed(3) + " ms for 10000 calls");
frame.remove();
</script>
