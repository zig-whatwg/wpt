<!doctype html>
<meta charset="utf-8">
<title>CSS fragmentation declarations survive real arbitrary substitution</title>
<link rel="help" href="https://drafts.csswg.org/css-break-4/#break-between">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="target"></div>
<script>
test(() => {
  const target = document.getElementById("target");
  target.style.setProperty("--break", "avoid-page");
  target.style.setProperty("break-before", "var(--break)");
  assert_equals(getComputedStyle(target).getPropertyValue("break-before"), "avoid-page");
}, "break-before uses the existing variable substitution and computed-style path");
</script>
