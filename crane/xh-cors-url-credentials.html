<!doctype html>
<meta charset="utf-8">
<title>CORS never sends URL credentials through the transport</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script>
for (const asynchronous of [false, true]) for (const credentials of [false, true]) {
  promise_test(async () => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', get_host_info().HTTP_REMOTE_ORIGIN + '/xhr/resources/access-control-auth-basic.py?uid=fooUser', asynchronous, 'fooUser', 'barPass');
    xhr.withCredentials = credentials;
    const done = asynchronous ? new Promise((resolve, reject) => { xhr.onload = resolve; xhr.onerror = reject; }) : Promise.resolve();
    xhr.send();
    await done;
    assert_equals(xhr.status, 401);
  }, `${asynchronous ? 'Async' : 'Sync'} cross-origin URL credentials, withCredentials=${credentials}`);
}
</script>
