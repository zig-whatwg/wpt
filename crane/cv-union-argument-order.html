<!DOCTYPE html>
<meta charset="utf-8">
<title>A union argument is converted in argument order, before the later arguments</title>
<link rel=help href="https://webidl.spec.whatwg.org/#js-union">
<link rel=help href="https://webidl.spec.whatwg.org/#dfn-create-operation-function">
<link rel=help href="https://drafts.csswg.org/css-font-loading/#font-face-constructor">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// WebIDL converts every argument, in order, before the operation's steps
// run. FontFace(family, (CSSOMString or BufferSource) source, optional
// FontFaceDescriptors descriptors = {}): `source` is converted - an object
// that is no buffer source is a CSSOMString, by ToString - before any of
// the descriptors' members is read.
test(() => {
  const log = [];
  const source = { toString() { log.push("source"); return "url(x)"; } };
  const descriptors = {
    get style() { log.push("descriptors.style"); return "normal"; },
    get weight() { log.push("descriptors.weight"); return "400"; },
  };
  try { new FontFace("f", source, descriptors); } catch (e) {}
  assert_array_equals(log, ["source", "descriptors.style", "descriptors.weight"]);
}, "FontFace: the source union is converted before the descriptors dictionary");

test(() => {
  const log = [];
  const source = { toString() { log.push("source"); throw new Error("source threw"); } };
  const descriptors = { get style() { log.push("descriptors.style"); return "normal"; } };
  assert_throws_js(Error, () => new FontFace("f", source, descriptors));
  assert_array_equals(log, ["source"], "the descriptors are not read once the source threw");
}, "FontFace: a throwing source conversion comes before the descriptors are read");

test(() => {
  const select = document.createElement("select");
  const option = document.createElement("option");
  select.add(option, null);
  assert_equals(select.options.length, 1);
  assert_equals(select.options[0], option);
  const group = document.createElement("optgroup");
  select.add(group);
  assert_equals(select.lastElementChild, group);
  assert_throws_js(TypeError, () => select.add(document.createElement("div")));
  assert_throws_js(TypeError, () => select.add("option"));
}, "select.add: (HTMLOptionElement or HTMLOptGroupElement) converted by the binding");
</script>
