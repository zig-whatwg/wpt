<!doctype html>
<meta charset="utf-8">
<title>Script credentials propagate to module fetches</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#script-fetch-options">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
const remote = 'http://{{domains[www2]}}:{{ports[http][0]}}';
const cookieName = 'sc2credentials';
const ready = fetch(remote + '/cookies/resources/set-cookie.py?name=' + cookieName + '&path=/', {mode:'no-cors', credentials:'include'});
function moduleURL(id) {
  return remote + '/html/semantics/scripting-1/the-script-element/module/resources/check-cookie.py?id=' + id + '&cookieName=' + cookieName + '&origin=' + encodeURIComponent(location.origin);
}
function loadScript(t, script) {
  const loaded = new Promise((resolve, reject) => { script.onload=resolve; script.onerror=reject; });
  t.add_cleanup(() => script.remove());
  document.body.appendChild(script);
  return loaded;
}
promise_test(async t => {
  await ready;
  const script = document.createElement('script');
  script.type = 'module';
  script.crossOrigin = 'use-credentials';
  script.src = moduleURL('sc2RootCredentials');
  await loadScript(t, script);
  assert_equals(window.sc2RootCredentials, 'found');
}, 'External module root honors use-credentials');
promise_test(async t => {
  await ready;
  const script = document.createElement('script');
  script.type = 'module';
  script.crossOrigin = 'use-credentials';
  const executed = new Promise((resolve, reject) => { window.sc2StaticResolve = resolve; script.onerror = reject; });
  script.textContent = 'import ' + JSON.stringify(moduleURL('sc2StaticCredentials')) + '; window.sc2StaticResolve();';
  t.add_cleanup(() => script.remove());
  document.body.appendChild(script);
  await executed;
  assert_equals(window.sc2StaticCredentials, 'found');
}, 'Inline module static imports inherit use-credentials');
for (const type of ['', 'module']) {
  promise_test(async t => {
    await ready;
    const script = document.createElement('script');
    script.type = type;
    script.crossOrigin = 'use-credentials';
    const id = type ? 'sc2DynamicModuleCredentials' : 'sc2DynamicClassicCredentials';
    const executed = new Promise((resolve, reject) => { window[id + 'Resolve'] = resolve; window[id + 'Reject'] = reject; script.onerror = reject; });
    script.textContent = 'import(' + JSON.stringify(moduleURL(id)) + ').then(window.' + id + 'Resolve, window.' + id + 'Reject)';
    document.body.appendChild(script);
    t.add_cleanup(() => script.remove());
    await executed;
    assert_equals(window[id], 'found');
  }, 'Dynamic import from ' + (type || 'classic') + ' inherits use-credentials');
}
promise_test(async t => {
  await ready;
  const script = document.createElement('script');
  script.type = 'module';
  script.crossOrigin = 'anonymous';
  script.src = moduleURL('sc2AnonymousCredentials');
  await loadScript(t, script);
  assert_equals(window.sc2AnonymousCredentials, 'not found');
}, 'Anonymous module excludes cross-origin credentials');
for (const initiallyIncluded of [true, false]) {
  promise_test(async t => {
    await ready;
    const id = initiallyIncluded ? 'sc2ClassicCapturedInclude' : 'sc2ClassicCapturedAnonymous';
    window.sc2CredentialsModuleURL = moduleURL(id);
    const script = document.createElement('script');
    script.crossOrigin = initiallyIncluded ? 'use-credentials' : 'anonymous';
    script.src = 'sc2-credentials-classic.js?pipe=trickle(d0.2)';
    const loaded = loadScript(t, script);
    script.crossOrigin = initiallyIncluded ? 'anonymous' : 'use-credentials';
    await loaded;
    await window.sc2ClassicDescendant;
    assert_equals(window[id], initiallyIncluded ? 'found' : 'not found');
  }, 'Classic import preserves initial ' + (initiallyIncluded ? 'use-credentials' : 'anonymous') + ' after crossorigin mutation');
}
</script>
