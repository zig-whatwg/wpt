<!DOCTYPE html>
<meta charset="utf-8">
<title>Crane: a node wrapper used as a WeakMap key, WeakSet member, WeakRef target or FinalizationRegistry target survives young-generation collections while its node lives</title>
<link rel=help href="https://tc39.es/ecma262/#sec-weakmap-objects">
<link rel=help href="https://tc39.es/ecma262/#sec-weak-ref-objects">
<link rel=help href="https://tc39.es/ecma262/#sec-finalization-registry-objects">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
"use strict";
// The wrapper redesign's P8 (tmp/redesign/wrapper-redesign-design.md 4.11,
// risk R3): node slots are droppable references, so V8 may reclaim a node's
// wrapper in a young-generation collection when nothing reaches it and it is
// an "unmodified API object" (V8 13.1 JSObject::IsUnmodifiedApiObject: its
// constructor's initial map, no elements, no identity hash), and the node
// gets a fresh wrapper on its next access - Blink's model
// (third_party/blink/renderer/platform/heap/thread_state.cc BlinkRootsHandler).
// A wrapper script used as a weak target can be told from a fresh one, so it
// must never be the one dropped while its node lives: a WeakMap key or
// WeakSet member has an identity hash; a WeakRef or FinalizationRegistry
// target is held strongly by a scavenge; and every one is kept by a full
// collection while script reaches its node (ECMA-262 9.9.3, liveness). Each
// node here is reached only through its tree - the document's, or a detached
// tree script holds - never through its own wrapper.

function nextTask(t) {
  return new Promise(resolve => t.step_timeout(resolve, 0));
}
// Young-generation collections: V8 runs them as its young generation fills,
// and no API asks for one, so fill it several times over with garbage.
function scavenge() {
  let sink = 0;
  for (let round = 0; round < 48; round++) {
    const junk = [];
    for (let i = 0; i < 4096; i++) junk.push({ i, s: "x" + (i & 7) });
    sink += junk.length;
  }
  return sink;
}
// Scavenges, a full collection, then scavenges again: `check` after each.
async function everyCollection(t, check) {
  for (const step of ["scavenges", "full collection", "scavenges again"]) {
    await nextTask(t);
    if (step === "full collection") await TestUtils.gc(); else scavenge();
    for (let i = 0; i < 3; i++) await nextTask(t);
    check(step);
  }
}

const detachedRoot = document.createElement("section");
const inTree = document.body.appendChild(document.createElement("div"));

function useAsWeakTargets(where, map, set, registry) {
  const keyed = where.appendChild(document.createElement("i"));
  const member = where.appendChild(document.createElement("b"));
  const reffed = where.appendChild(document.createElement("u"));
  const registered = where.appendChild(document.createElement("s"));
  map.set(keyed, "keyed");
  set.add(member);
  registry.register(registered, "registered");
  return new WeakRef(reffed);
}

for (const [label, where] of [["in the document's tree", inTree], ["in a detached tree script holds", detachedRoot]]) {
  promise_test(async t => {
    assert_true(!!(self.TestUtils && TestUtils.gc), "TestUtils.gc is available");
    const map = new WeakMap();
    const set = new WeakSet();
    const finalized = [];
    const registry = new FinalizationRegistry(held => finalized.push(held));
    const ref = useAsWeakTargets(where, map, set, registry);
    const control = new WeakRef({});
    await everyCollection(t, step => {
      assert_equals(map.get(where.querySelector("i")), "keyed", `the WeakMap key (${step})`);
      assert_true(set.has(where.querySelector("b")), `the WeakSet member (${step})`);
      assert_equals(ref.deref(), where.querySelector("u"), `the WeakRef target (${step})`);
      assert_array_equals(finalized, [], `no registry callback while the node lives (${step})`);
    });
    // The collections ran: an object nothing reaches went.
    assert_equals(control.deref(), undefined, "the control WeakRef emptied");
  }, `a node's wrapper used as a weak target survives scavenges and full collections, ${label}`);
}
</script>
