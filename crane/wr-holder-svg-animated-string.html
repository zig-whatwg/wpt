<!DOCTYPE html>
<meta charset="utf-8">
<title>Crane: an SVGAnimatedString keeps its element's wrapper</title>
<link rel=help href="https://svgwg.org/svg2-draft/types.html#InterfaceSVGAnimatedString">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
"use strict";
// The wrapper redesign's P6 (tmp/redesign/wrapper-redesign-design.md 3.2
// rule (d), 4.4 "Holders"): a holder whose wrapper is kept keeps the wrappers
// of the nodes it holds for script, and of their trees. An animated property reflects its
// element's attribute live, so it keeps the element (Blink: the property's
// context element, traced).
// Mirrored with every node edge off in tests/v8/wr6_holder_tracing_test.zig.

function nextTask(t) {
  return new Promise(resolve => t.step_timeout(resolve, 0));
}
async function collect(t) {
  for (let i = 0; i < 3; i++) {
    await nextTask(t);
    await TestUtils.gc();
  }
  await nextTask(t);
}

function animatedOfDetached() {
  const a = document.createElementNS("http://www.w3.org/2000/svg", "a");
  a.wr = "a";
  return { anim: a.className, refs: [new WeakRef(a)] };
}

promise_test(async t => {
  assert_true(!!(self.TestUtils && TestUtils.gc), "TestUtils.gc is available");
  const { anim, refs } = animatedOfDetached();
  await collect(t);
  assert_true(anim instanceof SVGAnimatedString);
  assert_not_equals(refs[0].deref(), undefined, "the element's wrapper is kept");
  assert_equals(refs[0].deref().wr, "a");
}, "a held SVGAnimatedString keeps its element's wrapper");

promise_test(async t => {
  const refs = (() => animatedOfDetached().refs)();
  await collect(t);
  assert_equals(refs[0].deref(), undefined, "collected");
}, "a dropped SVGAnimatedString lets its element go");
</script>
