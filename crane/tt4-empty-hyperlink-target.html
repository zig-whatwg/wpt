<!doctype html>
<meta charset="utf-8">
<title>Empty hyperlink targets use the first base target</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/semantics.html#get-an-element's-target">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
let sequence = 0;
for (const tag of ['a', 'area']) {
  for (const target of [null, '', '_self', 'named']) {
    promise_test(async t => {
      const name = 'tt4_base_target_' + ++sequence;
      const destination = document.createElement('iframe');
      destination.name = name;
      const source = document.createElement('iframe');
      t.add_cleanup(() => { source.remove(); destination.remove(); });
      const load = frame => new Promise(resolve => { frame.onload = resolve; });
      const destinationReady = load(destination);
      destination.srcdoc = '<!doctype html><p>target</p>';
      document.body.append(destination);
      await destinationReady;
      const sourceReady = load(source);
      source.srcdoc = '<!doctype html><base href="' + new URL('.', location.href).href +
        '" target="' + name + '"><base href="https://invalid.invalid/" target="_self">' +
        '<' + tag + ' id="link" href="tt4-base-target-destination.html"' +
        (target === null ? '' : ' target="' + (target === 'named' ? name : target) + '"') + '>';
      document.body.append(source);
      await sourceReady;
      const winner = new Promise(resolve => {
        destination.onload = () => resolve(destination);
        source.onload = () => resolve(source);
      });
      source.contentDocument.getElementById('link').click();
      const loaded = await winner;
      assert_equals(loaded, target === '_self' ? source : destination,
        'a nonempty explicit target wins; missing or empty target uses the first base');
      assert_equals(loaded.contentDocument.body.textContent.trim(), 'destination',
        'the first base href resolves the destination URL');
    }, `${tag} target ${target === null ? '(absent)' : JSON.stringify(target)} with two base elements`);
  }
}
</script>
