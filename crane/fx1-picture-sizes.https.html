<!doctype html>
<meta charset="utf-8">
<title>Picture sizes uses CSS math</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/images.html#parse-a-sizes-attribute">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
for (const sizes of ['calc(50px + 50px)', 'min(100px, 200px)', 'max(50px, 100px)']) {
  for (const useSource of [false, true]) {
    promise_test(async t => {
      const picture = document.createElement('picture');
      const source = document.createElement('source');
      const img = document.createElement('img');
      picture.append(source, img);
      document.body.append(picture);
      t.add_cleanup(() => picture.remove());
      const width = Math.ceil(100 * devicePixelRatio);
      const selected = new URL('/images/green.png?fx1=' + encodeURIComponent(sizes) + useSource, location.href).href;
      const oversized = selected + '-large';
      const owner = useSource ? source : img;
      const loaded = new Promise((resolve, reject) => {
        const timer = t.step_timeout(() => reject(new Error('image did not load')), 2500);
        img.onload = () => { clearTimeout(timer); resolve(); };
        img.onerror = () => { clearTimeout(timer); reject(new Error('image failed')); };
      });
      owner.sizes = sizes;
      owner.srcset = selected + ' ' + width + 'w, ' + oversized + ' ' + (10 * width) + 'w';
      img.src = selected + '-fallback';
      await loaded;
      assert_equals(img.currentSrc, selected);
    }, (useSource ? 'source' : 'img') + ' sizes=' + sizes + ' resolves to 100px');
  }
}
</script>
