<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Two hundred consecutive iframe navigations</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  const frame = document.createElement("iframe");
  t.add_cleanup(() => frame.remove());
  document.body.append(frame);
  const start = performance.now();
  for (let index = 0; index < 200; ++index) {
    const loaded = new Promise(resolve => frame.onload = resolve);
    frame.srcdoc = "<!doctype html><body>" + index;
    await loaded;
    assert_equals(frame.contentDocument.body.textContent, String(index), "navigation " + index);
  }
  console.log("NR1 iframe navigation: " + (performance.now() - start).toFixed(3) + " ms for 200 navigations");
}, "An iframe completes 200 consecutive document navigations");
</script>
