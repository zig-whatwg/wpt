<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Repeated event dispatch through a ten-deep tree</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
const root = document.createElement('div');
let leaf = root;
for (let depth = 1; depth < 10; ++depth) {
  leaf = leaf.appendChild(document.createElement('div'));
}
let count = 0;
root.addEventListener('dm2-event', () => ++count);
const started = performance.now();
for (let i = 0; i < 100000; ++i) {
  leaf.dispatchEvent(new Event('dm2-event', { bubbles: true }));
}
const elapsed = performance.now() - started;
// The measured time is the subtest's message, never part of its name: a
// subtest's name is the same in every run, which wpt_runner --verify holds a
// file to (lane bugs1).
const name = 'Dispatch 100000 events through 10 nodes';
add_result_callback(t => {
  if (t.name === name) t.message = (t.message ? t.message + '; ' : '') + elapsed.toFixed(3) + ' ms';
});
test(() => {
  assert_equals(count, 100000);
}, name);
</script>
