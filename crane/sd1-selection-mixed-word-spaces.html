  test(t => {
    const host = document.body.appendChild(document.createElement('div'));
    host.contentEditable = 'true'; host.textContent = c.value;
    t.add_cleanup(() => host.remove());
    const node = host.firstChild, selection = getSelection();
    selection.collapse(node, c.offset);
    selection.modify('move', c.direction, 'word');
    assert_equals(selection.focusNode, node);
    assert_equals(selection.focusOffset, c.expected);
  }, `${c.probe} ${c.label} ${c.direction} from ${c.offset}: raw macOS ${c.actual}, Crane ${c.expected}`);
