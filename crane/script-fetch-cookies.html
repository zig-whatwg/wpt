<!DOCTYPE html>
<title>A script's fetch is populated from its client, cookie jar included</title>
<link rel="help" href="https://fetch.spec.whatwg.org/#populate-request-from-client">
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#fetch-a-classic-script">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// A no-CORS classic script and a CORS module script, both same-origin:
// credentials mode "include" and "same-origin" both send the document's
// cookies, which reach the request through its client.
document.cookie = "crane_script_fetch=1; path=/";
</script>
<script src="/cookies/resources/list-cookies-for-script.py?classic"></script>
<script>
const classic = self._cookies;
self._cookies = undefined;
test(() => {
  assert_true(Array.isArray(classic), "the script ran");
  assert_true(classic.includes("crane_script_fetch"), "cookies: " + classic);
}, "a classic script's request carries the document's cookies");
</script>
<script type="module" src="/cookies/resources/list-cookies-for-script.py?module"></script>
<script>
async_test(t => {
  window.addEventListener("load", t.step_func_done(() => {
    document.cookie = "crane_script_fetch=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/";
    assert_true(Array.isArray(self._cookies), "the module ran");
    assert_true(self._cookies.includes("crane_script_fetch"), "cookies: " + self._cookies);
  }));
}, "a module script's request carries the document's cookies");
</script>
