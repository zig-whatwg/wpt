<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Encoding decoder cost and complete output</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
const pattern = [27, 36, 66, 63, 101, 27, 40, 66, 65];
const input = new Uint8Array(Math.floor(3 * 1024 * 1024 / pattern.length) * pattern.length);
for (let i = 0; i < input.length; i++) input[i] = pattern[i % pattern.length];
const decoder = new TextDecoder('iso-2022-jp');
decoder.decode(input.subarray(0, pattern.length * 1024));
const start = performance.now();
let actual;
for (let round = 0; round < 16; round++) actual = decoder.decode(input);
const elapsed = performance.now() - start;
test(() => {
  assert_equals(actual, '水A'.repeat(input.length / pattern.length));
}, 'TextDecoder iso-2022-jp: ' + elapsed.toFixed(3) + ' ms, 16 x ' + input.length + ' bytes');
</script>
