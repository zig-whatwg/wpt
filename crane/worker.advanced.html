// ============================================================================
// PHASE 20: IMPORTSCRIPTS
// Workers can load additional scripts
// ============================================================================

// Note: importScripts tests require actual files, so we test the function exists
async_test(function(t) {
  var blob = new Blob([
    'self.postMessage(typeof importScripts);'
  ], { type: 'application/javascript' });
  var url = URL.createObjectURL(blob);
  var worker;
  
  t.add_cleanup(function() {
    URL.revokeObjectURL(url);
    if (worker) worker.terminate();
  });
  
  worker = new Worker(url);
  worker.onmessage = t.step_func_done(function(e) {
    assert_equals(e.data, 'function', 'importScripts exists in worker');
  });
}, 'Phase 20.1: importScripts function exists in Worker');

// ============================================================================
// PHASE 30: NESTED WORKER
// ============================================================================

async_test(function(t) {
  var innerWorkerCode = 'self.postMessage("from inner");';
  var outerWorkerCode = [
    'var blob = new Blob([' + JSON.stringify(innerWorkerCode) + '], { type: "application/javascript" });',
    'var url = URL.createObjectURL(blob);',
    'var inner = new Worker(url);',
    'inner.onmessage = function(e) {',
    '  URL.revokeObjectURL(url);',
    '  self.postMessage("outer received: " + e.data);',
    '};'
  ].join('\n');

  var blob = new Blob([outerWorkerCode], { type: 'application/javascript' });
  var url = URL.createObjectURL(blob);
  var worker;

  t.add_cleanup(function() {
    URL.revokeObjectURL(url);
    if (worker) worker.terminate();
  });

  worker = new Worker(url);
  worker.onmessage = t.step_func_done(function(e) {
    assert_equals(e.data, 'outer received: from inner', 'Nested worker works');
  });
}, 'Phase 30.1: Nested Worker (Worker created from Worker) works');

// ============================================================================
// PHASE 32: MODULE WORKER
// ============================================================================

test(function() {
  // Test that the type option is accepted
  var blob = new Blob(['export default 42;'], { type: 'application/javascript' });
  var url = URL.createObjectURL(blob);

  try {
    // Just test that the constructor accepts the type option
    // The actual module loading may fail depending on blob URL support for modules
    var worker = new Worker(url, { type: 'module' });
    worker.terminate();
    URL.revokeObjectURL(url);
    assert_true(true, 'Worker accepts type: module option');
  } catch (e) {
    URL.revokeObjectURL(url);
    // If it throws because modules aren't supported yet, that's informative
    assert_unreached('Worker with type: module threw: ' + e.message);
  }
}, 'Phase 32.1: Worker accepts type: module option');
