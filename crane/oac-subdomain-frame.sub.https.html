<!DOCTYPE html>
<meta charset="utf-8">
<title>Origin-Agent-Cluster: ?1 makes a same-site subdomain frame origin-keyed</title>
<!-- HTML "create and initialize a Document object" step 7: requestsOAC from the response's
     Origin-Agent-Cluster structured header (?1) in a secure context; "obtain a similar-origin window
     agent" then keys the frame's agent cluster by its ORIGIN. So: originAgentCluster is true there, a
     WebAssembly.Module does not cross to it (messageerror), and its document.domain setter returns
     early (step 6), so the two documents never become same origin-domain. The parent sends no header
     and stays site-keyed.
     Lane oac (2026-10-11), from lane serial's ser-oac-subdomain-frame.sub.https.html. -->
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script type="module">
import { insertIframe, sendWasmModule, testGetter } from "/html/browsers/origin/origin-keyed-agent-clusters/resources/helpers.mjs";

promise_setup(() => insertIframe("{{hosts[][www]}}", "?1"));

promise_test(async () => {
  assert_equals(await sendWasmModule(frames[0]), "messageerror");
}, "a module posted to the origin-keyed frame is a messageerror there");

promise_test(async () => {
  // Both documents set document.domain to the parent's host (insertIframe): only the parent's
  // took effect.
  assert_throws_dom("SecurityError", DOMException, () => frames[0].document);
}, "the frame's document.domain setter was a no-op, so no sync access");

testGetter(self, false, "parent");
testGetter(0, true, "child");
</script>
