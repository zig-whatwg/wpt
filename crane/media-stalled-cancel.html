<!doctype html>
<meta charset=utf-8>
<title>Media stalls before data and removal cancels pending work</title>
<link rel=help href="https://html.spec.whatwg.org/multipage/media.html#stall-timeout">
<script src=/resources/testharness.js></script>
<script src=/resources/testharnessreport.js></script>
<body>
<script>
promise_test(async t => {
  const media = document.createElement('video');
  document.body.append(media);
  t.add_cleanup(() => media.remove());
  let errors = 0;
  let progresses = 0;
  media.onerror = () => ++errors;
  media.onprogress = () => ++progresses;
  const stalled = new Promise(resolve => media.addEventListener('stalled', resolve, {once: true}));
  media.src = '/media/sound_5.mp3?pipe=trickle(d4)';
  const event = await stalled;
  assert_true(event.isTrusted);
  assert_equals(media.networkState, media.NETWORK_LOADING);
  assert_equals(progresses, 0, 'no progress without bytes');
  media.remove();
  await new Promise(resolve => t.step_timeout(resolve, 1300));
  assert_equals(errors, 0, 'removal terminates the old fetch silently');
}, 'a fetch stalled before its first byte fires stalled and is cancelled on removal');
</script>
