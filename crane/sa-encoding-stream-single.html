<!doctype html>
<meta charset="utf-8">
<title>TextEncoderStream uses a native transform</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
promise_test(async () => {
  const stream = new TextEncoderStream();
  const writer = stream.writable.getWriter();
  const reader = stream.readable.getReader();
  const write = writer.write('hello');
  const first = await reader.read();
  await write;
  assert_true(first.value instanceof Uint8Array);
  assert_array_equals(first.value, [104,101,108,108,111]);
  const close = writer.close();
  assert_true((await reader.read()).done);
  await close;
}, 'TextEncoderStream encodes input into Uint8Array chunks');
</script>
