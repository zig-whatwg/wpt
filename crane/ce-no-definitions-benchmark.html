<!doctype html>
<meta charset="utf-8">
<title>Custom element reaction bracket cost without definitions</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
// Identical runner inputs before and after; measurements are in the result
// name so the journal's subtest stream retains them without console parsing.
const parent = document.createElement('div');
const child = document.createElement('span');
const samples = [];
for (let sample = 0; sample < 12; sample++) {
  const start = performance.now();
  for (let i = 0; i < 2500; i++) {
    parent.appendChild(child);
    child.setAttribute('data-value', 'present');
    child.removeAttribute('data-value');
    parent.removeChild(child);
  }
  if (sample > 0) samples.push(performance.now() - start);
}
test(() => {
  assert_equals(parent.childNodes.length, 0);
  assert_equals(child.parentNode, null);
  assert_false(child.hasAttribute('data-value'));
}, 'No-definition DOM benchmark, 10000 operations/sample, ms=' + samples.join(','));
</script>
