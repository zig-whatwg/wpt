<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Console cost: 100,000 calls per operation</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
'use strict';
const iterations = 100000;

let start = performance.now();
for (let i = 0; i < iterations; ++i) console.log('iw1 log', i);
let elapsed = performance.now() - start;
test(() => assert_greater_than_equal(elapsed, 0),
     'Console log: ' + elapsed.toFixed(3) + ' ms for 100000 calls');

start = performance.now();
for (let i = 0; i < iterations; ++i) console.count('iw1 counter');
elapsed = performance.now() - start;
test(() => assert_greater_than_equal(elapsed, 0),
     'Console count: ' + elapsed.toFixed(3) + ' ms for 100000 calls');

start = performance.now();
for (let i = 0; i < iterations; ++i) console.time('iw1 timer ' + i);
elapsed = performance.now() - start;
test(() => assert_greater_than_equal(elapsed, 0),
     'Console time: ' + elapsed.toFixed(3) + ' ms for 100000 calls');
</script>
