<!doctype html>
<meta charset="utf-8">
<title>Inline module dependency fetching starts before append returns</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
async_test(t => {
  const url = URL.createObjectURL(new Blob([
    "globalThis.dwInlineBlobDependencyExecuted = true;"
  ], {type: "text/javascript"}));
  const script = document.createElement("script");
  script.type = "module";
  script.textContent = `import ${JSON.stringify(url)}; globalThis.dwInlineBlobFinished();`;
  let appendReturned = false;
  globalThis.dwInlineBlobFinished = t.step_func_done(() => {
    assert_true(appendReturned, "Evaluation remains asynchronous");
    assert_true(globalThis.dwInlineBlobDependencyExecuted, "The dependency executes");
  });
  t.add_cleanup(() => {
    script.remove();
    URL.revokeObjectURL(url);
    delete globalThis.dwInlineBlobFinished;
  });
  script.onerror = t.unreached_func("Revocation must not cancel a started inline dependency fetch");
  document.head.append(script);
  assert_not_equals(globalThis.dwInlineBlobDependencyExecuted, true, "The caller retains control");
  URL.revokeObjectURL(url);
  appendReturned = true;
}, "An inline module starts fetching a known blob dependency before append returns");
</script>
