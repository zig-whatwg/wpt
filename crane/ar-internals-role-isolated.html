<!doctype html>
<meta charset="utf-8">
<title>ElementInternals role stores a nullable default</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/custom-elements.html#accessibility-semantics">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
test(() => {
  customElements.define('ar-isolated-role', class extends HTMLElement {});
  const element = document.createElement('ar-isolated-role');
  const internals = element.attachInternals();
  internals.role = 'button';
  assert_equals(internals.role, 'button');
  assert_false(element.hasAttribute('role'));
}, 'ElementInternals role is stored independently of content attributes');
</script>
