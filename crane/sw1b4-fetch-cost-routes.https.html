<!DOCTYPE html>
<meta charset="utf-8">
<title>Two hundred same-origin fetches from a frame a service worker with ten router rules (none matching) and a pass-through fetch listener controls</title>
<meta name="timeout" content="long">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/sw1-helpers.js"></script>
<body>
<script>
// Lane sw1-b4's cost probe, timed by the runner: against
// sw1b3-fetch-cost-controlled.https.html (the same worker with no routes),
// the stated cost of evaluating ten router rules - URL patterns matched in
// the frame's realm - for every fetch.
const scope = "resources/sw1b4-cost-routes/";
promise_test(async t => {
  await sw1Unregister(scope);
  const registration = await navigator.serviceWorker.register("resources/sw1b4-routes-passthrough-worker.js", { scope });
  t.add_cleanup(() => registration.unregister());
  await sw1WaitForState(registration.installing, "activated");
  const frame = document.createElement("iframe");
  frame.src = "resources/sw1b4-cost-routes/blank.html";
  await new Promise(resolve => { frame.onload = resolve; document.body.appendChild(frame); });
  t.add_cleanup(() => frame.remove());
  const w = frame.contentWindow;
  let bytes = 0;
  for (let index = 0; index < 200; index++) {
    const response = await w.fetch("data.txt?cost=" + index);
    bytes += (await response.text()).length;
  }
  assert_greater_than(bytes, 0);
}, "two hundred fetches, one after another, from a frame a service worker with ten router rules (none matching) controls");
</script>
