<!doctype html>
<meta charset="utf-8">
<title>WebAssembly compile and instantiate 100 modules per batch</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
const bytes = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,
  3,2,1,0,7,10,1,6,97,110,115,119,101,114,0,0,10,6,1,4,0,65,42,11]);
function batch() {
  let sum = 0;
  for (let i = 0; i < 100; ++i)
    sum += new WebAssembly.Instance(new WebAssembly.Module(bytes)).exports.answer();
  return sum;
}
batch();
let sum = 0;
const start = performance.now();
for (let repeat = 0; repeat < 1000; ++repeat) sum += batch();
const elapsed = performance.now() - start;
test(() => assert_equals(sum, 4200000),
  'Wasm 100-module batches: ' + elapsed.toFixed(6) + ' ms for 1000 batches');
</script>
