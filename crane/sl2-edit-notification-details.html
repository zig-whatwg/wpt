<!doctype html>
<meta charset="utf-8">
<title>Text-control edit notification coalescing, unchanged caret and shadow targeting</title>
<link rel="help" href="https://w3c.github.io/selection-api/#selectionchange-event">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<body>
<script>
const settle = t => new Promise(resolve => t.step_timeout(resolve, 100));
for (const tag of ['input', 'textarea']) {
  promise_test(async t => {
    const control = document.createElement(tag);
    document.body.append(control);
    t.add_cleanup(() => control.remove());
    control.value = 'abc';
    control.focus();
    control.setSelectionRange(1, 1, 'none');
    await settle(t);
    const events = [];
    control.addEventListener('selectionchange', e => events.push(e));
    await test_driver.send_keys(control, '\uE017');
    await settle(t);
    assert_equals(control.value, 'ac');
    assert_equals(control.selectionStart, 1);
    assert_equals(control.selectionEnd, 1);
    assert_equals(events.length, 0, 'Deleting after the caret keeps its selection');
  }, tag + ': Delete with unchanged selection queues no event');

  promise_test(async t => {
    const control = document.createElement(tag);
    document.body.append(control);
    t.add_cleanup(() => control.remove());
    control.value = 'hello';
    control.focus();
    control.setSelectionRange(5, 5);
    await settle(t);
    const events = [];
    control.addEventListener('selectionchange', e => events.push(e));
    control.addEventListener('input', () => {
      control.setSelectionRange(2, 2);
      control.setSelectionRange(3, 3);
    }, {once: true});
    await test_driver.send_keys(control, '\uE003');
    await settle(t);
    assert_equals(control.value, 'hell');
    assert_equals(control.selectionStart, 3);
    assert_equals(events.length, 1, 'The edit and its input listener share a task');
  }, tag + ': User edit and API changes in its input listener coalesce');

  promise_test(async t => {
    const host = document.createElement('div');
    const shadow = host.attachShadow({mode: 'open'});
    const control = document.createElement(tag);
    shadow.append(control);
    document.body.append(host);
    t.add_cleanup(() => host.remove());
    control.value = 'hello';
    control.focus();
    control.setSelectionRange(5, 5);
    await settle(t);
    const events = [];
    const record = e => events.push(e);
    document.addEventListener('selectionchange', record);
    control.addEventListener('selectionchange', record);
    t.add_cleanup(() => document.removeEventListener('selectionchange', record));
    await test_driver.send_keys(control, '\uE003');
    await settle(t);
    assert_equals(control.value, 'hell');
    assert_equals(control.selectionStart, 4);
    assert_equals(events.length, 1);
    assert_equals(events[0].target, document);
    assert_false(events[0].bubbles);
    assert_false(events[0].composed);
  }, tag + ': Keyboard edit in a shadow tree notifies the document');
}
</script>
