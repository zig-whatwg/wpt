<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Crane timing: live collections over 10,000 nodes</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<div id=rc5-host></div>
<script>
// Timing page for refcount step 5h (lane rc5): a live collection holds its
// root. Each round replaces a 10,000-element subtree of the document by
// innerHTML (parsed, so no element has a wrapper) and times (a) iterating
// childNodes, (b) children, (c) getElementsByTagName('div') made and
// iterated, and (d) 100 calls of getElementsByTagName('div').length in a
// loop. The times are in the subtest's name; it passes when the counts are
// right.
const rounds = 10;
const markup = '<div></div>'.repeat(10000);
const host = document.getElementById('rc5-host');
function measure(body) {
  let total = 0, count = 0;
  for (let i = 0; i < rounds; i++) {
    host.innerHTML = markup;
    const t0 = performance.now();
    count = body();
    total += performance.now() - t0;
  }
  host.innerHTML = '';
  return { ms: total, count };
}
function iterate(list) {
  let n = 0;
  for (let i = 0; i < list.length; i++) if (list[i].nodeType === 1) n++;
  return n;
}
const a = measure(() => iterate(host.childNodes));
const b = measure(() => iterate(host.children));
const c = measure(() => iterate(host.getElementsByTagName('div')));
const d = measure(() => { let n = 0; for (let i = 0; i < 100; i++) n += host.getElementsByTagName('div').length; return n / 100; });
// One subtest carries every time, so a runner that prints only the start of
// a file's subtest list still shows them all.
test(() => {
  assert_equals(a.count, 10000, 'childNodes');
  assert_equals(b.count, 10000, 'children');
  assert_equals(c.count, 10000, 'getElementsByTagName');
  assert_equals(d.count, 10000, 'repeated getElementsByTagName');
}, 'ms for ' + rounds + ' rounds: childNodes ' + a.ms.toFixed(1) + ' children ' + b.ms.toFixed(1) + ' tagname ' + c.ms.toFixed(1) + ' repeated ' + d.ms.toFixed(1));
</script>
