<title>Typed OM equal-value sets update the style attribute and mutation records</title>
<link rel="help" href="https://drafts.css-houdini.org/css-typed-om-1/#dom-stylepropertymap-set">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
// Q178, Chrome156/Safari27 (3/3 each), 2026-10-29: successful equal sets
// serialize and queue one record; throws and zero-argument appends do neither.
// Same-value shorthands split; use Chrome's uniform mechanism as ruled in
// tmp/probes/q178/RESULT.md. Typed OM §3 set step 10.
test(t => {
  const el = document.createElement('div');
  document.body.append(el);
  t.add_cleanup(() => el.remove());
  const initial = "--foo:";
  el.setAttribute('style', initial);
  const m = el.attributeStyleMap;
  const observer = new MutationObserver(() => {});
  observer.observe(el, {attributes: true, attributeOldValue: true});
  t.add_cleanup(() => observer.disconnect());
  m.set('--foo', new CSSUnparsedValue([]));
  assert_equals(el.getAttribute('style'), "--foo: ;", 'attribute text');
  const records = observer.takeRecords();
  assert_equals(records.length, 1, 'mutation count');
  assert_equals(records[0].type, 'attributes');
  assert_equals(records[0].attributeName, 'style');
  assert_equals(records[0].attributeNamespace, null);
  assert_equals(records[0].target, el);
  assert_equals(records[0].oldValue, initial);
}, "Typed OM equal-value update: empty after raw declaration");
