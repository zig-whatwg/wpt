<!doctype html>
<meta charset="utf-8">
<title>Explicit window.stop aborts a keepalive fetch</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  const frame = document.createElement("iframe");
  t.add_cleanup(() => frame.remove());
  const loaded = new Promise(resolve => frame.onload = resolve);
  frame.src = "/common/blank.html";
  document.body.appendChild(frame);
  await loaded;
  const result = frame.contentWindow.fetch("/common/slow.py?delay=700", {keepalive: true}).then(
    () => assert_unreached("explicit stop should abort the fetch"),
    error => {
      assert_equals(error.name, "AbortError");
      assert_equals(error.constructor, frame.contentWindow.DOMException);
    });
  frame.contentWindow.stop();
  await result;
}, "keepalive survives environment termination but explicit stop rejects it");
</script>
