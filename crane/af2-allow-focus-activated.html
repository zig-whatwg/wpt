<!doctype html>
<meta charset="utf-8">
<title>Allow focus: activated</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#allow-focus-steps">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<body>
<script>
promise_test(async t => {
  const frame = document.createElement('iframe');
  t.add_cleanup(() => frame.remove());
  const result = new Promise(resolve => {
    window.addEventListener('message', t.step_func(event => {
      if (event.source !== frame.contentWindow) return;
      if (event.data.ready) {
        // bless removed its focused child button. Unfocus the remaining
        // iframe chain so autofocus is not suppressed by top-level focus.
        frame.blur();
        assert_equals(document.activeElement, document.body);
        frame.contentWindow.postMessage('af2-resume', '*');
      } else resolve(event.data);
    }));
  });
  frame.src = get_host_info().HTTP_REMOTE_ORIGIN + '/crane/af2-allow-focus-child.html?activation';
  document.body.append(frame);
  const data = await result;
  assert_false('error' in data, data.error);
  assert_true(data.activation, 'the child still has transient activation at insertion');
  assert_equals(data.automatic, true, 'autofocus insertion uses allow focus');
  assert_equals(data.scripted, true, 'focus() uses allow focus');
}, 'Autofocus and focus() apply the activated permission default and activation');
</script>
