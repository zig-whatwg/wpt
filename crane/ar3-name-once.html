<h3 id="target"><a href="#" aria-labelledby="picture">Skipped</a> <a id="second" href="#">Second <img id="picture" alt="Picture" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="> Last</a></h3>

promise_test(async () => {
