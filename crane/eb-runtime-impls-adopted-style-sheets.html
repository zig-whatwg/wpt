<!DOCTYPE html>
<meta charset="utf-8">
<title>document.adoptedStyleSheets is an observable array: an Array to script, the same one each read</title>
<link rel="help" href="https://drafts.csswg.org/cssom/#dom-documentorshadowroot-adoptedstylesheets">
<link rel="help" href="https://webidl.spec.whatwg.org/#es-observable-array">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
test(() => {
  const sheets = document.adoptedStyleSheets;
  assert_true(Array.isArray(sheets));
  assert_equals(sheets.length, 0);
  assert_equals(Object.getPrototypeOf(sheets), Array.prototype);
  assert_equals(document.adoptedStyleSheets, sheets, "[SameObject]");
}, "an empty observable array");
</script>
