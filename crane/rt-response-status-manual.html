<!doctype html>
<meta charset="utf-8">
<title>Manual redirects hide response status in resource timing</title>
<link rel="help" href="https://fetch.spec.whatwg.org/#fetch-finale">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
promise_test(async t => {
  const url = new URL('/common/blank.html?pipe=status(302)|header(Location,/common/blank.html)&rt-manual=' + Math.random(), location.href);
  let resolveEntry;
  const observed = new Promise(resolve => resolveEntry = resolve);
  const observer = new PerformanceObserver(list => {
    for (const entry of list.getEntries()) {
      if (entry.name === url.href) resolveEntry(entry);
    }
  });
  observer.observe({entryTypes: ['resource']});
  t.add_cleanup(() => observer.disconnect());
  const response = await fetch(url, {redirect: 'manual'});
  const entry = await observed;
  assert_equals(response.type, 'opaqueredirect');
  assert_equals(response.status, 0);
  assert_equals(entry.responseStatus, 0);
}, 'A same-origin manual redirect has responseStatus zero');
</script>
