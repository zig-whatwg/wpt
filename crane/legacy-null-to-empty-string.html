<!doctype html>
<meta charset=utf-8>
<title>[LegacyNullToEmptyString] converts null to "", not "null"</title>
<link rel=help href="https://webidl.spec.whatwg.org/#LegacyNullToEmptyString">
<script src=/resources/testharness.js></script>
<script src=/resources/testharnessreport.js></script>
<div id=log></div>
<script>
test(() => {
  const d = document.implementation.createDocument(null, null, null);
  assert_equals(d.childNodes.length, 0, "no document element");
  d.appendChild(d.createElement("x"));
  assert_equals(d.documentElement.localName, "x");
}, "an operation argument: DOMImplementation.createDocument(ns, null)");

test(() => {
  const t = document.createTextNode("abc");
  t.data = null;
  assert_equals(t.data, "");
}, "an attribute setter: CharacterData.data = null");

test(() => {
  const div = document.createElement("div");
  div.innerHTML = null;
  assert_equals(div.innerHTML, "");
  assert_equals(div.childNodes.length, 0);
}, "an attribute setter from a mixin: innerHTML = null");

test(() => {
  const t = document.createTextNode("abc");
  t.data = undefined;
  assert_equals(t.data, "undefined");
}, "undefined is not null");
</script>
