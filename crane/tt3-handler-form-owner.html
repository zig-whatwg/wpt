<!doctype html>
<meta charset="utf-8">
<title>Inline handlers include the form owner's object environment</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/webappapis.html#getting-the-current-value-of-the-event-handler">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
test(t => {
  const form = document.createElement("form");
  const input = document.createElement("input");
  document.body.append(form);
  form.append(input);
  t.add_cleanup(() => form.remove());
  input.setAttribute("onclick", "return elements;");
  assert_equals(input.onclick(), form.elements);
}, "a connected input's inline handler resolves names on its form owner");
</script>
