<!doctype html>
<meta charset="utf-8">
<title>Shadow text control selectionchange targets the document</title>
<link rel="help" href="https://w3c.github.io/selection-api/#selectionchange-event">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body><script>
const tick = t => new Promise(resolve => t.step_timeout(resolve, 20));
for (const mode of ['open', 'closed']) {
  promise_test(async t => {
    const host = document.createElement('div');
    document.body.append(host);
    t.add_cleanup(() => host.remove());
    const root = host.attachShadow({mode});
    const input = document.createElement('input');
    const textarea = document.createElement('textarea');
    input.value = textarea.value = 'abcdef';
    root.append(input, textarea);
    input.setSelectionRange(0, 0);
    textarea.setSelectionRange(0, 0);
    getSelection().removeAllRanges();
    await tick(t);
    const events = [];
    let controlEvents = 0;
    const listener = e => events.push(e);
    document.addEventListener('selectionchange', listener);
    t.add_cleanup(() => document.removeEventListener('selectionchange', listener));
    input.onselectionchange = textarea.onselectionchange = () => ++controlEvents;
    input.setSelectionRange(1, 3);
    textarea.setSelectionRange(2, 4);
    assert_equals(events.length, 0);
    await tick(t);
    assert_equals(events.length, 1, 'shadow controls share document coalescing');
    assert_equals(events[0].target, document);
    assert_false(events[0].bubbles);
    assert_false(events[0].cancelable);
    assert_false(events[0].composed);
    assert_equals(controlEvents, 0, 'do not dispatch an element event through the shadow boundary');
    assert_equals(getSelection().rangeCount, 0, 'notification does not invent a DOM Range');
  }, `${mode} shadow text controls coalesce selectionchange at their document`);
}
</script>
