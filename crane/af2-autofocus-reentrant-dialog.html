<!doctype html>
<meta charset="utf-8">
<title>Dialog autofocus completion survives control removal and collection</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#flush-autofocus-candidates">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
promise_test(async t => {
  const dialog = document.createElement('dialog');
  dialog.innerHTML = '<input>';
  document.body.append(dialog);
  t.add_cleanup(() => dialog.remove());
  let focused = 0;
  dialog.firstChild.addEventListener('focus', t.step_func(event => {
    ++focused;
    event.target.remove();
    TestUtils.gc();
  }));
  dialog.show();
  assert_equals(focused, 1, 'the removed control received focus');
  dialog.close();
  const later = document.createElement('input');
  t.add_cleanup(() => later.remove());
  later.autofocus = true;
  document.body.append(later);
  await new Promise(resolve => requestAnimationFrame(resolve));
  assert_not_equals(document.activeElement, later, 'dialog completion prevents later automatic focus');
}, 'Dialog completes autofocus after its focus handler removes and collects the control');
</script>
