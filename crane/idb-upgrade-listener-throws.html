<!doctype html>
<meta charset="utf-8">
<title>Throwing an upgrade listener aborts the upgrade transaction</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
setup({allow_uncaught_exception: true});
for (const handler of [false, true]) {
  async_test(t => {
    const expected = new Error('expected upgrade throw');
    const onError = event => {
      if (event.error === expected) event.preventDefault();
    };
    window.addEventListener('error', onError);
    t.add_cleanup(() => window.removeEventListener('error', onError));
    const request = indexedDB.open('crane-idb-throw-' + handler, 1);
    const thrower = () => { throw expected; };
    if (handler) request.onupgradeneeded = thrower;
    else request.addEventListener('upgradeneeded', thrower);
    request.onsuccess = t.unreached_func('throwing upgrade must not succeed');
    request.onerror = t.step_func_done(event => {
      event.preventDefault();
      assert_equals(request.error.name, 'AbortError');
      assert_equals(request.transaction, null);
      indexedDB.deleteDatabase('crane-idb-throw-' + handler);
    });
  }, 'throwing ' + (handler ? 'onupgradeneeded handler' : 'upgrade listener') + ' aborts');
}
</script>
