<!doctype html>
<meta charset="utf-8">
<title>IndexedDB cursor key getters and iteration realms</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/IndexedDB/resources/support-promises.js"></script>
<body>
<script>
for (const [method, args] of [
  ['continue', []], ['advance', [1]], ['continuePrimaryKey', [[0], [2]]]
]) {
  promise_test(async t => {
    const frame = document.createElement('iframe');
    t.add_cleanup(() => { frame.remove(); });
    const loaded = new Promise((resolve, reject) => {
      frame.onload = resolve;
      frame.onerror = () => reject(new Error('iframe failed to load'));
    });
    document.body.append(frame);
    await loaded;
    const foreign = frame.contentWindow;
    const db = await createDatabase(t, db => {
      const store = db.createObjectStore('records');
      store.createIndex('by_bucket', 'bucket');
      store.put({bucket: [0], number: 1}, [1]);
      store.put({bucket: [0], number: 2}, [2]);
    });
    const transaction = db.transaction('records');
    const request = transaction.objectStore('records').index('by_bucket').openCursor();
    const watcher = new EventWatcher(t, request, ['success', 'error']);
    const completed = promiseForTransaction(t, transaction);
    await watcher.wait_for('success');
    const cursor = request.result;
    assert_equals(Object.getPrototypeOf(cursor.key), Array.prototype, 'initial key');
    assert_equals(Object.getPrototypeOf(cursor.primaryKey), Array.prototype, 'initial primary key');
    const next = watcher.wait_for('success');
    foreign.IDBCursor.prototype[method].call(cursor, ...args);
    await Promise.all([next, completed]);
    assert_equals(request.result, cursor, 'same cursor');
    assert_equals(Object.getPrototypeOf(cursor), IDBCursorWithValue.prototype, 'same object realm');
    assert_array_equals(cursor.key, [0]);
    assert_array_equals(cursor.primaryKey, [2]);
    assert_equals(Object.getPrototypeOf(cursor.key), Array.prototype,
                  'key getter realm after foreign iteration');
    assert_equals(Object.getPrototypeOf(cursor.primaryKey), Array.prototype,
                  'primary key getter realm after foreign iteration');
    assert_equals(Object.getPrototypeOf(cursor.value), foreign.Object.prototype, 'iteration value realm');
  }, 'Cursor.' + method + ' preserves the key getter realm independently of its iteration realm');
}
</script>
