<!doctype html>
<title>Detached SVG script trees remain usable after removechild</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
test(() => {
  const host = document.body.appendChild(document.createElement('div'));
  const markup = '<svg><script>1<\/script></svg>';
  host.innerHTML = markup;
  const retained = host.firstChild.firstChild;
  host.firstChild.removeChild(host.firstChild.firstChild);
  assert_equals(retained.parentNode, null);
  assert_equals(retained.textContent, '1');
  host.firstChild.appendChild(retained);
  assert_not_equals(retained.parentNode, null);
  assert_equals(retained.textContent, '1');

  const unretained = document.body.appendChild(document.createElement('div'));
  {
    const host = unretained;
    host.innerHTML = markup;
    host.firstChild.removeChild(host.firstChild.firstChild);
  }
  assert_equals(unretained.textContent, '');
}, 'Retained removed trees are usable; unreferenced removed trees need no script cleanup');
</script>
