<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Animated-values cost: one running animation beside 10,000 unanimated elements (lane rendering3)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<div id="spinner"></div>
<div id="page"></div>
<script>
"use strict";
// One running animation must move only its target's style: reading the
// computed style of unanimated elements every frame stays as cheap as with
// no animation at all (the style key is per target). Identical inputs before
// and after; the time is in the result name.
setup({ explicit_done: true });
const page = document.getElementById("page");
const kinds = ["div", "span", "p", "a", "section"];
const elements = [];
for (let i = 0; i < 10000; i++) {
  const e = document.createElement(kinds[i % kinds.length]);
  if (i % 3 == 0) e.className = "c" + (i % 7);
  elements.push(e);
  page.appendChild(e);
}
const sample = elements.filter((_, i) => i % 200 == 7);
for (const e of elements) getComputedStyle(e).color;

(async () => {
  const spinner = document.getElementById("spinner");
  const animation = spinner.animate({ opacity: [0, 1] }, { duration: 100000 });
  let reads = 0;
  let spent = 0;
  for (let frame = 0; frame < 60; frame++) {
    await new Promise(resolve => requestAnimationFrame(resolve));
    const start = performance.now();
    for (const e of sample) {
      if (getComputedStyle(e).opacity === "1") reads++;
    }
    spent += performance.now() - start;
  }
  animation.cancel();
  test(() => {
    assert_equals(reads, 60 * sample.length);
  }, "60 frames of one running animation, 50 unanimated computed-style reads per frame: " + spent.toFixed(3) + " ms");
  done();
})();
</script>
</body>
