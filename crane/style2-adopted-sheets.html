<!doctype html>
<meta charset="utf-8">
<title>Crane style2: adoptedStyleSheets</title>
<link rel="help" href="https://drafts.csswg.org/cssom-1/#dom-documentorshadowroot-adoptedstylesheets">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>#t { color: rgb(1, 1, 1); }</style>
<div id="t"></div>
<script>
const t = document.getElementById("t");
const color = () => getComputedStyle(t).color;

test(() => {
  const a = document.adoptedStyleSheets;
  assert_true(Array.isArray(a));
  assert_equals(a.length, 0);
  assert_equals(document.adoptedStyleSheets, a, "the same array each time");
}, "adoptedStyleSheets is an observable array");

test(() => {
  const s = new CSSStyleSheet();
  s.replaceSync("#t { color: rgb(2, 2, 2) }");
  document.adoptedStyleSheets = [s];
  assert_equals(document.adoptedStyleSheets.length, 1);
  assert_equals(document.adoptedStyleSheets[0], s);
  assert_equals(color(), "rgb(2, 2, 2)", "an adopted sheet applies, after the document's own");
  s.replaceSync("#t { color: rgb(3, 3, 3) }");
  assert_equals(color(), "rgb(3, 3, 3)", "edits of an adopted sheet apply");
  s.disabled = true;
  assert_equals(color(), "rgb(1, 1, 1)", "a disabled adopted sheet does not apply");
  s.disabled = false;
  const later = new CSSStyleSheet();
  later.replaceSync("#t { color: rgb(4, 4, 4) }");
  document.adoptedStyleSheets.push(later);
  assert_equals(color(), "rgb(4, 4, 4)", "array order");
  document.adoptedStyleSheets.pop();
  assert_equals(color(), "rgb(3, 3, 3)");
  document.adoptedStyleSheets.length = 0;
  assert_equals(color(), "rgb(1, 1, 1)", "an emptied array adopts nothing");
}, "Adopted sheets join the cascade in array order");

test(() => {
  const own = document.querySelector("style").sheet;
  assert_throws_dom("NotAllowedError", () => { document.adoptedStyleSheets = [own]; }, "a sheet that is not constructed");
  assert_equals(document.adoptedStyleSheets.length, 0);
  assert_throws_js(TypeError, () => { document.adoptedStyleSheets = [{}]; }, "a value that is no CSSStyleSheet");
  assert_throws_js(TypeError, () => { document.adoptedStyleSheets.push(1); });
  const s = new CSSStyleSheet();
  document.adoptedStyleSheets = [s, s];
  assert_equals(document.adoptedStyleSheets.length, 2, "the same sheet twice");
  document.adoptedStyleSheets = [];
}, "Only this document's constructed sheets can be adopted");

promise_test(async () => {
  const frame = document.createElement("iframe");
  document.body.appendChild(frame);
  await new Promise(r => { if (frame.contentDocument.readyState === "complete") r(); else frame.onload = r; });
  const other = new frame.contentWindow.CSSStyleSheet();
  assert_throws_dom("NotAllowedError", () => { document.adoptedStyleSheets = [other]; }, "another document's constructed sheet");
  frame.contentDocument.adoptedStyleSheets = [other];
  assert_equals(frame.contentDocument.adoptedStyleSheets[0], other);
  frame.remove();
}, "A constructed sheet belongs to its constructor document");

test(() => {
  const host = document.createElement("div");
  document.body.appendChild(host);
  const root = host.attachShadow({ mode: "open" });
  assert_true(Array.isArray(root.adoptedStyleSheets));
  const s = new CSSStyleSheet();
  root.adoptedStyleSheets = [s];
  assert_equals(root.adoptedStyleSheets[0], s, "a shadow root adopts its document's sheets");
  assert_equals(document.adoptedStyleSheets.length, 0, "and not into the document's");
  host.remove();
}, "shadowRoot.adoptedStyleSheets");
</script>
